name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info is most of a GPUI build's disk footprint and nothing in CI reads it.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  spec:
    name: forge-spec is GPUI-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: forge-spec must not depend on any GPUI build
        run: |
          if cargo tree -p forge-spec --locked -e normal | grep -E '(^|[^a-z-])(gpui|gpui-pre|bezel-gpui|adabraka-gpui)( |$)'; then
            echo "::error::forge-spec depends on GPUI"; exit 1
          fi
      - run: cargo test -p forge-spec --locked

  test:
    name: Test (${{ matrix.os }}, base gpui-kit)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: rui314/setup-mold@v1
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev vulkan-validationlayers libvulkan1 \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good
      - name: Install GStreamer (macOS)
        if: runner.os == 'macOS'
        run: brew install gstreamer
      - name: Install GStreamer (Windows)
        if: runner.os == 'Windows'
        uses: blinemedical/setup-gstreamer@v1
        with:
          # 1.28.x ships .exe installers — the action's .msi URL scheme only
          # works through 1.26.x; pin the newest 1.26 release.
          version: "1.26.11"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings
      - name: Test
        run: cargo test --workspace --locked

  base-guards:
    name: Base feature guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Unimplemented and conflicting base selections must fail to compile
        run: |
          # bezel and gpui02 are implemented bases — they compile. adabraka lives in
          # its own workspace (links conflict) and "" / two bases must still fail.
          for features in "" base-adabraka base-bezel,base-gpui02; do
            if cargo check -p gpui-forge-runtime --locked --no-default-features --features "$features" 2>/dev/null; then
              echo "::error::'$features' unexpectedly compiled"; exit 1
            fi
            echo "ok: '$features' rejected"
          done

  e2e:
    name: forge build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: rui314/setup-mold@v1
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev libasound2-dev vulkan-validationlayers libvulkan1 xvfb
      - name: Compile the example app to a native binary
        run: cargo run -p forge-cli --locked -- build crates/forge-studio/welcome.forge.yaml -o /tmp/forge-welcome
      - name: Smoke test — the binary launches and stays alive under xvfb
        run: |
          code=0
          timeout 20 xvfb-run -a /tmp/forge-welcome || code=$?
          # 124 = timeout killed a still-running app — the launch succeeded.
          if [ "$code" -ne 124 ]; then
            echo "::error::app exited early with code $code"; exit 1
          fi
