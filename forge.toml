# GPUI Forge workspace manifest.
#
# `forge` commands open a project only when it's named — a directory or
# forge.toml argument, or the current directory for bare invocations. A
# document's own `meta:`/`base:` always wins where both exist; the manifest
# fills in what the document leaves out.

[package]
name = "gpui-forge"
version = "0.9.1"
id = "dev.forge.gpui-forge"
title = "GPUI Forge"
icon = "gpui_forge_icon_medallion.svg"

[forge]
base = "gpui-kit"
# Entry document for `forge build`/`preview`/`package` run with no doc path —
# point it at whichever doc you're working on.
document = "crates/forge-studio/studio.forge.yaml"
# Studio hot-reload: opened docs swap in on save (their own `meta.watch`
# also enables it per-file), and this manifest re-applies on change.
watch = true
# Multi-doc apps list every document explicitly — `forge skeleton` builds
# exactly this set, never a directory scan (entry `document` is always in).
# documents = [
#   "crates/forge-studio/studio.forge.yaml",
#   "examples/demos/ely-terminal.forge.yaml",
# ]

# [themes]
# Project theme JSONs merge into the shipped catalog on `forge build`/
# `skeleton` — a same-named file replaces the shipped theme. Defaults to
# `./themes` beside this manifest when uncommented out entirely.
# dir = "themes"

# [icons]
# Iconset for document icons (`Icon` elements, `icon:` props) — `lucide`
# (bundled) by default. A set name resolves `icons/<set>/<name>.svg` against
# the project's assets dir. A doc's own `meta.iconset` overrides this.
# set = "heroicons"

# [libraries]
# Extra dependency pins added to generated app Cargo.toml (`use:` imports
# already pin adapter crates — this is for everything else).
