[workspace]
members = [
    "crates/forge-hooks",
    "crates/forge-hooks-macros","crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/skamansam/gpui-forge"

[workspace.dependencies]
forge-spec = { path = "crates/forge-spec" }
gpui-forge-runtime = { path = "crates/gpui-forge-runtime", default-features = false }
# The gpui-kit base pins the whole GPUI graph (gpui-pre =0.3.9) through gpui-kit.
gpui-kit = "=0.8.1"
saphyr-parser = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Size-oriented build of the docs-site canvas (`site/scripts/build-canvas.sh`).
[profile.web]
inherits = "release"
opt-level = "s"
strip = true

# xattr 0.2.3 reads libc::ENOATTR on Linux, where glibc has no such errno — the
# vendored 0.2.4 maps it to ENODATA (the Linux equivalent) and keeps ENOATTR on
# macOS/BSD. Pulled by zed-async-tar → gpui_http_client → gpui 0.2.2 (gpui02).
[patch.crates-io]
bezel-gpui-web = { path = "vendor/bezel-gpui-web" }
xattr = { path = "vendor/xattr" }
