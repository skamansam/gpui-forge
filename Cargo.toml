[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/skamansam/gpui-forge"

[workspace.dependencies]
forge-spec = { path = "crates/forge-spec" }
gpui-forge-runtime = { path = "crates/gpui-forge-runtime", default-features = false }
# The gpui-kit base pins the whole GPUI graph (gpui-pre =0.3.9) through gpui-kit.
gpui-kit = "=0.8.0"
saphyr-parser = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Size-oriented build of the docs-site canvas (`site/scripts/build-canvas.sh`).
[profile.web]
inherits = "release"
opt-level = "s"
strip = true
