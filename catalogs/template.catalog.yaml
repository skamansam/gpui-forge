# Template adapter catalog — see docs/guide/adapters.md and
# docs/spec/catalog-manifest.md for the full schema.
catalog: "0.1"
library: template-lib      # what `use: alias: template-lib` imports
name: Template Library
version: 0.1.0
license: MIT
bases:
  gpui-kit: "^0.8"

elements:
  Pill:
    summary: A rounded badge built on plain gpui primitives.
    component: my_lib::Pill
    content: label
    children: none
    props:
      label: string
      variant:
        type: enum
        values: [Info, Warning]
        default: Info
