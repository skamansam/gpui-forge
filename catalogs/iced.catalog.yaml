# yaml-language-server: $schema=../schema/catalog-1.0.json
# Catalog manifest for the iced base — Elm-style widgets over winit/wgpu.
# Scaffold for #113.
# Format: docs/spec/catalog-manifest.md
catalog: "1.0"
library: iced
name: Iced
version: 0.1.0
license: MIT
bases:
  iced: "*"

elements:
  VStack:
    icon: rows-3
    group: Layout
    summary: Vertical widget column (iced `column`).
    component: iced::widget::Column
    canvas: VStack
    children: any

  HStack:
    icon: columns-3
    group: Layout
    summary: Horizontal widget row (iced `row`).
    component: iced::widget::Row
    canvas: HStack
    children: any

  Container:
    icon: square
    group: Layout
    summary: Sized/styled single-child wrapper.
    component: iced::widget::Container
    canvas: GroupBox
    children: any

  Text:
    icon: pilcrow
    group: Display
    summary: A run of text.
    component: iced::widget::Text
    canvas: Text
    content: text
    props:
      text:
        type: string
        required: true
      size: number

  Button:
    icon: mouse-pointer-click
    group: Input
    summary: Clickable button — `on click:` is the Elm message.
    component: iced::widget::Button
    canvas: Button
    content: label
    props:
      label: string
      disabled:
        type: bool
        default: false
    events:
      click:

  Input:
    icon: text-cursor-input
    group: Input
    summary: Single-line text input (iced `text_input`).
    component: iced::widget::TextInput
    canvas: Input
    props:
      placeholder: string
      value: string
    events:
      change:

  Checkbox:
    icon: square-check
    group: Input
    summary: Labelled checkbox.
    component: iced::widget::Checkbox
    canvas: Checkbox
    content: label
    props:
      label: string
      checked:
        type: bool
        default: false
    events:
      change:

  Switch:
    icon: toggle-left
    group: Input
    summary: On/off toggler.
    component: iced::widget::Toggler
    canvas: Switch
    content: label
    props:
      label: string
      checked:
        type: bool
        default: false
    events:
      change:

  Slider:
    icon: sliders-horizontal
    group: Input
    summary: Numeric slider over a range.
    component: iced::widget::Slider
    canvas: Slider
    props:
      min: number
      max: number
      value: number
    events:
      change:

  Progress:
    icon: rectangle-horizontal
    group: Feedback
    summary: Progress bar over a range.
    component: iced::widget::ProgressBar
    canvas: Progress
    props:
      min: number
      max: number
      value: number

  Scrollable:
    icon: scroll
    group: Layout
    summary: Scrollable container.
    component: iced::widget::Scrollable
    canvas: GroupBox
    children: any
  Canvas:
    icon: circle-dot
    group: Components
    summary: "Canvas — iced, via Box."
    canvas: Box
    children: any

  ComboBox:
    icon: circle-dot
    group: Components
    summary: "ComboBox — iced, via Combobox."
    canvas: Combobox
    children: any

  Image:
    icon: circle-dot
    group: Components
    summary: "Image — iced, via Image."
    canvas: Image
    children: any

  KeyedColumn:
    icon: circle-dot
    group: Components
    summary: "KeyedColumn — iced, via VStack."
    canvas: VStack
    children: any

  Markdown:
    icon: circle-dot
    group: Components
    summary: "Markdown — iced, via TextView."
    canvas: TextView
    children: any

  PaneGrid:
    icon: circle-dot
    group: Components
    summary: "PaneGrid — iced, via Resizable."
    canvas: Resizable
    children: any

  PickList:
    icon: circle-dot
    group: Components
    summary: "PickList — iced, via Select."
    canvas: Select
    children: any

  Radio:
    icon: circle-dot
    group: Components
    summary: "Radio — iced, via RadioGroup."
    canvas: RadioGroup
    children: any

  Rule:
    icon: circle-dot
    group: Components
    summary: "Rule — iced, via Separator."
    canvas: Separator
    children: any

  Space:
    icon: circle-dot
    group: Components
    summary: "Space — iced, via Box."
    canvas: Box
    children: any

  Stack:
    icon: circle-dot
    group: Components
    summary: "Stack — iced, via Box."
    canvas: Box
    children: any

  Svg:
    icon: circle-dot
    group: Components
    summary: "Svg — iced, via Image."
    canvas: Image
    children: any

  Table:
    icon: circle-dot
    group: Components
    summary: "Table — iced, via Table."
    canvas: Table
    children: any

  TextEditor:
    icon: circle-dot
    group: Components
    summary: "TextEditor — iced, via Editor."
    canvas: Editor
    children: any

  VerticalSlider:
    icon: circle-dot
    group: Components
    summary: "VerticalSlider — iced, via Slider."
    canvas: Slider
    children: any


  MouseArea:
    icon: mouse-pointer
    group: Components
    summary: Pointer-event wrapper — routes `on click` to hooks.
    component: iced::widget::MouseArea
    canvas: MouseArea
    children: any
    events:
      click:

  Tooltip:
    icon: message-square
    group: Components
    summary: Hover tooltip over the child element.
    component: iced::widget::Tooltip
    canvas: Tooltip
    children: any
    props:
      tip: string
      position:
        type: enum
        values: [top, bottom, left, right]
        default: top
