# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the gpui-kit base library (core subset).
# Format: docs/spec/catalog-manifest.md
catalog: "0.1"
library: gpui-kit
name: GPUI Kit
version: 0.8.0
license: Apache-2.0
bases:
  gpui-kit: "^0.8"

elements:
  Box:
    icon: square
    group: Layout
    summary: Plain container; layout comes entirely from `style`.
    component: gpui::Div
    children: any

  VStack:
    icon: rows-3
    group: Layout
    summary: Vertical flex container.
    component: gpui_kit::base::v_flex
    children: any

  HStack:
    icon: columns-3
    group: Layout
    summary: Horizontal flex container; children stretch on the cross axis by default.
    component: gpui::Div
    children: any

  Dialog:
    icon: app-window
    group: Windows
    summary: A top-level `Dialog#id:` declaration — opened via `open_dialog(name)`;
      inline usage renders its contents in a bordered box. The `resizable` flag
      adds a corner-drag grip; the declared `width`/`height` is then the initial size.
    component: gpui_kit::component::dialog::Dialog
    props:
      title: string
      resizable: bool
    children: any

  Settings:
    icon: settings
    group: Windows
    summary: Grouped settings pages.
    component: gpui_kit::component::setting::Settings
    children: any

  SettingPage:
    icon: book-open
    group: Windows
    summary: A page inside `Settings`.
    component: gpui_kit::component::setting::SettingPage
    content: text
    props:
      text: string
    children: any

  SettingsGroup:
    icon: folder-tree
    group: Windows
    summary: A titled group of `SettingItem`s inside a `SettingPage`.
    component: gpui_kit::component::setting::SettingGroup
    content: text
    props:
      text: string
    children: any

  SettingItem:
    icon: pen-line
    group: Windows
    summary: A row inside a `SettingsGroup` — a title plus a field element.
    component: gpui_kit::component::setting::SettingItem
    content: text
    props:
      text: string
    children: any

  Text:
    icon: type
    group: Display
    summary: A run of text.
    component: gpui::SharedString
    content: text
    props:
      text:
        type: string
        required: true

  Label:
    icon: tag
    group: Display
    summary: Text with an optional secondary line.
    component: gpui_kit::component::label::Label
    content: text
    props:
      text:
        type: string
        required: true
      secondary: string
      masked:
        type: bool
        default: false

  Button:
    icon: mouse-pointer-click
    group: Input
    summary: Clickable button.
    component: gpui_kit::component::button::Button
    content: label
    props:
      label: string
      variant:
        type: enum
        values: [Default, Primary, Secondary, Danger, Info, Success, Warning, Ghost, Link, Text]
        default: Default
      size:
        type: enum
        values: [XSmall, Small, Medium, Large]
        default: Medium
      icon: icon
      disabled:
        type: bool
        default: false
      loading:
        type: bool
        default: false
      outline:
        type: bool
        default: false
      compact:
        type: bool
        default: false
      tooltip: string
    events:
      click:

  Input:
    icon: text-cursor-input
    group: Input
    summary: Single-line text input.
    component: gpui_kit::component::input::Input
    content: value
    props:
      value:
        type: string
        bindable: true
      placeholder: string
      disabled:
        type: bool
        default: false
      readonly:
        type: bool
        default: false
      cleanable:
        type: bool
        default: false
      masked:
        type: bool
        default: false
        summary: Hide the text, for passwords.
    events:
      change: string
      submit: string

  Textarea:
    icon: text
    group: Input
    summary: Multi-line text input.
    component: gpui_kit::component::input::Textarea
    content: value
    props:
      value:
        type: string
        bindable: true
      placeholder: string
      rows:
        type: number
        summary: Minimum number of visible rows.
      height:
        type: length
        summary: Fixed height; `100%` fills the parent.
      disabled:
        type: bool
        default: false
      readonly:
        type: bool
        default: false
    events:
      change: string

  Editor:
    icon: pen
    group: Input
    summary: Code editor with line numbers and optional syntax highlighting.
    component: gpui_kit::component::input::Editor
    content: value
    props:
      value:
        type: string
        bindable: true
      placeholder: string
      language:
        type: string
        summary: Active highlighter language, e.g. `yaml`.
      languages:
        type: list<string>
        summary: Languages this editor may switch between. Declared; a language picker is not wired yet.
      highlighting:
        type: map
        summary: 'Nested form of the flat props: `{languages: [yaml], default: yaml, show-selection: true}`.'
      show-selection:
        type: bool
        default: true
        summary: Whether the selection is drawn. Declared; not applied yet (no component API).
      height:
        type: length
        summary: Fixed height; `100%` fills the parent.
      diagnostics:
        type: list<map>
        summary: 'Squiggle markers: a list of `{line, col, end_col?, severity?,
          message, hint?}` maps (1-based line/col, severity error|warning|info|hint).
          Usually bound — `$studio.markers` — and fed by `forge check`.'
      disabled:
        type: bool
        default: false
      readonly:
        type: bool
        default: false
    events:
      change: string

  Checkbox:
    icon: square-check
    group: Input
    summary: Checkbox with an optional label.
    component: gpui_kit::component::checkbox::Checkbox
    content: label
    props:
      label: string
      checked:
        type: bool
        default: false
        bindable: true
      disabled:
        type: bool
        default: false
    events:
      change: bool

  Switch:
    icon: toggle-left
    group: Input
    summary: On/off toggle.
    component: gpui_kit::component::switch::Switch
    content: label
    props:
      label: string
      checked:
        type: bool
        default: false
        bindable: true
      disabled:
        type: bool
        default: false
    events:
      change: bool

  RadioGroup:
    icon: circle-dot
    group: Input
    summary: A set of mutually exclusive options.
    component: gpui_kit::component::radio::RadioGroup
    props:
      selected:
        type: number
        bindable: true
        summary: Index of the selected `Radio`.
      layout:
        type: enum
        values: [Vertical, Horizontal]
        default: Vertical
      disabled:
        type: bool
        default: false
    events:
      change: number
    children: [Radio]

  Radio:
    icon: circle-dot
    group: Input
    summary: One option of a `RadioGroup`.
    component: gpui_kit::component::radio::Radio
    content: label
    props:
      label: string
      disabled:
        type: bool
        default: false

  Select:
    icon: square-chevron-down
    group: Input
    summary: Dropdown for picking one option.
    component: gpui_kit::component::select::Select
    props:
      value:
        type: string
        bindable: true
      options:
        type: list<string>
        required: true
      placeholder: string
      searchable:
        type: bool
        default: false
      cleanable:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
    events:
      change: string

  Tabs:
    icon: layout-panel-top
    group: Navigation
    summary: Tab bar; each `Tab` holds its panel's content.
    component: gpui_kit::component::tab::TabBar
    props:
      selected:
        type: number
        default: 0
        bindable: true
      variant:
        type: enum
        values: [Tab, Outline, Pill, Segmented, Underline, Folder]
        default: Tab
    events:
      change: number
    children: [Tab]

  Tab:
    icon: panel-top
    group: Navigation
    summary: One tab of `Tabs`; its children are the panel content.
    component: gpui_kit::component::tab::Tab
    content: label
    props:
      label:
        type: string
        required: true
      disabled:
        type: bool
        default: false
    children: any

  Separator:
    icon: minus
    group: Layout
    summary: Horizontal rule or vertical divider with an optional label.
    component: gpui_kit::component::separator::Separator
    content: label
    props:
      label: string
      orientation:
        type: enum
        values: [Horizontal, Vertical]
        default: Horizontal
      dashed:
        type: bool
        default: false

  DropdownMenu:
    icon: menu
    group: Input
    summary: A button that opens a dropdown `PopupMenu` of `MenuItem`s.
    component: gpui_kit::component::menu::dropdown_menu::DropdownMenuPopover
    props:
      label:
        type: string
        summary: Trigger button label.
      icon: icon
      size:
        type: enum
        values: [XSmall, Small, Medium, Large]
      variant:
        type: enum
        values: [Primary, Secondary, Ghost, Danger, Link]
      disabled:
        type: bool
        default: false
    children: [MenuItem, MenuSeparator]

  MenuItem:
    icon: menu
    group: Navigation
    summary: One clickable entry in a `DropdownMenu`.
    component: gpui_kit::component::menu::popup_menu::PopupMenuItem
    content: label
    props:
      label: string
      icon: icon
      disabled:
        type: bool
        default: false
      checked:
        type: bool
        default: false
    events:
      click:

  MenuSeparator:
    icon: minus
    group: Navigation
    summary: Divider line between `MenuItem`s in a `DropdownMenu`.
    component: gpui_kit::component::menu::popup_menu::PopupMenuItem

  GroupBox:
    icon: group
    group: Layout
    summary: Titled section grouping related content.
    component: gpui_kit::component::group_box::GroupBox
    content: title
    props:
      title: string
      variant:
        type: enum
        values: [Normal, Fill, Outline]
        default: Normal
      footer:
        type: string
        summary: Supporting content shown below the group's surface.
    children: any

  Empty:
    icon: ghost
    group: Layout
    summary: Placeholder for a section with nothing to show yet.
    component: gpui_kit::component::empty::Empty
    content: title
    props:
      icon: icon
      title: string
      description: string
    children: any

  Link:
    icon: link
    group: Display
    summary: Hyperlink.
    component: gpui_kit::component::link::Link
    content: label
    props:
      label: string
      href: string
      disabled:
        type: bool
        default: false
    events:
      click:

  Badge:
    icon: badge
    group: Display
    summary: Count or dot shown on top of its child.
    component: gpui_kit::component::badge::Badge
    content: count
    props:
      count: number
      max: number
      dot:
        type: bool
        default: false
      color: color
    children: any

  Tag:
    icon: tag
    group: Display
    summary: Small label for status or categories.
    component: gpui_kit::component::tag::Tag
    content: label
    props:
      label: string
      variant:
        type: enum
        values: [Primary, Secondary, Danger, Success, Warning, Info]
        default: Secondary
      outline:
        type: bool
        default: false

  Icon:
    icon: star
    group: Display
    summary: Icon from the gpui-kit icon set.
    component: gpui_kit::component::icon::Icon
    content: name
    props:
      name:
        type: icon
        required: true
      set:
        type: string
        summary: Icon set override — a `set:name` prefix on `name:` wins over this.
      size:
        type: enum
        values: [XSmall, Small, Medium, Large]
        default: Medium
      color: color

  Image:
    icon: image
    group: Display
    summary: A full-color image — raster formats, URLs, asset keys, and multicolor SVGs.
    component: gpui::img
    props:
      src:
        type: string
        required: true
      size:
        type: length
      object-fit:
        type: enum
        values: [Contain, Cover, Fill, ScaleDown]
        default: Contain

  Spinner:
    icon: loader-circle
    group: Display
    summary: Loading spinner.
    component: gpui_kit::component::spinner::Spinner
    props:
      icon: icon
      color: color

  Alert:
    icon: circle-alert
    group: Display
    summary: Callout for status messages, optionally a banner.
    component: gpui_kit::component::alert::Alert
    content: message
    props:
      message:
        type: string
        required: true
      variant:
        type: enum
        values: [Info, Success, Warning, Error]
        default: Info
      title: string
      banner:
        type: bool
        default: false
      visible:
        type: bool
        default: true

  Kbd:
    icon: keyboard
    group: Display
    summary: Keycap, e.g. `ctrl-o`.
    component: gpui_kit::component::kbd::Kbd
    content: keys
    props:
      keys:
        type: string
        required: true
      outline:
        type: bool
        default: false
      appearance:
        type: bool
        default: true

  Skeleton:
    icon: square-dashed
    group: Display
    summary: Loading placeholder block.
    component: gpui_kit::component::skeleton::Skeleton
    props:
      secondary:
        type: bool
        default: false

  Breadcrumb:
    icon: chevron-right
    group: Navigation
    summary: Trail of `BreadcrumbItem`s.
    component: gpui_kit::component::breadcrumb::Breadcrumb
    children: [BreadcrumbItem]

  BreadcrumbItem:
    icon: chevron-right
    group: Navigation
    summary: One crumb in a `Breadcrumb`.
    component: gpui_kit::component::breadcrumb::BreadcrumbItem
    content: label
    props:
      label:
        type: string
        required: true
      disabled:
        type: bool
        default: false

  Pagination:
    icon: ellipsis
    group: Navigation
    summary: Page switcher.
    component: gpui_kit::component::pagination::Pagination
    props:
      page:
        type: number
        summary: Current page index.
        bindable: true
      total:
        type: number
        required: true
        summary: Total number of pages.
      compact:
        type: bool
        default: false
      visible:
        type: number
        summary: Max page buttons shown.
    events:
      change: number

  Rating:
    icon: star-half
    group: Input
    summary: Star rating input or display.
    component: gpui_kit::component::rating::Rating
    props:
      value:
        type: number
        bindable: true
      max:
        type: number
        default: 5
      size:
        type: enum
        values: [XSmall, Small, Medium, Large]
        default: Medium
      color: color
      disabled:
        type: bool
        default: false
    events:
      change: number

  Toolbar:
    icon: wrench
    group: Input
    summary: Horizontal toolbar grouping controls.
    component: gpui_kit::component::toolbar::Toolbar
    props:
      disabled:
        type: bool
        default: false
    children: any

  Progress:
    icon: loader-pinwheel
    group: Display
    summary: Linear progress bar.
    component: gpui_kit::component::progress::Progress
    props:
      value:
        type: number
        summary: 0–100.
      loading:
        type: bool
        default: false
        summary: Indeterminate animation.
      color: color

  ProgressCircle:
    icon: chart-pie
    group: Display
    summary: Circular progress indicator.
    component: gpui_kit::component::progress::ProgressCircle
    props:
      value:
        type: number
        summary: 0–100.
      loading:
        type: bool
        default: false
      color: color

  DescriptionList:
    icon: list-ordered
    group: Display
    summary: Label/value grid (definition list).
    component: gpui_kit::component::description_list::DescriptionList
    props:
      layout:
        type: enum
        values: [Horizontal, Vertical]
        default: Vertical
      label-width: length
      bordered:
        type: bool
        default: false
      columns:
        type: number
    children: [DescriptionItem]

  DescriptionItem:
    icon: align-horizontal-justify-center
    group: Display
    summary: One row in a `DescriptionList`.
    component: gpui_kit::component::description_list::DescriptionItem
    content: label
    props:
      label:
        type: string
        required: true
      value:
        type: string
        required: true
      span:
        type: number
        default: 1

  StatusBar:
    icon: panel-bottom
    group: Layout
    summary: Window status bar; first child goes left, second goes right.
    component: gpui_kit::component::status_bar::StatusBar
    children: any

  Avatar:
    icon: circle-user
    group: Display
    summary: User avatar image or initials.
    component: gpui_kit::component::avatar::Avatar
    props:
      name:
        type: string
        summary: Fallback initials.
      src:
        type: string
        summary: Image path.
      icon:
        type: icon
        summary: Placeholder icon.

  AvatarGroup:
    icon: users-round
    group: Display
    summary: Overlapping stack of `Avatar`s.
    component: gpui_kit::component::avatar::AvatarGroup
    props:
      limit:
        type: number
        summary: Max avatars shown.
      ellipsis:
        type: bool
        default: false
    children: [Avatar]

  Stepper:
    icon: list-ordered
    group: Navigation
    summary: Numbered/stepping indicator.
    component: gpui_kit::component::stepper::Stepper
    props:
      selected:
        type: number
        bindable: true
        summary: Active step index.
      layout:
        type: enum
        values: [Horizontal, Vertical]
        default: Horizontal
      text-center:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
    events:
      change: number
    children: [StepperItem]

  StepperItem:
    icon: circle-dot
    group: Navigation
    summary: One step in a `Stepper`.
    component: gpui_kit::component::stepper::StepperItem
    content: label
    props:
      label: string
      icon: icon
      disabled:
        type: bool
        default: false

  NumberInput:
    icon: hash
    group: Input
    summary: Numeric input with step controls.
    component: gpui_kit::component::input::NumberInput
    content: value
    props:
      value:
        type: string
        bindable: true
      placeholder: string
      size:
        type: enum
        values: [XSmall, Small, Medium, Large]
        default: Medium
      appearance:
        type: bool
        default: true
      disabled:
        type: bool
        default: false
    events:
      change: string

  Slider:
    icon: sliders-horizontal
    group: Input
    summary: Value slider.
    component: gpui_kit::component::slider::Slider
    props:
      value:
        type: number
        bindable: true
      min:
        type: number
        default: 0
      max:
        type: number
        default: 100
      step:
        type: number
        default: 1
      vertical:
        type: bool
        default: false
      reverse:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
    events:
      change: number

  Accordion:
    icon: chevrons-up-down
    group: Navigation
    summary: Expandable sections of `AccordionItem`s.
    component: gpui_kit::component::accordion::Accordion
    props:
      multiple:
        type: bool
        default: false
        summary: Allow several open items.
      bordered:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
    events:
      change: number
    children: [AccordionItem]

  AccordionItem:
    icon: chevrons-up-down
    group: Navigation
    summary: One expandable section in an `Accordion`.
    component: gpui_kit::component::accordion::AccordionItem
    content: title
    props:
      title:
        type: string
        required: true
      icon: icon
      open:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
    children: any

  Collapsible:
    icon: chevron-down
    group: Layout
    summary: Show/hide container driven by an `open` prop.
    component: gpui_kit::component::collapsible::Collapsible
    props:
      open:
        type: bool
        default: false
    children: any

  Form:
    icon: file-text
    group: Input
    summary: Labeled form grid of `FormField`s.
    component: gpui_kit::component::form::Form
    props:
      layout:
        type: enum
        values: [Vertical, Horizontal]
        default: Vertical
      label-layout:
        type: enum
        values: [Horizontal, Vertical]
        summary: Label/field arrangement within each row.
      label-width: length
      columns:
        type: number
        summary: Grid columns.
    children: [FormField]

  FormField:
    icon: text-cursor-input
    group: Input
    summary: One labeled row in a `Form`.
    component: gpui_kit::component::form::Field
    content: label
    props:
      label: string
      description: string
      required:
        type: bool
        default: false
      visible:
        type: bool
        default: true
      label-indent:
        type: bool
        # `Field`'s own default is `true` — `false` here would hide labels on
        # every FormField that doesn't opt back in.
        default: true
      align:
        type: enum
        values: [Start, Center, End]
        summary: items_start/items_center/items_end.
      col-span:
        type: number
      col-start:
        type: number
    children: any

  ColorPicker:
    icon: palette
    group: Input
    summary: Color swatch that opens a color picker popup.
    component: gpui_kit::component::color_picker::ColorPicker
    props:
      value:
        type: color
        bindable: true
      disabled:
        type: bool
        default: false
    events:
      change: color

  OtpInput:
    icon: key-round
    group: Input
    summary: One-time-code input cells.
    component: gpui_kit::component::input::OtpInput
    props:
      value:
        type: string
        bindable: true
      length:
        type: number
        default: 6
      masked:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
    events:
      change: string
      complete: string

  DatePicker:
    icon: calendar
    group: Input
    summary: Date input with calendar popup.
    component: gpui_kit::component::time::date_picker::DatePicker
    props:
      value:
        type: string
        bindable: true
        summary: ISO date string.
      disabled:
        type: bool
        default: false
    events:
      change: string

  Calendar:
    icon: calendar-days
    group: Input
    summary: Inline month calendar.
    component: gpui_kit::component::time::calendar::Calendar
    props:
      disabled:
        type: bool
        default: false

  TimeField:
    icon: clock-3
    group: Input
    summary: Time-of-day input.
    component: gpui_kit::component::time::time_field::TimeField
    props:
      value:
        type: string
        bindable: true
      invalid:
        type: bool
        default: false
    events:
      change: string

  TitleBar:
    icon: panel-top
    group: Layout
    summary: Custom titlebar with window controls; children render inside the titlebar row.
    component: gpui_kit::component::title_bar::TitleBar
    children: any

  ThemeSwitcher:
    icon: sun-moon
    group: Input
    summary: Light/dark select wired to `Theme::change`; library themes follow the host mode.
    component: gpui_kit::component::select::Select
    children: none

  Message:
    icon: message-square
    group: Display
    summary: Chat-style message; children are the Message* slots below.
    component: gpui_kit::component::message::Message
    props:
      alignment:
        type: enum
        values: [Start, End]
        default: Start
      avatar: icon
    children: any

  MessageAvatar:
    icon: circle-user-round
    group: Display
    summary: Avatar slot inside a `Message`.
    component: gpui_kit::component::message::MessageAvatar
    children: any

  MessageHeader:
    icon: panel-top
    group: Display
    summary: Header slot inside a `Message`.
    component: gpui_kit::component::message::MessageHeader
    children: any

  MessageContent:
    icon: align-center-vertical
    group: Display
    summary: Body slot inside a `Message`.
    component: gpui_kit::component::message::MessageContent
    children: any

  MessageFooter:
    icon: panel-bottom
    group: Display
    summary: Footer slot inside a `Message`.
    component: gpui_kit::component::message::MessageFooter
    children: any

  Table:
    icon: table
    group: Display
    summary: Static table of `TableHeader`/`TableBody`/`TableFooter`/`TableCaption`.
    component: gpui_kit::component::table::Table
    children: [TableHeader, TableBody, TableFooter, TableCaption]

  TableHeader:
    icon: panel-top
    group: Display
    summary: Header row group of a `Table`.
    component: gpui_kit::component::table::TableHeader
    children: [TableHead]

  TableBody:
    icon: align-center-vertical
    group: Display
    summary: Row group of a `Table`.
    component: gpui_kit::component::table::TableBody
    children: [TableRow]

  TableFooter:
    icon: panel-bottom
    group: Display
