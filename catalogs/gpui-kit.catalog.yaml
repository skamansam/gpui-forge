# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the gpui-kit base library (core subset).
# Format: docs/spec/catalog-manifest.md
catalog: "0.1"
library: gpui-kit
name: GPUI Kit
version: 0.8.0
license: Apache-2.0
bases:
  gpui-kit: "^0.8"

elements:
  Box:
    summary: Plain container; layout comes entirely from `style`.
    component: gpui::Div
    children: any

  VStack:
    summary: Vertical flex container.
    component: gpui_kit::base::v_flex
    children: any

  HStack:
    summary: Horizontal flex container; children stretch on the cross axis by default.
    component: gpui::Div
    children: any

  Text:
    summary: A run of text.
    component: gpui::SharedString
    content: text
    props:
      text:
        type: string
        required: true

  Label:
    summary: Text with an optional secondary line.
    component: gpui_component::label::Label
    content: text
    props:
      text:
        type: string
        required: true
      secondary: string
      masked:
        type: bool
        default: false

  Button:
    summary: Clickable button.
    component: gpui_component::button::Button
    content: label
    props:
      label: string
      variant:
        type: enum
        values: [Default, Primary, Secondary, Danger, Info, Success, Warning, Ghost, Link, Text]
        default: Default
      size:
        type: enum
        values: [XSmall, Small, Medium, Large]
        default: Medium
      icon: icon
      disabled:
        type: bool
        default: false
      loading:
        type: bool
        default: false
      outline:
        type: bool
        default: false
      compact:
        type: bool
        default: false
      tooltip: string
    events:
      click:

  Input:
    summary: Single-line text input.
    component: gpui_component::input::Input
    content: value
    props:
      value:
        type: string
        bindable: true
      placeholder: string
      disabled:
        type: bool
        default: false
      readonly:
        type: bool
        default: false
      cleanable:
        type: bool
        default: false
      masked:
        type: bool
        default: false
        summary: Hide the text, for passwords.
    events:
      change: string
      submit: string

  Textarea:
    summary: Multi-line text input.
    component: gpui_component::input::Textarea
    content: value
    props:
      value:
        type: string
        bindable: true
      placeholder: string
      rows:
        type: number
        summary: Minimum number of visible rows.
      height:
        type: length
        summary: Fixed height; `100%` fills the parent.
      disabled:
        type: bool
        default: false
      readonly:
        type: bool
        default: false
    events:
      change: string

  Editor:
    summary: Code editor with line numbers and optional syntax highlighting.
    component: gpui_component::input::Editor
    content: value
    props:
      value:
        type: string
        bindable: true
      placeholder: string
      language:
        type: string
        summary: Active highlighter language, e.g. `yaml`.
      languages:
        type: list<string>
        summary: Languages this editor may switch between. Declared; a language picker is not wired yet.
      highlighting:
        type: map
        summary: 'Nested form of the flat props: `{languages: [yaml], default: yaml, show-selection: true}`.'
      show-selection:
        type: bool
        default: true
        summary: Whether the selection is drawn. Declared; not applied yet (no component API).
      height:
        type: length
        summary: Fixed height; `100%` fills the parent.
      disabled:
        type: bool
        default: false
      readonly:
        type: bool
        default: false
    events:
      change: string

  Checkbox:
    summary: Checkbox with an optional label.
    component: gpui_component::checkbox::Checkbox
    content: label
    props:
      label: string
      checked:
        type: bool
        default: false
        bindable: true
      disabled:
        type: bool
        default: false
    events:
      change: bool

  Switch:
    summary: On/off toggle.
    component: gpui_component::switch::Switch
    content: label
    props:
      label: string
      checked:
        type: bool
        default: false
        bindable: true
      disabled:
        type: bool
        default: false
    events:
      change: bool

  RadioGroup:
    summary: A set of mutually exclusive options.
    component: gpui_component::radio::RadioGroup
    props:
      selected:
        type: number
        bindable: true
        summary: Index of the selected `Radio`.
      layout:
        type: enum
        values: [Vertical, Horizontal]
        default: Vertical
      disabled:
        type: bool
        default: false
    events:
      change: number
    children: [Radio]

  Radio:
    summary: One option of a `RadioGroup`.
    component: gpui_component::radio::Radio
    content: label
    props:
      label: string
      disabled:
        type: bool
        default: false

  Select:
    summary: Dropdown for picking one option.
    component: gpui_component::select::Select
    props:
      value:
        type: string
        bindable: true
      options:
        type: list<string>
        required: true
      placeholder: string
      searchable:
        type: bool
        default: false
      cleanable:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
    events:
      change: string

  Tabs:
    summary: Tab bar; each `Tab` holds its panel's content.
    component: gpui_component::tab::TabBar
    props:
      selected:
        type: number
        default: 0
        bindable: true
      variant:
        type: enum
        values: [Tab, Outline, Pill, Segmented, Underline, Folder]
        default: Tab
    events:
      change: number
    children: [Tab]

  Tab:
    summary: One tab of `Tabs`; its children are the panel content.
    component: gpui_component::tab::Tab
    content: label
    props:
      label:
        type: string
        required: true
      disabled:
        type: bool
        default: false
    children: any

  Separator:
    summary: Horizontal rule or vertical divider with an optional label.
    component: gpui_component::separator::Separator
    content: label
    props:
      label: string
      orientation:
        type: enum
        values: [Horizontal, Vertical]
        default: Horizontal
      dashed:
        type: bool
        default: false

  DropdownMenu:
    summary: A button that opens a dropdown `PopupMenu` of `MenuItem`s.
    component: gpui_component::menu::dropdown_menu::DropdownMenuPopover
    props:
      label:
        type: string
        summary: Trigger button label.
      icon: icon
      size:
        type: enum
        values: [XSmall, Small, Medium, Large]
      variant:
        type: enum
        values: [Primary, Secondary, Ghost, Danger, Link]
      disabled:
        type: bool
        default: false
    children: [MenuItem, MenuSeparator]

  MenuItem:
    summary: One clickable entry in a `DropdownMenu`.
    component: gpui_component::menu::popup_menu::PopupMenuItem
    content: label
    props:
      label: string
      icon: icon
      disabled:
        type: bool
        default: false
      checked:
        type: bool
        default: false
    events:
      click:

  MenuSeparator:
    summary: Divider line between `MenuItem`s in a `DropdownMenu`.
    component: gpui_component::menu::popup_menu::PopupMenuItem

  GroupBox:
    summary: Titled section grouping related content.
    component: gpui_component::group_box::GroupBox
    content: title
    props:
      title: string
      variant:
        type: enum
        values: [Normal, Fill, Outline]
        default: Normal
      footer:
        type: string
        summary: Supporting content shown below the group's surface.
    children: any

  Empty:
    summary: Placeholder for a section with nothing to show yet.
    component: gpui_component::empty::Empty
    content: title
    props:
      icon: icon
      title: string
      description: string
    children: any

  Link:
    summary: Hyperlink.
    component: gpui_component::link::Link
    content: label
    props:
      label: string
      href: string
      disabled:
        type: bool
        default: false
    events:
      click:

  Badge:
    summary: Count or dot shown on top of its child.
    component: gpui_component::badge::Badge
    content: count
    props:
      count: number
      max: number
      dot:
        type: bool
        default: false
      color: color
    children: any

  Tag:
    summary: Small label for status or categories.
    component: gpui_component::tag::Tag
    content: label
    props:
      label: string
      variant:
        type: enum
        values: [Primary, Secondary, Danger, Success, Warning, Info]
        default: Secondary
      outline:
        type: bool
        default: false

  Icon:
    summary: Icon from the gpui-kit icon set.
    component: gpui_component::icon::Icon
    content: name
    props:
      name:
        type: icon
        required: true
      size:
        type: enum
        values: [XSmall, Small, Medium, Large]
        default: Medium
      color: color

  Image:
    summary: A full-color image — raster formats, URLs, asset keys, and multicolor SVGs.
    component: gpui::img
    props:
      src:
        type: string
        required: true
      size:
        type: length
      object-fit:
        type: enum
        values: [Contain, Cover, Fill, ScaleDown]
        default: Contain

  Spinner:
    summary: Loading spinner.
    component: gpui_component::spinner::Spinner
    props:
      icon: icon
      color: color

  Alert:
    summary: Callout for status messages, optionally a banner.
    component: gpui_component::alert::Alert
    content: message
    props:
      message:
        type: string
        required: true
      variant:
        type: enum
        values: [Info, Success, Warning, Error]
        default: Info
      title: string
      banner:
        type: bool
        default: false
      visible:
        type: bool
        default: true

  Kbd:
    summary: Keycap, e.g. `ctrl-o`.
    component: gpui_component::kbd::Kbd
    content: keys
    props:
      keys:
        type: string
        required: true
      outline:
        type: bool
        default: false
      appearance:
        type: bool
        default: true

  Skeleton:
    summary: Loading placeholder block.
    component: gpui_component::skeleton::Skeleton
    props:
      secondary:
        type: bool
        default: false

  Breadcrumb:
    summary: Trail of `BreadcrumbItem`s.
    component: gpui_component::breadcrumb::Breadcrumb
    children: [BreadcrumbItem]

  BreadcrumbItem:
    summary: One crumb in a `Breadcrumb`.
    component: gpui_component::breadcrumb::BreadcrumbItem
    content: label
    props:
      label:
        type: string
        required: true
      disabled:
        type: bool
        default: false

  Pagination:
    summary: Page switcher.
    component: gpui_component::pagination::Pagination
    props:
      page:
        type: number
        summary: Current page index.
        bindable: true
      total:
        type: number
        required: true
        summary: Total number of pages.
      compact:
        type: bool
        default: false
      visible:
        type: number
        summary: Max page buttons shown.
    events:
      change: number

  Rating:
    summary: Star rating input or display.
    component: gpui_component::rating::Rating
    props:
      value:
        type: number
        bindable: true
      max:
        type: number
        default: 5
      size:
        type: enum
        values: [XSmall, Small, Medium, Large]
        default: Medium
      color: color
      disabled:
        type: bool
        default: false
    events:
      change: number

  Toolbar:
    summary: Horizontal toolbar grouping controls.
    component: gpui_component::toolbar::Toolbar
    props:
      disabled:
        type: bool
        default: false
    children: any

  Progress:
    summary: Linear progress bar.
    component: gpui_component::progress::Progress
    props:
      value:
        type: number
        summary: 0–100.
      loading:
        type: bool
        default: false
        summary: Indeterminate animation.
      color: color

  ProgressCircle:
    summary: Circular progress indicator.
    component: gpui_component::progress::ProgressCircle
    props:
      value:
        type: number
        summary: 0–100.
      loading:
        type: bool
        default: false
      color: color

  DescriptionList:
    summary: Label/value grid (definition list).
    component: gpui_component::description_list::DescriptionList
    props:
      layout:
        type: enum
        values: [Horizontal, Vertical]
        default: Vertical
      label-width: length
      bordered:
        type: bool
        default: false
      columns:
        type: number
    children: [DescriptionItem]

  DescriptionItem:
    summary: One row in a `DescriptionList`.
    component: gpui_component::description_list::DescriptionItem
    content: label
    props:
      label:
        type: string
        required: true
      value:
        type: string
        required: true
      span:
        type: number
        default: 1

  StatusBar:
    summary: Window status bar; first child goes left, second goes right.
    component: gpui_component::status_bar::StatusBar
    children: any

  Avatar:
    summary: User avatar image or initials.
    component: gpui_component::avatar::Avatar
    props:
      name:
        type: string
        summary: Fallback initials.
      src:
        type: string
        summary: Image path.
      icon:
        type: icon
        summary: Placeholder icon.

  AvatarGroup:
    summary: Overlapping stack of `Avatar`s.
    component: gpui_component::avatar::AvatarGroup
    props:
      limit:
        type: number
        summary: Max avatars shown.
      ellipsis:
        type: bool
        default: false
    children: [Avatar]

  Stepper:
    summary: Numbered/stepping indicator.
    component: gpui_component::stepper::Stepper
    props:
      selected:
        type: number
        bindable: true
        summary: Active step index.
      layout:
        type: enum
        values: [Horizontal, Vertical]
        default: Horizontal
      text-center:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
    events:
      change: number
    children: [StepperItem]

  StepperItem:
    summary: One step in a `Stepper`.
    component: gpui_component::stepper::StepperItem
    content: label
    props:
      label: string
      icon: icon
      disabled:
        type: bool
        default: false

  NumberInput:
    summary: Numeric input with step controls.
    component: gpui_component::input::NumberInput
    content: value
    props:
      value:
        type: string
        bindable: true
      placeholder: string
      size:
        type: enum
        values: [XSmall, Small, Medium, Large]
        default: Medium
      appearance:
        type: bool
        default: true
      disabled:
        type: bool
        default: false
    events:
      change: string

  Slider:
    summary: Value slider.
    component: gpui_component::slider::Slider
    props:
      value:
        type: number
        bindable: true
      min:
        type: number
        default: 0
      max:
        type: number
        default: 100
      step:
        type: number
        default: 1
      vertical:
        type: bool
        default: false
      reverse:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
    events:
      change: number

  Accordion:
    summary: Expandable sections of `AccordionItem`s.
    component: gpui_component::accordion::Accordion
    props:
      multiple:
        type: bool
        default: false
        summary: Allow several open items.
      bordered:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
    events:
      change: number
    children: [AccordionItem]

  AccordionItem:
    summary: One expandable section in an `Accordion`.
    component: gpui_component::accordion::AccordionItem
    content: title
    props:
      title:
        type: string
        required: true
      icon: icon
      open:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
    children: any

  Collapsible:
    summary: Show/hide container driven by an `open` prop.
    component: gpui_component::collapsible::Collapsible
    props:
      open:
        type: bool
        default: false
    children: any

  Form:
    summary: Labeled form grid of `FormField`s.
    component: gpui_component::form::Form
    props:
      layout:
        type: enum
        values: [Vertical, Horizontal]
        default: Vertical
      label-layout:
        type: enum
        values: [Horizontal, Vertical]
        summary: Label/field arrangement within each row.
      label-width: length
      columns:
        type: number
        summary: Grid columns.
    children: [FormField]

  FormField:
    summary: One labeled row in a `Form`.
    component: gpui_component::form::Field
    content: label
    props:
      label: string
      description: string
      required:
        type: bool
        default: false
      visible:
        type: bool
        default: true
      label-indent:
        type: bool
        default: false
      align:
        type: enum
        values: [Start, Center, End]
        summary: items_start/items_center/items_end.
      col-span:
        type: number
      col-start:
        type: number
    children: any

  ColorPicker:
    summary: Color swatch that opens a color picker popup.
    component: gpui_component::color_picker::ColorPicker
    props:
      value:
        type: color
        bindable: true
      disabled:
        type: bool
        default: false
    events:
      change: color

  OtpInput:
    summary: One-time-code input cells.
    component: gpui_component::input::OtpInput
    props:
      value:
        type: string
        bindable: true
      length:
        type: number
        default: 6
      masked:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
    events:
      change: string
      complete: string

  DatePicker:
    summary: Date input with calendar popup.
    component: gpui_component::time::DatePicker
    props:
      value:
        type: string
        bindable: true
        summary: ISO date string.
      disabled:
        type: bool
        default: false
    events:
      change: string

  Calendar:
    summary: Inline month calendar.
    component: gpui_component::time::Calendar
    props:
      disabled:
        type: bool
        default: false

  TimeField:
    summary: Time-of-day input.
    component: gpui_component::time_field::TimeField
    props:
      value:
        type: string
        bindable: true
      invalid:
        type: bool
        default: false
    events:
      change: string

  TitleBar:
    summary: Custom titlebar with window controls; children render inside the titlebar row.
    component: gpui_component::title_bar::TitleBar
    children: any

  Message:
    summary: Chat-style message; children are the Message* slots below.
    component: gpui_component::message::Message
    props:
      alignment:
        type: enum
        values: [Start, End]
        default: Start
      avatar: icon
    children: any

  MessageAvatar:
    summary: Avatar slot inside a `Message`.
    component: gpui_component::message::MessageAvatar
    children: any

  MessageHeader:
    summary: Header slot inside a `Message`.
    component: gpui_component::message::MessageHeader
    children: any

  MessageContent:
    summary: Body slot inside a `Message`.
    component: gpui_component::message::MessageContent
    children: any

  MessageFooter:
    summary: Footer slot inside a `Message`.
    component: gpui_component::message::MessageFooter
    children: any

  Table:
    summary: Static table of `TableHeader`/`TableBody`/`TableFooter`/`TableCaption`.
    component: gpui_component::table::Table
    children: [TableHeader, TableBody, TableFooter, TableCaption]

  TableHeader:
    summary: Header row group of a `Table`.
    component: gpui_component::table::TableHeader
    children: [TableHead]

  TableBody:
    summary: Row group of a `Table`.
    component: gpui_component::table::TableBody
    children: [TableRow]

  TableFooter:
    summary: Footer row group of a `Table`.
    component: gpui_component::table::TableFooter
    children: [TableRow]

  TableCaption:
    summary: Caption of a `Table`.
    component: gpui_component::table::TableCaption
    children: any

  TableRow:
    summary: A row of `TableCell`s in a `Table`.
    component: gpui_component::table::TableRow
    children: [TableCell, TableHead]

  TableHead:
    summary: Header cell in a `Table`.
    component: gpui_component::table::TableHead
    props:
      col-span:
        type: number
      text-align:
        type: enum
        values: [Left, Center, Right]
    children: any

  TableCell:
    summary: Data cell in a `Table`.
    component: gpui_component::table::TableCell
    props:
      col-span:
        type: number
      text-align:
        type: enum
        values: [Left, Center, Right]
    children: any

  Resizable:
    summary: Split-pane group of `ResizablePanel`s with drag handles.
    component: gpui_base::resizable::ResizablePanelGroup
    props:
      layout:
        type: enum
        values: [Horizontal, Vertical]
        default: Horizontal
    children: [ResizablePanel]

  ResizablePanel:
    summary: One pane in a `Resizable` group.
    component: gpui_base::resizable::ResizablePanel
    props:
      size:
        type: number
        summary: Initial size in px.
      min-size:
        type: number
      max-size:
        type: number
      fixed:
        type: bool
        default: false
      visible:
        type: bool
        default: true
    children: any

  Sidebar:
    summary: Collapsible app sidebar; `SidebarHeader`/`SidebarFooter` children map to the header/footer slots, `SidebarMenu` children become items.
    component: gpui_component::sidebar::Sidebar
    props:
      side:
        type: enum
        values: [Left, Right]
        default: Left
      collapsible:
        type: enum
        values: [None, Icon, Offcanvas]
        default: Icon
      collapsed:
        type: bool
        default: false
    children: any

  SidebarHeader:
    summary: Header slot inside a `Sidebar`.
    component: gpui_component::sidebar::SidebarHeader
    children: any

  SidebarFooter:
    summary: Footer slot inside a `Sidebar`.
    component: gpui_component::sidebar::SidebarFooter
    children: any

  SidebarMenu:
    summary: A group of `SidebarMenuItem`s in a `Sidebar`.
    component: gpui_component::sidebar::SidebarMenu
    children: [SidebarMenuItem]

  SidebarMenuItem:
    summary: One navigable item (or nested group) in a `SidebarMenu`.
    component: gpui_component::sidebar::SidebarMenuItem
    content: label
    props:
      label:
        type: string
        required: true
      icon: icon
      active:
        type: bool
        default: false
      disabled:
        type: bool
        default: false
      open:
        type: bool
        default: false
        summary: Start expanded when it has children.
    events:
      click:
    children: [SidebarMenuItem]

  List:
    summary: Virtualized list of rows — children are the row template list.
    component: gpui_component::list::List
    props:
      selected:
        type: number
        bindable: true
        summary: Selected row index.
    events:
      select: number
      confirm: number
    children: any

  Tree:
    summary: Expandable tree of `TreeItem`s.
    component: gpui_component::tree::Tree
    children: [TreeItem]

  TreeItem:
    summary: One node in a `Tree`; `TreeItem` children become sub-items, other children render as row content.
    component: gpui_base::tree::TreeItem
    content: label
    props:
      label:
        type: string
        required: true
      icon: icon
      expanded:
        type: bool
        default: false
    children: any
