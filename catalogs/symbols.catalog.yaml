# yaml-language-server: $schema=../schema/catalog-1.0.json
# Catalog manifest for the gpui-symbols adapter (forge-lib-guise `symbols`
# feature) — `use: sf: gpui-symbols` on the guise base (#88). MacOS only.
catalog: "1.0"
library: gpui-symbols
name: gpui-symbols
version: 0.6.1
license: Apache-2.0
bases:
  guise: "*"

elements:
  Icon:
    icon: smile
    group: Display
    summary: An SF Symbol by name — resolved through AppKit (macOS only).
    component: gpui_symbols::Icon
    children: none
    props:
      name:
        type: string
        required: true
        summary: SF Symbol name, e.g. "square.and.pencil".
