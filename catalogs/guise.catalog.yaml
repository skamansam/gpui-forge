# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the guise base — guise components on crates.io gpui
# 0.2.2. Scaffold for #96: shared-vocab layout names (VStack → guise Stack)
# plus guise-native elements; extend as the adapter port lands.
# Format: docs/spec/catalog-manifest.md
catalog: "0.1"
library: guise
name: guise
version: 0.1.0
license: MIT
bases:
  guise: "*"

elements:
  VStack:
    icon: rows-3
    group: Layout
    summary: Vertical flex container (guise `Stack`).
    component: guise::layout::Stack
    canvas: VStack
    children: any
    props:
      slot: string  # AppShell slot: header|navbar|aside|footer
      height: number

  HStack:
    icon: columns-3
    group: Layout
    summary: Horizontal flex container (guise `Group`).
    component: guise::layout::Group
    canvas: HStack
    children: any
    props:
      slot: string  # AppShell slot: header|navbar|aside|footer
      height: number

  Center:
    icon: align-center-horizontal
    group: Layout
    summary: Centers its children on both axes.
    component: guise::layout::Center
    canvas: Box
    children: any

  Container:
    icon: square
    group: Layout
    summary: Width-constrained page container.
    component: guise::layout::Container
    canvas: GroupBox
    children: any

  Space:
    icon: separator-horizontal
    group: Layout
    summary: Fixed empty space between siblings.
    component: guise::layout::Space
    canvas: Box
    props:
      size:
        type: enum
        values: [Xs, Sm, Md, Lg, Xl]
        default: Md

  Divider:
    icon: minus
    group: Layout
    summary: Horizontal rule between sections.
    component: guise::Divider
    canvas: Separator
    props:
      label: string

  Paper:
    props:
      slot: string  # AppShell slot: header|navbar|aside|footer
      height: number
      label: string
    icon: square-stack
    group: Layout
    summary: Elevated surface — background, radius and shadow from the theme.
    component: guise::Paper
    canvas: GroupBox
    children: any

  Title:
    icon: type
    group: Display
    summary: Heading text, theme-scaled by `order`.
    component: guise::Title
    canvas: Text
    content: text
    props:
      text:
        type: string
        required: true
      order:
        type: enum
        values: [H1, H2, H3, H4, H5, H6]
        default: H3

  Text:
    icon: pilcrow
    group: Display
    summary: A run of text.
    component: guise::Text
    canvas: Text
    content: text
    props:
      text:
        type: string
        required: true

  Badge:
    icon: badge
    group: Display
    summary: Small status/label chip.
    component: guise::Badge
    canvas:
      element: Tag
      props: {text: label}
    content: text
    props:
      text:
        type: string
        required: true
      variant:
        type: enum
        values: [Default, Filled, Light, Outline, Subtle, Transparent, White]
        default: Light
      color: string

  Card:
    icon: square-stack
    group: Display
    summary: Bordered surface grouping related content.
    component: guise::Card
    canvas: GroupBox
    children: any

  Button:
    icon: mouse-pointer-click
    group: Input
    summary: Clickable button — Mantine variants and theme colors.
    component: guise::Button
    canvas: Button
    content: label
    props:
      label: string
      variant:
        type: enum
        values: [Default, Filled, Light, Outline, Subtle, Transparent, White]
        default: Filled
      color: string
      size:
        type: enum
        values: [Xs, Sm, Md, Lg, Xl]
        default: Md
      disabled:
        type: bool
        default: false
    events:
      click:

  TextInput:
    icon: text-cursor-input
    group: Input
    summary: Single-line text input with label, description and error.
    component: guise::input::TextInput
    canvas: Input
    props:
      label: string
      placeholder: string
      description: string
      error: string
      value: string
    events:
      change:

  Input:
    icon: text-cursor-input
    group: Input
    summary: Single-line text input with label, description and error.
    component: guise::input::TextInput
    canvas: Input
    props:
      label: string
      placeholder: string
      description: string
      error: string
      value: string
    events:
      change:

  Checkbox:
    icon: square-check
    group: Input
    summary: Togglable labelled checkbox.
    component: guise::input::Checkbox
    canvas: Checkbox
    content: label
    props:
      label: string
      checked:
        type: bool
        default: false
    events:
      change:

  Switch:
    icon: toggle-left
    group: Input
    summary: On/off toggle.
    component: guise::input::Switch
    canvas: Switch
    content: label
    props:
      label: string
      checked:
        type: bool
        default: false
    events:
      change:

  Select:
    icon: chevrons-up-down
    group: Input
    summary: Dropdown pick-one input.
    component: guise::input::Select
    canvas: Select
    props:
      label: string
      placeholder: string
      options: string
      value: string
    events:
      change:

  Progress:
    icon: rectangle-horizontal
    group: Feedback
    summary: Progress bar, 0–100.
    component: guise::feedback::Progress
    canvas: Progress
    props:
      value: number
      color: string

  Alert:
    icon: triangle-alert
    group: Feedback
    summary: Attention banner with title and message.
    component: guise::feedback::Alert
    canvas:
      element: Alert
      props: {text: message}
    content: text
    props:
      text:
        type: string
        required: true
      title: string
      color: string

  Icon:
    icon: star
    group: Display
    summary: Lucide icon glyph — `name` is a lucide icon name.
    component: guise::Icon
    props:
      name:
        type: string
        required: true
      color: string
      size:
        type: enum
        values: [Xs, Sm, Md, Lg, Xl]
        default: Md

  ThemeIcon:
    icon: circle-dot
    group: Display
    summary: Lucide icon inside a themed tile.
    component: guise::ThemeIcon
    props:
      name:
        type: string
        required: true
      variant:
        type: enum
        values: [Default, Filled, Light, Outline, Subtle, Transparent, White]
        default: Filled
      color: string
      size:
        type: enum
        values: [Xs, Sm, Md, Lg, Xl]
        default: Md

  Kbd:
    icon: keyboard
    group: Display
    summary: Keyboard shortcut glyph.
    component: guise::Kbd
    canvas: Text
    content: text
    props:
      text:
        type: string
        required: true

  Code:
    icon: code
    group: Display
    summary: Inline code fragment.
    component: guise::Code
    canvas: Text
    content: text
    props:
      text:
        type: string
        required: true
      color: string

  Mark:
    icon: highlighter
    group: Display
    summary: Highlighted text run.
    component: guise::Mark
    canvas: Text
    content: text
    props:
      text:
        type: string
        required: true
      color: string
      size:
        type: enum
        values: [Xs, Sm, Md, Lg, Xl]
        default: Md

  Blockquote:
    icon: quote
    group: Display
    summary: Quoted passage with optional citation and icon.
    component: guise::Blockquote
    content: text
    props:
      text:
        type: string
        required: true
      cite: string
      icon: string
      color: string

  Panel:
    icon: square-stack
    group: Display
    summary: Titled bordered section with optional description.
    component: guise::Panel
    canvas: GroupBox
    children: any
    props:
      title: string
      description: string

  Spoiler:
    icon: chevron-down
    group: Display
    summary: Collapsible clip for long content — show/hide toggle.
    component: guise::Spoiler
    children: any
    props:
      max_height:
        type: number
        default: 96
      expanded:
        type: bool
        default: false
      show_label: string
      hide_label: string
      color: string
      size:
        type: enum
        values: [Xs, Sm, Md, Lg, Xl]
        default: Md

  Image:
    icon: image
    group: Display
    summary: Image — `src` is a document-relative file path or URL.
    component: guise::Image
    props:
      src:
        type: string
        required: true
      width: number
      height: number
      circle:
        type: bool
        default: false
      fit:
        type: enum
        values: [Cover, Contain, Fill, None, ScaleDown]
        default: Cover

  Chip:
    icon: circle-check
    group: Input
    summary: Toggleable choice chip.
    component: guise::Chip
    content: label
    props:
      label: string
      checked:
        type: bool
        default: false
      color: string
      size:
        type: enum
        values: [Xs, Sm, Md, Lg, Xl]
        default: Md
    events:
      change:

  ActionIcon:
    icon: mouse-pointer-click
    group: Input
    summary: Icon-only action button.
    component: guise::ActionIcon
    props:
      name:
        type: string
        required: true
      label: string
      variant:
        type: enum
        values: [Default, Filled, Light, Outline, Subtle, Transparent, White]
        default: Filled
      color: string
      size:
        type: enum
        values: [Xs, Sm, Md, Lg, Xl]
        default: Md
      disabled:
        type: bool
        default: false
    events:
      click:

  CloseButton:
    icon: x
    group: Input
    summary: Compact dismiss button.
    component: guise::CloseButton
    props:
      size:
        type: enum
        values: [Xs, Sm, Md, Lg, Xl]
        default: Md
    events:
      click:

  CopyButton:
    icon: copy
    group: Input
    summary: Copies `text` to the clipboard with transient feedback.
    component: guise::CopyButton
    props:
      text:
        type: string
        required: true
      label: string

  Skeleton:
    icon: rectangle-horizontal
    group: Feedback
    summary: Loading placeholder — bar or circle.
    component: guise::Skeleton
    canvas: Box
    props:
      width: number
      height: number
      circle:
        type: bool
        default: false

  Indicator:
    icon: bell
    group: Feedback
    summary: Dot or label badge anchored over its child.
    component: guise::Indicator
    children: any
    props:
      label: string
      color: string
      disabled:
        type: bool
        default: false

  Slider:
    icon: sliders-horizontal
    group: Inputs
    summary: Single-value drag slider over a numeric range.
    component: guise::input::Slider
    props:
      value: number
      min: number
      max: number
      step: number
      color: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires on every value change; writes the number to a bound value.

  RangeSlider:
    icon: sliders-horizontal
    group: Inputs
    summary: Two-thumb slider selecting a numeric range.
    component: guise::input::RangeSlider
    props:
      value: string  # "lo,hi"
      min: number
      max: number
      step: number
      min_gap: number
      color: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires on change; writes [lo, hi] to a bound value.

  Rating:
    icon: star
    group: Inputs
    summary: Star rating input.
    component: guise::input::Rating
    props:
      value: number
      count: number
      color: string
      size: string
      readonly:
        type: bool
        default: false
    events:
      change: Fires when the user picks a rating.

  Radio:
    icon: circle-dot
    group: Inputs
    summary: Single radio option; group via RadioGroup.
    component: guise::input::Radio
    content: label
    props:
      label: string
      checked:
        type: bool
        default: false
      size: string
      color: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires when toggled; flips a bound checked.

  RadioGroup:
    icon: circle-dot
    group: Inputs
    summary: Exclusive choice over a set of options.
    component: guise::input::RadioGroup
    props:
      options: string  # comma-separated
      value: string    # selected index
      label: string
      color: string
      size: string
    events:
      change: Fires on selection; writes the option text to a bound value.

  NumberInput:
    icon: hash
    group: Inputs
    summary: Numeric stepper input with min/max/step.
    component: guise::input::NumberInput
    props:
      value: number
      min: number
      max: number
      step: number
      label: string
      description: string
      error: string
      size: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires on value change; writes the number to a bound value.

  PasswordInput:
    icon: key
    group: Inputs
    summary: Masked text input.
    component: guise::input::PasswordInput
    props:
      value: string
      placeholder: string
      label: string
      description: string
      error: string
      size: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires on edit and submit; writes the text to a bound value.

  PinInput:
    icon: rectangle-ellipsis
    group: Inputs
    summary: Per-digit code entry (OTP/PIN).
    component: guise::input::PinInput
    props:
      length: number
      value: string
      mask:
        type: bool
        default: false
      size: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires on change/complete; writes the code to a bound value.

  TextArea:
    icon: align-left
    group: Inputs
    summary: Multi-line text input.
    component: guise::input::TextArea
    props:
      value: string
      placeholder: string
      label: string
      description: string
      error: string
      rows: number
      max_rows: number
      submit_on_enter:
        type: bool
        default: false
      size: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires on edit; writes the text to a bound value.

  TagsInput:
    icon: tags
    group: Inputs
    summary: Token/chip entry field.
    component: guise::input::TagsInput
    props:
      value: string
      options: string   # initial tags, comma-separated
      placeholder: string
      label: string
      description: string
      error: string
      max_tags: number
      size: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires when tags change; writes the tag array to a bound value.

  Combobox:
    icon: chevrons-up-down
    group: Inputs
    summary: Filterable dropdown select.
    component: guise::input::Combobox
    props:
      options: string  # comma-separated
      value: string    # selected indices, comma-separated
      placeholder: string
      label: string
      multiple:
        type: bool
        default: false
      size: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires on selection; writes the option text to a bound value.

  Autocomplete:
    icon: text-cursor-input
    group: Inputs
    summary: Free text with a suggestion list.
    component: guise::input::Autocomplete
    props:
      options: string  # suggestions, comma-separated
      value: string
      max_shown: number
      placeholder: string
      label: string
      size: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires on change/commit; writes the text to a bound value.

  ColorInput:
    icon: palette
    group: Inputs
    summary: Color picker with hex value.
    component: guise::input::ColorInput
    props:
      value: string  # "#RRGGBB" or "#RRGGBBAA"
      label: string
      description: string
      error: string
      size: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires on pick; writes the color to a bound value.

  DatePicker:
    icon: calendar
    group: Inputs
    summary: Single-date or range picker.
    component: guise::input::DatePicker
    props:
      value: string  # ISO date
      min: string    # ISO date
      max: string    # ISO date
      range:
        type: bool
        default: false
      placeholder: string
      label: string
      size: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires on selection; writes the date (or [start,end]) to a bound value.

  TimePicker:
    icon: clock
    group: Inputs
    summary: Time-of-day picker.
    component: guise::input::TimePicker
    props:
      value: string   # "HH:MM"
      hour24:
        type: bool
        default: true
      minute_step: number
      placeholder: string
      label: string
      size: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires on pick; writes "HH:MM" to a bound value.

  Calendar:
    icon: calendar-days
    group: Inputs
    summary: Month grid for date selection.
    component: guise::input::Calendar
    props:
      month: string  # "YYYY-MM"
      value: string  # ISO date
    events:
      change: Fires on selection; writes the ISO date to a bound value.

  FileInput:
    icon: folder-open
    group: Inputs
    summary: Native file/directory picker button.
    component: guise::input::FileInput
    props:
      value: string
      multiple:
        type: bool
        default: false
      directories:
        type: bool
        default: false
      placeholder: string
      label: string
      size: string
      disabled:
        type: bool
        default: false
    events:
      change: Fires on pick; writes ";" joined paths to a bound value.

  Dropzone:
    icon: upload
    group: Inputs
    summary: Drag-and-drop file target.
    component: guise::input::Dropzone
    props:
      value: string
      label: string
      hint: string
      icon: string
      accept: string  # comma-separated extensions
      height: number
      single:
        type: bool
        default: false
      no_click:
        type: bool
        default: false
    events:
      change: Fires on drop/pick; writes ";" joined paths to a bound value.

  CheckboxGroup:
    icon: check-square
    group: Inputs
    summary: Multi-select checkbox set.
    component: guise::input::CheckboxGroup
    props:
      options: string  # comma-separated
      value: string    # selected indices, comma-separated
      label: string
      color: string
      size: string
    events:
      change: Fires on toggle; writes selected option names to a bound value.

  Field:
    icon: square-pen
    group: Inputs
    summary: Label + description + error wrapper around a control.
    component: guise::input::Field
    children: any
    props:
      label: string
      description: string
      error: string

  Transfer:
    icon: arrow-left-right
    group: Inputs
    summary: Dual-list shuttle picker.
    component: guise::input::Transfer
    props:
      options: string      # items, comma-separated
      value: string        # chosen indices, comma-separated
      left_title: string
      right_title: string
      height: number
      disabled:
        type: bool
        default: false
    events:
      change: Fires when the chosen set moves; writes chosen names to a bound value.

  SegmentedControl:
    icon: columns-3
    group: Inputs
    summary: Single-select segmented button row.
    component: guise::input::SegmentedControl
    props:
      options: string  # comma-separated
      value: string    # selected index
      size: string
    events:
      change: Fires on selection; writes the option text to a bound value.

  Accordion:
    icon: chevrons-down-up
    group: Data
    summary: Collapsible panels — each child's `label` prop is its header.
    component: guise::data::Accordion
    children: any
    props:
      multiple:
        type: bool
        default: false
      open: number  # initially-open index

  Tabs:
    icon: folder
    group: Data
    summary: Tabbed panels — each child's `label` prop is its tab title.
    component: guise::data::Tabs
    children: any
    props:
      active: number

  TabBar:
    icon: app-window
    group: Data
    summary: Standalone tab strip with optional add button.
    component: guise::data::TabBar
    props:
      value: string
      options: string  # tab labels, comma-separated
      active: number
      add_button:
        type: bool
        default: false
    events:
      change: Fires on select/close/add; writes the tab label to a bound value.

  Table:
    icon: table
    group: Data
    summary: Static styled table — head cells plus semicolon-separated rows.
    component: guise::data::Table
    props:
      options: string  # alias for head
      head: string     # head cells, comma-separated
      rows: string     # "a,b;c,d"
      striped:
        type: bool
        default: false
      hover:
        type: bool
        default: false
      border:
        type: bool
        default: false

  TableView:
    icon: sheet
    group: Data
    summary: Sortable/selectable data table over text rows.
    component: guise::data::TableView
    props:
      options: string  # alias for head
      value: string
      head: string     # column titles, comma-separated
      rows: string     # "a,b;c,d"
      selectable:
        type: bool
        default: false
      multiple:
        type: bool
        default: false
    events:
      change: Fires on selection; writes selected row indices to a bound value.

  List:
    icon: list
    group: Data
    summary: Simple bulleted or ordered list.
    component: guise::data::List
    props:
      options: string  # items, comma-separated
      ordered:
        type: bool
        default: false
      icon: string
      size: string

  VirtualList:
    icon: rows-3
    group: Data
    summary: Windowed list — renders only visible rows.
    component: guise::data::VirtualList
    props:
      options: string  # items, comma-separated
      height: number

  TreeView:
    icon: list-tree
    group: Data
    summary: Nested tree — options are slash-separated paths ("a/b/c").
    component: guise::data::TreeView
    props:
      value: string
      options: string  # paths, comma-separated
      height: number
      expanded:
        type: bool
        default: false
    events:
      change: Fires on select/activate/toggle; writes the node id to a bound value.

  DataView:
    icon: layout-grid
    group: Data
    summary: Signal-backed selectable item view (list or grid).
    component: guise::data::DataView
    props:
      value: string
      options: string  # items, comma-separated
      height: number
      columns: number  # >0 switches to grid layout
    events:
      change: Fires on selection; writes the item to a bound value.

  Avatar:
    icon: circle-user
    group: Data
    summary: Initials avatar chip.
    component: guise::data::Avatar
    props:
      text: string
      color: string
      variant: string
      size: string
      radius: string

  AvatarGroup:
    icon: users
    group: Data
    summary: Overlapping avatar stack with overflow count.
    component: guise::data::AvatarGroup
    props:
      options: string  # initials, comma-separated
      limit: number
      size: string

  Timeline:
    icon: git-commit-vertical
    group: Data
    summary: Vertical timeline — options are "Title | description".
    component: guise::data::Timeline
    props:
      options: string  # items, comma-separated
      active: number
      color: string

  Breadcrumbs:
    icon: chevrons-right
    group: Navigation
    summary: Hierarchical breadcrumb trail.
    component: guise::nav::Breadcrumbs
    props:
      options: string  # crumbs, comma-separated
      separator: string

  Pagination:
    icon: ellipsis
    group: Navigation
    summary: Page number strip.
    component: guise::nav::Pagination
    props:
      value: string
      total:
        type: number
        required: true
      active: number
      color: string
    events:
      change: Fires on page change; writes the page number to a bound value.

  Stepper:
    icon: list-ordered
    group: Navigation
    summary: Step wizard — options are "Label | description".
    component: guise::nav::Stepper
    props:
      options: string  # steps, comma-separated
      active: number
      color: string

  NavLink:
    icon: link
    group: Navigation
    summary: Sidebar/nav link with optional icon, description, active state.
    component: guise::nav::NavLink
    props:
      label: string
      description: string
      icon: string
      color: string
      active:
        type: bool
        default: false
    events:
      click: Fires on activation.

  NavigationMenu:
    icon: menu
    group: Navigation
    summary: Horizontal nav menu — options are "id | Label".
    component: guise::nav::NavigationMenu
    props:
      value: string
      options: string  # items, comma-separated
      active: string   # active item id
    events:
      change: Fires on selection; writes the item id to a bound value.

  StatusBar:
    icon: panel-bottom
    group: Navigation
    summary: Bottom status strip — children fill left/center/right in order.
    component: guise::nav::StatusBar
    children: any
    props:
      height: number

  Loader:
    icon: loader-circle
    group: Feedback
    summary: Animated loading indicator (dots or bars).
    component: guise::feedback::Loader
    props:
      variant: string  # "dots" (default) or "bars"
      size: string
      color: string

  Notification:
    icon: bell
    group: Feedback
    summary: Inline notification card with optional title and close.
    component: guise::feedback::Notification
    props:
      text: string
      title: string
      color: string
      icon: string
    events:
      close: Fires when dismissed.

  RingProgress:
    icon: circle-dashed
    group: Feedback
    summary: Circular progress ring with optional center label.
    component: guise::feedback::RingProgress
    props:
      value:
        type: number
        required: true
      size: number
      color: string
      label: string

  ToastStack:
    icon: layers
    group: Feedback
    summary: Auto-dismissing toast stack.
    component: guise::feedback::ToastStack
    props:
      options: string  # initial toasts, comma-separated

  Modal:
    icon: square
    group: Overlays
    summary: Dialog overlay with title and optional close handler.
    component: guise::overlay::Modal
    children: any
    props:
      title: string
      width: number
      padding: string
      radius: string
    events:
      close: Fires on backdrop/close.

  ConfirmModal:
    icon: message-square-warning
    group: Overlays
    summary: Confirm/cancel dialog — confirm and cancel events.
    component: guise::overlay::ConfirmModal
    children: any
    props:
      title: string
      message: string
      confirm_label: string
      cancel_label: string
      danger:
        type: bool
        default: false
      width: number
    events:
      confirm: Fires on the confirm button.
      cancel: Fires on cancel/backdrop.

  Popover:
    icon: message-square
    group: Overlays
    summary: Anchored floating panel — first child is the trigger, second the content.
    component: guise::overlay::Popover
    children: any
    props:
      placement: string  # bottom, bottom-end, top, top-end
      width: number

  HoverCard:
    icon: square-mouse-pointer
    group: Overlays
    summary: Hover-triggered card — first child is the trigger, second the content.
    component: guise::overlay::HoverCard
    children: any
    props:
      placement: string
      width: number

  Tooltip:
    icon: info
    group: Overlays
    summary: Floating hint label.
    component: guise::overlay::Tooltip
    props:
      label: string

  ContextMenu:
    icon: square-menu
    group: Overlays
    summary: Right-click item menu — show() drives it from tree/context events.
    component: guise::overlay::ContextMenu
    props:
      value: string
      options: string  # items, comma-separated
      size: string
      width: number
    events:
      change: Fires on item pick; writes the label to a bound value.

  Menu:
    icon: chevron-down
    group: Overlays
    summary: Dropdown menu with a text trigger.
    component: guise::overlay::Menu
    props:
      value: string
      trigger: string
      options: string  # items, comma-separated
      size: string
    events:
      change: Fires on item pick; writes the label to a bound value.

  MenuBar:
    icon: panel-top
    group: Overlays
    summary: Top menu strip — menus are "File:New,Open;Edit:Copy,Paste".
    component: guise::overlay::MenuBar
    props:
      value: string
      menus: string
      size: string
    events:
      change: Fires on item pick; writes the item label to a bound value.

  Drawer:
    icon: panel-right
    group: Overlays
    summary: Slide-in side panel.
    component: guise::overlay::Drawer
    children: any
    props:
      title: string
      side: string  # left, right, top, bottom
      size: number
      padding: string
    events:
      close: Fires on dismiss.

  Spotlight:
    icon: search
    group: Overlays
    summary: Command palette — options are "Label | hint".
    component: guise::overlay::Spotlight
    props:
      value: string
      options: string  # commands, comma-separated
    events:
      change: Fires on command pick; writes the label to a bound value.

  LoadingOverlay:
    icon: loader
    group: Overlays
    summary: Blocking busy overlay.
    component: guise::overlay::LoadingOverlay
    props:
      visible:
        type: bool
        default: true
      variant: string  # loader variant

  Tour:
    icon: route
    group: Overlays
    summary: Guided step tour — options are "Title | body".
    component: guise::overlay::Tour
    props:
      value: string
      options: string  # steps, comma-separated
      autostart:
        type: bool
        default: false
    events:
      change: Fires on step change; writes the index to a bound value.

  LineChart:
    icon: chart-line
    group: Charts
    summary: Line chart over a numeric series.
    component: guise::chart::LineChart
    props:
      values: string  # comma-separated numbers
      color: string
      stroke: number
      fill:
        type: bool
        default: false
      axis:
        type: bool
        default: false
      hover:
        type: bool
        default: false

  BarChart:
    icon: chart-bar
    group: Charts
    summary: Bar chart — values are "label:value" or plain numbers.
    component: guise::chart::BarChart
    props:
      values: string  # comma-separated
      color: string
      gap: number
      axis:
        type: bool
        default: false
      hover:
        type: bool
        default: false
      width: number
      height: number

  PieChart:
    icon: chart-pie
    group: Charts
    summary: Pie/donut chart — values are "label:value".
    component: guise::chart::PieChart
    props:
      values: string  # comma-separated
      size: number
      donut: number   # inner fraction, e.g. 0.6

  AreaChart:
    icon: chart-area
    group: Charts
    summary: Filled area chart over a numeric series.
    component: guise::chart::AreaChart
    props:
      values: string  # comma-separated
      labels: string  # x labels, comma-separated
      overlaid:
        type: bool
        default: false
      axis:
        type: bool
        default: false
      width: number
      height: number

  ScatterChart:
    icon: chart-scatter
    group: Charts
    summary: XY scatter — values are "x,y;x,y" points.
    component: guise::chart::ScatterChart
    props:
      values: string
      hover:
        type: bool
        default: false
      width: number
      height: number

  Sparkline:
    icon: activity
    group: Charts
    summary: Compact inline trend line.
    component: guise::chart::Sparkline
    props:
      values: string  # comma-separated
      height: number
      full_width:
        type: bool
        default: false

  ScrollArea:
    icon: scroll
    group: Layout
    summary: Scrollable region with styled scrollbar.
    component: guise::ScrollArea
    children: any
    props:
      max_height: number
      fill:
        type: bool
        default: false
      scrollbar:
        type: bool
        default: true
      horizontal:
        type: bool
        default: false

  SimpleGrid:
    icon: grid-3x3
    group: Layout
    summary: Equal-width column grid.
    component: guise::layout::SimpleGrid
    children: any
    props:
      cols:
        type: number
        default: 2
      spacing: string

  AppShell:
    icon: layout-template
    group: Layout
    summary: "App frame — children with `slot: header|navbar|aside|footer` fill shell slots; others form the main column."
    component: guise::layout::AppShell
    children: any

  Anchor:
    icon: link-2
    group: Typography
    summary: Link-styled clickable text.
    component: guise::Anchor
    content: label
    props:
      label: string
      color: string
      size: string
    events:
      click: Fires on click.

  About:
    icon: info
    group: Display
    summary: About dialog content — name, version, build, tagline, credits.
    component: guise::About
    props:
      name:
        type: string
        required: true
      version: string
      build: string   # "release" or "development"
      build_date: string
      tagline: string
      credits: string

  WindowControls:
    icon: minus
    group: Chrome
    summary: Native-style window buttons (min/max/close).
    component: guise::WindowControls
    props:
      button_width: number
      height: number

  Markdown:
    icon: file-text
    group: Content
    summary: Rendered markdown view.
    component: guise::markdown::Markdown
    props:
      text: string
      size: string
      color: string   # accent
      max_lines: number

  SortableList:
    icon: list-ordered
    group: Data
    summary: Drag-to-reorder list — items from options.
    component: guise::SortableList
    props:
      value: string
      options: string  # items, comma-separated
      gap: number
    events:
      change: Fires on reorder; writes [from, to] to a bound value.

  SplitPanel:
    icon: columns-2
    group: Layout
    summary: Resizable two-pane split — first two children fill the panes.
    component: guise::SplitPanel
    children: any
    props:
      height: number
      value: string
      direction: string  # horizontal | vertical
      ratio: number
    events:
      change: Fires on resize; writes the ratio to a bound value.

  Carousel:
    icon: gallery-horizontal
    group: Data
    summary: Paged slide view — each child is a slide.
    component: guise::Carousel
    children: any
    props:
      value: string
      no_wrap:
        type: bool
        default: false
      height: number
    events:
      change: Fires on slide change; writes the index to a bound value.

  MarkdownEditor:
    icon: square-pen
    group: Content
    summary: Markdown source editor.
    component: guise::markdown::MarkdownEditor
    props:
      value: string
      placeholder: string
      rows: number
      readonly:
        type: bool
        default: false
    events:
      change: Fires on edit/link-click; writes the text to a bound value.

  Editor:
    icon: code-2
    group: Content
    summary: Code editor with syntax highlighting.
    component: guise::editor::Editor
    props:
      value: string
      language: string  # rust, sql, json, toml, python, js, ts, go, c, markdown
      placeholder: string
      readonly:
        type: bool
        default: false
    events:
      change: Fires on edit/run; writes the text to a bound value.

  VideoView:
    icon: video
    group: Media
    summary: Video surface — frames pushed via its VideoFeed handle.
    component: guise::video::VideoView
    props:
      fit: string   # contain | cover | stretch
      background: string  # "#RRGGBB"
      width: number
      height: number
      radius: string
      placeholder: string

  WebView:
    icon: globe
    group: Media
    summary: Embedded web view.
    component: guise::WebView
    props:
      value: string
      url: string
      html: string
      init_script: string
      radius: string
      bordered:
        type: bool
        default: false
      transparent:
        type: bool
        default: false
    events:
      change: Fires on title/url/message; writes the payload to a bound value.

  AIChatView:
    icon: messages-square
    group: AI
    summary: Scrolling chat transcript of turns, with stick-to-bottom and streaming reply support.
    component: guise::AIChatView
    props:
      turns: string  # "role|body" entries, separated by ';' — role: user|assistant|system
      empty: string
      max_width: number
      virtualize: bool
      size: string
      value: string
    events:
      open: Fires on source click; writes [turn, source] to a bound value.

  AIComposer:
    icon: send-horizontal
    group: AI
    summary: Prompt input box with send, stop and attach.
    component: guise::AIComposer
    props:
      placeholder: string
      hint: string
      attachments: bool
      disabled: bool
      size: string
      value: string
    events:
      submit: Fires on send; writes the prompt to a bound value.
      stop: Fires on interrupt.
      attach: Fires on the attach button.
      change: Fires as the draft changes; writes it to a bound value.

  AIMessage:
    icon: message-square
    group: AI
    summary: One chat turn — role avatar, body, optional error; children slot under the body.
    component: guise::AIMessage
    content: text
    props:
      text: string
      role: string  # user | assistant | system | tool
      name: string
      meta: string
      error: string
      streaming: bool
      avatar: bool
      size: string
    children: any

  AIModelPicker:
    icon: brain-cog
    group: AI
    summary: Dropdown to pick the model a request runs on.
    component: guise::AIModelPicker
    props:
      models: string  # "id:Label" entries, separated by ';'
      value: string
      label: string
      disabled: bool
      size: string
    events:
      change: Fires on selection; writes the model id to a bound value.

  AIReasoning:
    icon: lightbulb
    group: AI
    summary: Collapsible block for a model's extended thinking.
    component: guise::AIReasoning
    content: text
    props:
      text: string
      label: string
      open: bool
      streaming: bool
      size: string
    events:
      toggle: Fires on expand/collapse.

  AISources:
    icon: book-open
    group: AI
    summary: Citation list under an answer.
    component: guise::AISources
    props:
      sources: string  # "title|location|excerpt" entries, separated by ';'
      title: string
      excerpts: bool
      size: string
      value: string
    events:
      open: Fires on source click; writes the index to a bound value.

  AIStreamingText:
    icon: text-cursor
    group: AI
    summary: Reply text arriving token by token, with an optional caret.
    component: guise::AIStreamingText
    content: text
    props:
      text: string
      caret: bool
      size: string

  AIThinking:
    icon: loader-pinwheel
    group: AI
    summary: "Waiting-for-reply indicator (\"thinking…\")"
    component: guise::AIThinking
    props:
      label: string
      color: string
      size: string

  AITokenMeter:
    icon: gauge
    group: AI
    summary: Token usage against a limit, with an optional bar.
    component: guise::AITokenMeter
    props:
      used: number
      limit: number
      label: string
      bar: bool
      size: string

  AIToolCall:
    icon: wrench
    group: AI
    summary: A tool invocation — name, status, arguments and result.
    component: guise::AIToolCall
    props:
      name: string
      status: string  # pending | running | ok | error
      arguments: string
      result: string
      meta: string
      open: bool
      expandable: bool
      size: string
    events:
      toggle: Fires on expand/collapse.

  AICitation:
    icon: quote
    group: AI
    summary: Inline numbered citation marker.
    component: guise::AICitation
    props:
      number: number
      label: string
      size: string
    events:
      click: Fires when the citation is clicked.

  AICost:
    icon: circle-dollar-sign
    group: AI
    summary: Dollar cost of a request, computed from usage and pricing.
    component: guise::AICost
    props:
      input: number
      output: number
      cache_read: number
      price_in: number
      price_out: number
      price_cache: number
      label: string
      breakdown: bool
      size: string

  AISettings:
    icon: sliders-horizontal
    group: AI
    summary: Temperature and max-token controls for a request.
    component: guise::AISettings
    props:
      temperature: number
      max_tokens: number
      size: string
    events:
      change: Fires on either control; writes temperature/max_tokens bindings.

  SettingsView:
    icon: settings
    group: Layout
    summary: "Settings shell — page sidebar, search, per-page content. Children take `slot: <page-id>` (or `footer`)."
    component: guise::settings::SettingsView
    props:
      pages: string  # "id|Title" entries, separated by ';'
      active: string
      searchable: bool
      sidebar_width: number
      sidebar_matches_body: bool
      value: string
      query: string
    children: any
    events:
      change: Fires on page select; writes the page id to a bound value.
      search: Fires on search; writes the query to a bound value.

  SettingsSection:
    icon: group
    group: Layout
    summary: Titled group of settings rows.
    component: guise::settings::SettingsSection
    content: text
    props:
      text: string
      description: string
      rule: bool
    children: any

  SettingsRow:
    icon: list
    group: Layout
    summary: Label + control row; the first child is the control.
    component: guise::settings::SettingsRow
    content: text
    props:
      text: string
      description: string
      modified: bool
      divider: bool
    children: any
    events:
      reset: Fires on the modified-reset affordance.

  ThemePicker:
    icon: palette
    group: Inputs
    summary: Theme chooser — list or swatch grid, system option included.
    component: guise::ThemePicker
    props:
      layout: string  # list | grid
      system: bool
      value: string
    events:
      change: Fires on choice; writes the choice to a bound value.
