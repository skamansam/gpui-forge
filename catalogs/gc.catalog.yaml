# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the gpui-component adapter (forge-lib-gpui-component)
# — `use: gc: gpui-component`.
catalog: "0.1"
library: gpui-component
name: gpui-component
version: 0.8.1
license: MIT
bases:
  gpui-kit: "^0.8"

elements:
  Button:
    icon: mouse-pointer-click
    group: Buttons
    summary: "gpui-component Button — `use: gc`."
    component: gpui_component::button::Button
    canvas: Button
    content: label
    children: none
    props:
      label: string
  Badge:
    icon: badge
    group: Display
    summary: "gpui-component Badge — `use: gc`."
    component: gpui_component::badge::Badge
    canvas: Badge
    children: none
    props:
      count: number
  Alert:
    icon: circle-alert
    group: Feedback
    summary: "gpui-component Alert — `use: gc`."
    component: gpui_component::alert::Alert
    canvas: Alert
    children: none
    props:
      title: string
      message: string
  Spinner:
    icon: loader
    group: Display
    summary: "gpui-component Spinner — `use: gc`."
    component: gpui_component::spinner::Spinner
    canvas: Spinner
    children: none
  Progress:
    icon: loader-2
    group: Feedback
    summary: "gpui-component Progress — `use: gc`."
    component: gpui_component::progress::Progress
    canvas: Progress
    children: none
    props:
      value: number
  Divider:
    icon: minus
    group: Layout
    summary: "gpui-component Separator — `use: gc`."
    component: gpui_component::separator::Separator
    canvas: Separator
    children: none
  Label:
    icon: type
    group: Typography
    summary: "gpui-component Label — `use: gc`."
    component: gpui_component::label::Label
    canvas:
      element: Label
      props: {label: text}
    children: none
    props:
      label: string
