# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the adabraka base — adabraka-ui components (shadcn
# flavor) on the adabraka-gpui fork. Scaffold for #95.
# Format: docs/spec/catalog-manifest.md
catalog: "0.1"
library: adabraka
name: adabraka-ui
version: 0.1.0
license: MIT
bases:
  adabraka: "*"

elements:
  VStack:
    icon: rows-3
    group: Layout
    summary: Vertical flex container.
    component: adabraka_ui::layout::VStack
    canvas: VStack
    children: any

  HStack:
    icon: columns-3
    group: Layout
    summary: Horizontal flex container.
    component: adabraka_ui::layout::HStack
    canvas: HStack
    children: any

  Card:
    icon: square-stack
    group: Layout
    summary: shadcn-style card — header, content, footer sections.
    component: adabraka_ui::display::card::Card
    canvas: GroupBox
    children: any

  Text:
    icon: pilcrow
    group: Display
    summary: A run of text.
    component: adabraka_ui::components::text::Text
    canvas: Text
    content: text
    props:
      text:
        type: string
        required: true

  Badge:
    icon: badge
    group: Display
    summary: Small status chip.
    component: adabraka_ui::display::badge::Badge
    canvas:
      element: Tag
      props: {text: label}
    content: text
    props:
      text:
        type: string
        required: true
      variant:
        type: enum
        values: [Default, Secondary, Destructive, Outline]
        default: Default

  Avatar:
    icon: circle-user
    group: Display
    summary: User avatar with image or initials fallback.
    component: adabraka_ui::components::avatar::Avatar
    canvas: Avatar
    props:
      src: string
      fallback: string

  Button:
    icon: mouse-pointer-click
    group: Input
    summary: shadcn button variants.
    component: adabraka_ui::components::button::Button
    canvas: Button
    content: label
    props:
      label: string
      variant:
        type: enum
        values: [Default, Destructive, Outline, Secondary, Ghost, Link]
        default: Default
      size:
        type: enum
        values: [Sm, Md, Lg, Icon]
        default: Md
      disabled:
        type: bool
        default: false
    events:
      click:

  Input:
    icon: text-cursor-input
    group: Input
    summary: Single-line text input.
    component: adabraka_ui::components::input::Input
    canvas: Input
    props:
      placeholder: string
      value: string
    events:
      change:

  Checkbox:
    icon: square-check
    group: Input
    summary: Labelled checkbox.
    component: adabraka_ui::components::checkbox::Checkbox
    canvas: Checkbox
    content: label
    props:
      label: string
      checked:
        type: bool
        default: false
    events:
      change:

  Switch:
    icon: toggle-left
    group: Input
    summary: On/off toggle.
    component: adabraka_ui::components::animated_switch::AnimatedSwitch
    canvas: Switch
    props:
      checked:
        type: bool
        default: false
    events:
      change:

  Select:
    icon: chevrons-up-down
    group: Input
    summary: Dropdown pick-one input.
    component: adabraka_ui::components::select::Select
    canvas: Select
    props:
      options: string
      value: string
      placeholder: string
    events:
      change:

  Progress:
    icon: rectangle-horizontal
    group: Feedback
    summary: Progress bar, 0–100.
    component: adabraka_ui::components::progress::ProgressBar
    canvas: Progress
    props:
      value: number

  Alert:
    icon: triangle-alert
    group: Feedback
    summary: shadcn alert — title + description, default/destructive.
    component: adabraka_ui::components::alert::Alert
    canvas:
      element: Alert
      props: {text: message}
    content: text
    props:
      text:
        type: string
        required: true
      title: string
      variant:
        type: enum
        values: [Default, Destructive]
        default: Default

  Dialog:
    icon: app-window
    group: Windows
    summary: Modal dialog.
    component: adabraka_ui::overlays::dialog::Dialog
    canvas: Dialog
    props:
      title: string
    children: any
  Accordion:
    icon: accordion
    group: Components
    summary: "Accordion — adabraka-ui, via Accordion."
    component: adabraka_ui::display::accordion::Accordion
    canvas: Accordion
    children: any
  AlertDialog:
    icon: shield-alert
    group: Components
    summary: "AlertDialog — adabraka-ui, via AlertDialog."
    component: adabraka_ui::overlays::alert_dialog::AlertDialog
    canvas: AlertDialog
  AreaChart:
    icon: chart-area
    group: Components
    summary: "AreaChart — adabraka-ui, via LineChart."
    component: adabraka_ui::charts::area_chart::AreaChart
    canvas: LineChart
  AvatarGroup:
    icon: users
    group: Components
    summary: "AvatarGroup — adabraka-ui, via AvatarGroup."
    component: adabraka_ui::components::avatar_group::AvatarGroup
    canvas: AvatarGroup
    children: any
  BarChart:
    icon: chart-bar
    group: Components
    summary: "BarChart — adabraka-ui, via BarChart."
    component: adabraka_ui::charts::bar_chart::BarChart
    canvas: BarChart
  BottomSheet:
    icon: panel-bottom
    group: Components
    summary: "BottomSheet — adabraka-ui, via Sheet."
    component: adabraka_ui::overlays::bottom_sheet::BottomSheet
    canvas: Sheet
    children: any
  Breadcrumbs:
    icon: chevrons-right
    group: Components
    summary: "Breadcrumbs — adabraka-ui, via Breadcrumb."
    component: adabraka_ui::navigation::breadcrumbs::Breadcrumbs
    canvas: Breadcrumb
    children: any
  Calendar:
    icon: calendar
    group: Components
    summary: "Calendar — adabraka-ui, via Calendar."
    component: adabraka_ui::components::calendar::Calendar
    canvas: Calendar
  ColorPicker:
    icon: pipette
    group: Components
    summary: "ColorPicker — adabraka-ui, via ColorPicker."
    component: adabraka_ui::components::color_picker::ColorPicker
    canvas: ColorPicker
  Combobox:
    icon: chevrons-up-down
    group: Components
    summary: "Combobox — adabraka-ui, via Combobox."
    component: adabraka_ui::components::combobox::Combobox
    canvas: Combobox
  CommandPalette:
    icon: terminal
    group: Components
    summary: "CommandPalette — adabraka-ui, via Command."
    component: adabraka_ui::overlays::command_palette::CommandPalette
    canvas: Command
    children: any
  ContextMenu:
    icon: mouse-pointer-click
    group: Components
    summary: "ContextMenu — adabraka-ui, via ContextMenu."
    component: adabraka_ui::overlays::context_menu::ContextMenu
    canvas: ContextMenu
    children: any
  CopyButton:
    icon: clipboard
    group: Components
    summary: "CopyButton — adabraka-ui, via Clipboard."
    component: adabraka_ui::components::copy_button::CopyButton
    canvas: Clipboard
  DataTable:
    icon: table
    group: Components
    summary: "DataTable — adabraka-ui, via DataTable."
    component: adabraka_ui::display::data_table::DataTable
    canvas: DataTable
    children: any
  DatePicker:
    icon: calendar-days
    group: Components
    summary: "DatePicker — adabraka-ui, via DatePicker."
    component: adabraka_ui::components::date_picker::DatePicker
    canvas: DatePicker
  DonutChart:
    icon: chart-pie
    group: Components
    summary: "DonutChart — adabraka-ui, via PieChart."
    component: adabraka_ui::charts::donut_chart::DonutChart
    canvas: PieChart
  Drawer:
    icon: panel-left
    group: Components
    summary: "Drawer — adabraka-ui, via Sheet."
    component: adabraka_ui::components::drawer_navigation::DrawerNavigation
    canvas: Sheet
    children: any
  Dropdown:
    icon: chevron-down
    group: Components
    summary: "Dropdown — adabraka-ui, via DropdownMenu."
    component: adabraka_ui::components::dropdown::Dropdown
