# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the gpui-video-player adapter (forge-lib-video) —
# `use: video: gpui-video-player`. GStreamer 1.14+ must be installed (#77).
catalog: "0.1"
library: gpui-video-player
name: Video Player
version: 0.1.3
license: MIT
bases:
  gpui-kit: "*"
  gpui02: "*"

elements:
  Player:
    icon: play
    group: Media
    summary: Hardware-decoded video element on a GStreamer pipeline.
    component: gpui_video_player::VideoElement
    children: none
    props:
      src:
        type: string
        required: true
        summary: Video file path (doc-relative) or URL.
      playing:
        type: bool
        summary: False pauses the stream; true resumes.
      volume:
        type: number
        summary: 0.0–1.0.
      muted: bool
      looping: bool
      width: length
      height: length
      buffer_capacity:
        type: number
        summary: Frames buffered ahead of playback (latency vs smoothness).
