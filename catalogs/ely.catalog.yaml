      body: string

  ErrorView:
    icon: octagon-alert
    group: Feedback
    summary: Error page — preset kinds or a status code.
    component: ely_core::feedback::ErrorView
    children: none
    props:
      kind: {type: enum, values: [default, code, not_found, no_permission, maintenance, offline], default: default}
      icon: string
      code: string
      title: string
      detail: string

  ErrorBoundary:
    icon: shield
    group: Feedback
    summary: Renders its child or an error view with retry.
    component: ely_core::feedback::ErrorBoundary
    events:
      retry:

  Suspense:
    icon: hourglass
    group: Feedback
