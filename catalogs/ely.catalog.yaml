  GroupedList:
    icon: circle-dot
    group: Lists
    summary: "GroupedList — `use: ely`."
    component: ely_core::lists::GroupedList
    children: any

  Form:
    icon: circle-dot
    group: Forms
    summary: "Form — `use: ely`."
    component: ely_core::forms::Form
    children: any

  Skeleton:
    icon: circle-dot
    group: Motion
    summary: "Skeleton — `use: ely`."
    component: ely_core::motion::Skeleton
    children: any

  Reorder:
    icon: circle-dot
    group: Motion
    summary: "Reorder — `use: ely`."
    component: ely_core::motion::Reorder
    children: any

  Toolbar:
    icon: circle-dot
    group: Shell
    summary: "Toolbar — `use: ely`."
    component: ely_core::shell::Toolbar
