  Fieldset:
    icon: circle-dot
    group: Layout
    summary: "Fieldset — `use: ely`."
    component: ely_core::layout::Fieldset
    children: any

  Section:
    icon: circle-dot
    group: Layout
    summary: "Section — `use: ely`."
    component: ely_core::layout::Section
    children: any

  Code:
    icon: circle-dot
    group: Typography
    summary: "Code — `use: ely`."
    component: ely_core::typography::Code
    children: any

  CopyableText:
    icon: circle-dot
    group: Typography
    summary: "CopyableText — `use: ely`."
    component: ely_core::typography::CopyableText
    children: any

  PercentText:
    icon: circle-dot
    group: Typography
    summary: "PercentText — `use: ely`."
    component: ely_core::typography::PercentText
