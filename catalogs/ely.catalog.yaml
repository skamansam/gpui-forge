  Knob:
    icon: circle-dot
    group: Forms
    summary: "Knob — `use: ely`."
    component: ely_core::forms::Knob
    children: any

  ProgressBar:
    icon: circle-dot
    group: Motion
    summary: "ProgressBar — `use: ely`."
    component: ely_core::motion::ProgressBar
