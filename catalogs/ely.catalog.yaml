    icon: circle-dot
    group: Feedback
    summary: "Notification — `use: ely`."
    component: ely_core::feedback::Notification
    children: any

  HotkeyInput:
    icon: circle-dot
    group: Forms
    summary: "HotkeyInput — `use: ely`."
    component: ely_core::forms::HotkeyInput
