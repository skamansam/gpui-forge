# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the Ely adapter (forge-lib-ely) — `use: ely: ely-core`.
catalog: "0.1"
library: ely-core
name: Ely Components
version: 0.2.0
license: MIT
bases:
  gpui-kit: "^0.8"

elements:
  Button:
    icon: mouse-pointer-click
    group: Buttons
    summary: "Ely button — variant Primary/Secondary/Outline/Ghost/Subtle/Success/Danger/Link."
    component: ely_core::buttons::Button
    content: label
    children: none
    props:
      label: string
      variant:
        type: enum
        values: [Primary, Secondary, Outline, Ghost, Subtle, Success, Danger, Link]
      size:
        type: enum
        values: [Sm, Md, Lg]
      disabled:
        type: bool
        default: false
    events:
      click:

  IconButton:
    icon: mouse-pointer-2
    group: Buttons
    summary: "Ely icon-only button."
    component: ely_core::buttons::IconButton
    children: none
    props:
      icon: string
      tooltip: string
      disabled:
        type: bool
        default: false
    events:
      click:

  Badge:
    icon: badge
    group: Display
    summary: "Ely status badge."
    component: ely_core::data_display::Badge
    content: label
    children: none
    props:
      label: string

  Divider:
    icon: minus
    group: Layout
    summary: "Ely horizontal/vertical rule."
    component: ely_core::primitives::Divider
    children: none
    props:
      orientation:
        type: enum
        values: [horizontal, vertical]
        default: horizontal

  Alert:
    icon: circle-alert
    group: Feedback
    summary: "Ely severity alert with title + optional body."
    component: ely_core::feedback::Alert
    content: title
    children: none
    props:
      title: string
      severity:
        type: enum
        values: [Info, Success, Warning, Error]
        default: Info
      body: string
      dismissible:
        type: bool
        default: false
    events:
      dismiss:

  StatusMessage:
    icon: info
    group: Feedback
    summary: "Ely one-line status text with optional icon."
    component: ely_core::feedback::StatusMessage
    content: text
    children: none
    props:
      text: string
      icon: string

  Spinner:
    icon: loader-circle
    group: Feedback
    summary: "Ely activity spinner."
    component: ely_core::motion::Spinner
    children: none
    props:
      spinner:
        type: enum
        values: [Ring, Dots, Wave, Bars, Pulse]
        default: Ring
      size:
        type: enum
        values: [Xs, Sm, Md, Lg, Xl, Xxl]
        default: Md

  Heading:
    icon: heading
    group: Type
    summary: "Ely heading (level 1-6)."
    component: ely_core::typography::Heading
    content: text
    children: none
    props:
      text: string
      level:
        type: number
        default: 1

  Avatar:
    icon: circle-user
    group: Display
    summary: "Ely user avatar."
    component: ely_core::data_display::Avatar
    content: name
    children: none
    props:
      name: string

  Paragraph:
    icon: text
    group: Type
    summary: "Ely body text."
    component: ely_core::typography::Paragraph
    content: text
    children: none
    props:
      text: string

  Title:
    icon: type
    group: Type
    summary: "Ely page title."
    component: ely_core::typography::Title
    content: text
    children: none
    props:
      text: string

  CopyButton:
    icon: clipboard
    group: Buttons
    summary: "Ely copy-to-clipboard button."
    component: ely_core::buttons::CopyButton
    children: none
    props: {label: string, text: string, tooltip: string}
  SegmentedControl:
    icon: columns-4
    group: Buttons
    summary: "Ely segmented control — options as children."
    component: ely_core::buttons::SegmentedControl
    children: any
  ToggleButton:
    icon: toggle-left
    group: Buttons
    summary: "Ely toggle button."
    component: ely_core::buttons::ToggleButton
    content: label
    children: none
    props: {label: string, disabled: bool}
    events: {click:}
  TrendIndicator:
    icon: trending-up
    group: Display
    summary: "Ely change indicator (up/down arrow + value)."
    component: ely_core::data_display::TrendIndicator
    children: none
    props: {change: number}
  Statistic:
    icon: chart-column
    group: Display
    summary: "Ely labeled statistic."
    component: ely_core::data_display::Statistic
    children: none
    props: {label: string, value: string}
  KpiCard:
    icon: credit-card
    group: Display
    summary: "Ely KPI card wrapping a Statistic."
    component: ely_core::data_display::KpiCard
    children: none
    props: {label: string, value: string}
  Meter:
    icon: gauge
    group: Display
    summary: "Ely 0-100 meter bar."
    component: ely_core::data_display::Meter
    children: none
    props: {label: string, value: number}
  UsageBar:
    icon: chart-bar
    group: Display
    summary: "Ely used/total usage bar."
    component: ely_core::data_display::UsageBar
    children: none
    props: {used: number, total: number}
  QrCode:
    icon: qr-code
    group: Display
    summary: "Ely QR code."
    component: ely_core::data_display::QrCode
    children: none
    props: {data: string}
  TimelineItem:
    icon: clock
    group: Display
    summary: "One timeline entry (child of Timeline); children render inside the entry body."
    component: ely_core::data_display::TimelineItem
    content: title
    props:
      title: string
      time: string
    children: none
  Banner:
    icon: megaphone
    group: Feedback
    summary: "Ely severity banner."
    component: ely_core::feedback::Banner
    content: text
    children: none
    props: {text: string, severity: {type: enum, values: [Info, Success, Warning, Danger], default: Info}}
  Callout:
    icon: message-circle-question-mark
    group: Feedback
    summary: "Ely severity callout."
    component: ely_core::feedback::Callout
    content: text
    children: none
    props: {text: string, severity: {type: enum, values: [Info, Success, Warning, Danger], default: Info}}
  InlineMessage:
    icon: message-circle
    group: Feedback
    summary: "Ely inline severity message."
    component: ely_core::feedback::InlineMessage
    content: text
    children: none
    props: {text: string, severity: {type: enum, values: [Info, Success, Warning, Danger], default: Info}}
  EmptyState:
    icon: ghost
    group: Feedback
    summary: "Ely empty-state placeholder."
    component: ely_core::feedback::EmptyState
    children: none
    props: {title: string, body: string}
  Switch:
    icon: toggle-left
    group: Forms
    summary: "Ely on/off switch."
    component: ely_core::forms::Switch
    children: none
    props: {checked: bool}
    events: {change:}
  Rating:
    icon: star-half
    group: Forms
    summary: "Ely star rating."
    component: ely_core::forms::Rating
    children: none
    props: {value: number, max: number}
    events: {change:}
  Stepper:
    icon: list-ordered
    group: Forms
    summary: "Ely numeric stepper."
    component: ely_core::forms::Stepper
    children: none
    props: {value: number, min: number, max: number}
    events: {change:}
  Tag:
    icon: tag
    group: Display
    summary: "Ely tag/chip label."
    component: ely_core::data_display::Tag
    content: label
    children: none
    props: {label: string}
  Icon:
    icon: star
    group: Display
    summary: "Ely standalone icon."
    component: ely_core::primitives::Icon
    children: none
    props: {icon: string, size: {type: enum, values: [Xs, Sm, Md, Lg, Xl, Xxl], default: Md}}
  Subtitle:
    icon: captions
    group: Type
    summary: "Ely subtitle text."
    component: ely_core::typography::Subtitle
    content: text
    children: none
    props: {text: string}
  Caption:
    icon: text-cursor-input
    group: Type
    summary: "Ely caption text."
    component: ely_core::typography::Caption
    content: text
    children: none
    props: {text: string}
  Label:
    icon: tag
    group: Type
    summary: "Ely form label text."
    component: ely_core::typography::Label
    content: text
    children: none
    props: {text: string}
  Overline:
    icon: minus
    group: Type
    summary: "Ely overline text."
    component: ely_core::typography::Overline
    content: text
    children: none
    props: {text: string}
  Container:
    icon: square
    group: Layout
    summary: "Ely size-constrained container."
    component: ely_core::layout::Container
    children: any
    props: {size: {type: enum, values: [Xs, Sm, Md, Lg, Xl], default: Md}}
  AspectRatio:
    icon: crop
    group: Layout
    summary: "Ely aspect-ratio box (children fill)."
    component: ely_core::layout::AspectRatio
    children: any
    props: {ratio: number}
  ZStack:
    icon: layers
    group: Layout
    summary: "Ely z-stacked layers (children overlap)."
    component: ely_core::layout::ZStack
    children: any
  Collapsible:
    icon: circle-dot
    group: Layout
    summary: "Collapsible — `use: ely`."
    component: ely_core::layout::Collapsible
    children: any

  Disclosure:
    icon: circle-dot
    group: Primitives
    summary: "Disclosure — `use: ely`."
    component: ely_core::primitives::Disclosure
    children: any

  Sidebar:
    icon: circle-dot
    group: Layout
    summary: "Sidebar — `use: ely`."
    component: ely_core::layout::Sidebar
    children: any

  Radio:
    icon: circle-dot
    group: Forms
    summary: "Radio — `use: ely`."
    component: ely_core::forms::Radio
    children: any

  RadioCard:
    icon: circle-dot
    group: Forms
    summary: "RadioCard — `use: ely`."
    component: ely_core::forms::RadioCard
    children: any

  Checkbox:
    icon: circle-dot
    group: Forms
    summary: "Checkbox — `use: ely`."
    component: ely_core::forms::Checkbox
    children: any

  Slider:
    icon: circle-dot
    group: Forms
    summary: "Slider — `use: ely`."
    component: ely_core::forms::Slider
    children: any

  Knob:
    icon: circle-dot
    group: Forms
    summary: "Knob — `use: ely`."
    component: ely_core::forms::Knob
    children: any

  ProgressBar:
    icon: loader
    group: Motion
    summary: "Linear progress — `value` 0-1, or `indeterminate`; `buffer`, `segments`."
    component: ely_core::motion::ProgressBar
    children: none
    props:
      value: number
      indeterminate: bool
      buffer: number
      segments: number

  NumberInput:
    icon: circle-dot
    group: Forms
    summary: "NumberInput — `use: ely`."
    component: ely_core::forms::NumberInput
    children: any

  Pagination:
    icon: circle-dot
    group: Navigation
    summary: "Pagination — `use: ely`."
    component: ely_core::navigation::Pagination
    children: any

  PinInput:
    icon: circle-dot
    group: Forms
    summary: "PinInput — `use: ely`."
    component: ely_core::forms::PinInput
    children: any

  ListItem:
    icon: list
    group: Lists
    summary: "List row — title/description/detail text, selected/current/disabled states."
    component: ely_core::lists::ListItem
    content: title
    props:
      title: string
      description: string
      detail: string
      selected: bool
      current: bool
      disabled: bool
    events: {secondary:}

    children: none
  GroupedList:
    icon: rows-2
    group: Lists
    summary: "Grouped rows — consecutive children sharing a `group` prop form a section."
    component: ely_core::lists::GroupedList
    children: any

  Form:
    icon: circle-dot
    group: Forms
    summary: "Form — `use: ely`."
    component: ely_core::forms::Form
    children: any

  Skeleton:
    icon: circle-dot
    group: Motion
    summary: "Skeleton — `use: ely`."
    component: ely_core::motion::Skeleton
    children: any


  Toolbar:
    icon: wrench
    group: Shell
    summary: "Tool row — children render as tools."
    component: ely_core::shell::Toolbar
    children: any

  Panel:
    icon: circle-dot
    group: Layout
    summary: "Panel — `use: ely`."
    component: ely_core::layout::Panel
    children: any

  Fieldset:
    icon: circle-dot
    group: Layout
    summary: "Fieldset — `use: ely`."
    component: ely_core::layout::Fieldset
    children: any

  Section:
    icon: circle-dot
    group: Layout
    summary: "Section — `use: ely`."
    component: ely_core::layout::Section
    children: any

  Code:
    icon: circle-dot
    group: Typography
    summary: "Code — `use: ely`."
    component: ely_core::typography::Code
    children: any

  CopyableText:
    icon: circle-dot
    group: Typography
    summary: "CopyableText — `use: ely`."
    component: ely_core::typography::CopyableText
    children: any

  PercentText:
    icon: circle-dot
    group: Typography
    summary: "PercentText — `use: ely`."
    component: ely_core::typography::PercentText
    children: any

  NumberText:
    icon: circle-dot
    group: Typography
    summary: "NumberText — `use: ely`."
    component: ely_core::typography::NumberText
    children: any

  InlineEdit:
    icon: circle-dot
    group: Forms
    summary: "InlineEdit — `use: ely`."
    component: ely_core::forms::InlineEdit
    children: any

  NavItem:
    icon: circle-dot
    group: Navigation
    summary: "NavItem — `use: ely`."
    component: ely_core::navigation::NavItem
    children: any

  Notification:
    icon: circle-dot
    group: Feedback
    summary: "Notification — `use: ely`."
    component: ely_core::feedback::Notification
    children: any

  HotkeyInput:
    icon: circle-dot
    group: Forms
    summary: "HotkeyInput — `use: ely`."
    component: ely_core::forms::HotkeyInput
    children: any

  Select:
    icon: circle-dot
    group: Forms
    summary: "Select — `use: ely`."
    component: ely_core::forms::Select
    children: any

  MultiSelect:
    icon: circle-dot
    group: Forms
    summary: "MultiSelect — `use: ely`."
    component: ely_core::forms::MultiSelect
    children: any

  ChoiceChips:
    icon: circle-dot
    group: Forms
    summary: "ChoiceChips — `use: ely`."
    component: ely_core::forms::ChoiceChips
    children: any


  AvatarGroup:
    icon: users
    group: Display
    summary: "Overlapping avatar stack with optional overflow count."
    component: ely_core::data_display::AvatarGroup
    children: none
    props:
      names: list<string>
      max: number
      size: {type: enum, values: [xs, sm, md, lg, xl], default: md}

  UserChip:
    icon: user
    group: Display
    summary: "Compact user chip — avatar + name."
    component: ely_core::data_display::UserChip
    children: none
    props:
      name: string
      image: string

  CountBadge:
    icon: badge
    group: Display
    summary: "Numeric badge overlaid on a child (e.g. unread counts)."
    component: ely_core::data_display::CountBadge
    props:
      count: number
      max: number

    children: any
  DotBadge:
    icon: circle
    group: Display
    summary: "Status dot overlaid on a child."
    component: ely_core::data_display::DotBadge
    props:
      tone: {type: enum, values: [Neutral, Accent, Info, Success, Warning, Danger], default: Accent}

    children: any
  BeforeAfter:
    icon: columns-2
    group: Display
    summary: "Before/after comparison slider over two children."
    component: ely_core::data_display::BeforeAfter

    children: any
  Changelog:
    icon: history
    group: Display
    summary: "Versioned changelog — children are Release elements."
    component: ely_core::data_display::Changelog

    children: any
  Release:
    icon: tag
    group: Display
    summary: "One changelog release (child of Changelog)."
    component: ely_core::data_display::Release
    children: none
    props:
      version: string
      date: string
      summary: "string"
      changes: string  # "kind:text;kind:text" — kinds: added, changed, deprecated, removed, fixed, security

  Comparison:
    icon: columns-3
    group: Display
    summary: "Feature-comparison matrix; rows use \"name|v1|v2…\", all-yes/no cells render as check marks."
    component: ely_core::data_display::Comparison
    children: none
    props:
      columns: list<string>
      rows: list<string>   # "name|cell|cell…"; cells "yes"/"no"/"true"/"false" → marks

  ActivityFeed:
    icon: activity
    group: Display
    summary: "Chronological activity stream — children are Activity elements."
    component: ely_core::data_display::ActivityFeed

    children: any
  Activity:
    icon: zap
    group: Display
    summary: "One feed entry (child of ActivityFeed)."
    component: ely_core::data_display::Activity
    children: none
    props:
      actor: string
      verb: string
      object: string
      at: string       # ISO-8601 timestamp
      icon: string

  Gauge:
    icon: gauge
    group: Display
    summary: "Circular gauge for a value in [min, max]."
    component: ely_core::data_display::Gauge
    children: none
    props:
      label: string
      value: number
      min: {type: number, default: 0}
      max: {type: number, default: 100}

  DescriptionList:
    icon: list
    group: Display
    summary: "Label/value description list."
    component: ely_core::data_display::DescriptionList
    children: none
    props:
      rows: list<string>  # "label|text"

  PropertyGrid:
    icon: table-properties
    group: Display
    summary: "Grouped property sheet — children are PropertyGroup elements."
    component: ely_core::data_display::PropertyGrid

    children: any
  PropertyGroup:
    icon: folder
    group: Display
    summary: "One property-sheet section (child of PropertyGrid)."
    component: ely_core::data_display::PropertyGroup
    children: none
    props:
      title: string
      rows: list<string>  # "name|value"

  Sparkline:
    icon: trending-up
    group: Display
    summary: "Tiny inline chart — line, area, or bars."
    component: ely_core::data_display::Sparkline
    children: none
    props:
      values: list<string>  # numbers
      kind: {type: enum, values: [line, area, bars], default: line}

  Stars:
    icon: star
    group: Display
    summary: "Read-only star rating."
    component: ely_core::data_display::Stars
    children: none
    props: {score: number}

  Timeline:
    icon: git-commit-vertical
    group: Display
    summary: "Vertical timeline — children are TimelineItem elements."
    component: ely_core::data_display::Timeline

    children: any
  Watermark:
    icon: stamp
    group: Display
    summary: "Repeating text watermark overlay."
    component: ely_core::data_display::Watermark
    children: none
    props: {text: string}

  Gallery:
    icon: layout-grid
    group: Display
    summary: "Image gallery grid."
    component: ely_core::data_display::Gallery
    children: none
    props:
      slides: list<string>  # "src|caption"
      columns: number

  Carousel:
    icon: gallery-horizontal
    group: Display
    summary: "Horizontal slide carousel — each child is one slide."
    component: ely_core::data_display::Carousel

    children: any
  Barcode:
    icon: barcode
    group: Display
    summary: "1-D barcode (Code 128 or EAN-13)."
    component: ely_core::data_display::Barcode
    children: none
    props:
      data: string
      kind: {type: enum, values: [code128, ean13], default: code128}

  ActionBar:
    icon: square-menu
    group: Buttons
    summary: "Row of action buttons — docked or floating pill; children are the actions."
    component: ely_core::buttons::ActionBar
    props:
      floating: {type: bool, default: false}

    children: any
  BulkActionBar:
    icon: list-checks
    group: Buttons
    summary: "Selection bar — shows count, bulk action children, and a clear button."
    component: ely_core::buttons::BulkActionBar
    props:
      count: number
    events:
      clear:

    children: any
  ConfirmButton:
    icon: shield-check
    group: Buttons
    summary: "Button that arms before confirming (second click or hold)."
    component: ely_core::buttons::ConfirmButton
    children: none
    props:
      label: string
      armed: string
      mode: {type: enum, values: [Twice, Hold], default: Twice}
    events:
      confirm:

  FloatingActionButton:
    icon: circle-plus
    group: Buttons
    summary: "Floating action button with optional extended label."
    component: ely_core::buttons::FloatingActionButton
    children: none
    props:
      icon: string
      label: string
      tooltip: string
    events:
      click:

  ButtonGroup:
    icon: layout-panel-left
    group: Buttons
    summary: "Joined row of buttons — children are Button elements."
    component: ely_core::buttons::ButtonGroup

    children: any
  ToggleGroup:
    icon: toggle-left
    group: Buttons
    summary: "Single/multi-select toggle strip; value binds the selection."
    component: ely_core::buttons::ToggleGroup
    children: none
    props:
      items: list<string>   # "value|label|icon" (label, icon optional)
      value: string         # selected value(s); list for multiple
      multiple: {type: bool, default: false}
    events:
      change:

  QuickActions:
    icon: zap
    group: Buttons
    summary: "Compact quick-action palette; picking an action fires pick with its label."
    component: ely_core::buttons::QuickActions
    children: none
    props:
      actions: list<string>  # "icon|label|note"
    events:
      pick:

  ShareButton:
    icon: share-2
    group: Buttons
    summary: "Shares text and/or a URL via the platform share sheet."
    component: ely_core::buttons::ShareButton
    children: none
    props:
      text: string
      url: string
    events:
      click:

  ActionSheet:
    icon: panel-bottom
    group: Buttons
    summary: "Bottom action sheet; \"danger:label\" entries render destructive."
    component: ely_core::buttons::ActionSheet
    children: none
    props:
      title: string
      message: string
      actions: list<string>  # "label" or "danger:label"
    events:
      pick:
      close:

  Countdown:
    icon: timer
    group: Feedback
    summary: "Counts down `seconds`; fires done when it reaches zero."
    component: ely_core::feedback::Countdown
    children: none
    props:
      seconds: {type: number, default: 60}
      size: {type: enum, values: [Xs, Sm, Base, Md, Lg, Xl, Xxl, Display], default: Base}
    events:
      done:

  Timer:
    icon: alarm-clock
    group: Feedback
    summary: "Elapsed-time readout; `seconds` offsets the start."
    component: ely_core::feedback::Timer
    children: none
    props:
      seconds: {type: number, default: 0}
      size: {type: enum, values: [Xs, Sm, Base, Md, Lg, Xl, Xxl, Display], default: Base}

  ConfirmationCard:
    icon: shield-question
    group: Feedback
    summary: "Inline confirm/cancel card."
    component: ely_core::feedback::ConfirmationCard
    children: none
    props:
      title: string
      body: string
      confirm_label: string
      destructive: {type: bool, default: false}
    events:
      confirm:
      cancel:

  NotificationCenter:
    icon: bell
    group: Feedback
    summary: "Grouped notification list — children are Notification elements; `group` prop buckets them."
    component: ely_core::feedback::NotificationCenter
    events:
      read_all:
      clear:

    children: any
  ResultView:
    icon: circle-check-big
    group: Feedback
    summary: "Full-area success/failure result; children render as actions."
    component: ely_core::feedback::ResultView
    props:
      status: {type: enum, values: [success, failure], default: success}
      title: string
      body: string

    children: any
  ErrorView:
    icon: octagon-alert
    group: Feedback
    summary: "Error page — preset kinds or a status code."
    component: ely_core::feedback::ErrorView
    children: none
    props:
      kind: {type: enum, values: [default, code, not_found, no_permission, maintenance, offline], default: default}
      icon: string
      code: string
      title: string
      detail: string

  ErrorBoundary:
