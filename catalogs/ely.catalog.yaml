    component: ely_core::feedback::Suspense
    props:
      state: {type: enum, values: [ready, waiting, error], default: ready}
      error: string
      fallback: string
    events:
      retry:

  SavingIndicator:
    icon: cloud-upload
    group: Feedback
    summary: Autosave status line — saving, saved, or failed with retry.
    component: ely_core::feedback::SavingIndicator
