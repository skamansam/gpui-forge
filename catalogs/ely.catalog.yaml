# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the Ely adapter (forge-lib-ely) — `use: ely: ely-core`.
catalog: "0.1"
library: ely-core
name: Ely Components
version: 0.2.0
license: MIT
bases:
  gpui-kit: "^0.8"

elements:
  Button:
    summary: Ely button — variant Primary/Secondary/Outline/Ghost/Subtle/Success/Danger/Link.
    component: ely_core::buttons::Button
    content: label
    children: none
    props:
      label: string
      variant:
        type: enum
        values: [Primary, Secondary, Outline, Ghost, Subtle, Success, Danger, Link]
      size:
        type: enum
        values: [Sm, Md, Lg]
      disabled:
        type: bool
        default: false
    events:
      click:

  IconButton:
    summary: Ely icon-only button.
    component: ely_core::buttons::IconButton
    children: none
    props:
      icon: string
      tooltip: string
      disabled:
        type: bool
        default: false
    events:
      click:

  Badge:
    summary: Ely status badge.
    component: ely_core::data_display::Badge
    content: label
    children: none
    props:
      label: string

  Divider:
    summary: Ely horizontal/vertical rule.
    component: ely_core::primitives::Divider
    children: none
    props:
      orientation:
        type: enum
        values: [horizontal, vertical]
        default: horizontal

  Alert:
    summary: Ely severity alert with title + optional body.
    component: ely_core::feedback::Alert
    content: title
    children: none
    props:
      title: string
      severity:
        type: enum
        values: [Info, Success, Warning, Error]
        default: Info
      body: string
      dismissible:
        type: bool
        default: false
    events:
      dismiss:

  StatusMessage:
    summary: Ely one-line status text with optional icon.
    component: ely_core::feedback::StatusMessage
    content: text
    children: none
    props:
      text: string
      icon: string

  Spinner:
    summary: Ely activity spinner.
    component: ely_core::motion::Spinner
    children: none
    props:
      spinner:
        type: enum
        values: [Ring, Dots, Wave, Bars, Pulse]
        default: Ring
      size:
        type: enum
        values: [Xs, Sm, Md, Lg, Xl, Xxl]
        default: Md

  Heading:
    summary: Ely heading (level 1-6).
    component: ely_core::typography::Heading
    content: text
    children: none
    props:
      text: string
      level:
        type: number
        default: 1

  Avatar:
    summary: Ely user avatar.
    component: ely_core::data_display::Avatar
    content: name
    children: none
    props:
      name: string

  Paragraph:
    summary: Ely body text.
    component: ely_core::typography::Paragraph
    content: text
    children: none
    props:
      text: string

  Title:
    summary: Ely page title.
    component: ely_core::typography::Title
    content: text
    children: none
    props:
      text: string
