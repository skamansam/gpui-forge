# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the Forge runtime's own elements.
# These are provided by gpui-forge-runtime, not by a component library.
catalog: "0.1"
library: forge
name: Forge
version: 0.1.0
license: Apache-2.0
bases:
  gpui-kit: "*"

elements:
  Preview:
    summary: Hosts another Forge document inside this document.
    component: gpui_forge_runtime::render::ForgeView
    props:
      doc:
        type: string
        summary: "Document to preview — a doc-relative `.forge.yaml` path, or
          a named ref (`name: &name`) holding a head-less node body. Empty →
          the host sets the document."
      base:
        type: string
        summary: "Preview host base override (`gpui-kit`, `iced`, `ratatui`, …).
          Empty → the document's own `base:`. Each unique (doc, base) pane
          gets its own preview host."
      placeholder:
        type: string
        summary: Shown while the host application has not set a document.
      remote:
        type: string
        summary: "Non-empty → the document previews in an out-of-process host;
          the element renders a framed card with this label instead of a
          nested view. Set `id:` on the pane so its host can be addressed —
          each declared remote pane spawns its own `forge-preview-{base}`
          host (`base:`/empty → the document's base)."
      mode:
        type: string
        summary: "`embedded` → the host window floats over a transparent slot
          (Studio's `frame_rect` tracking); `stream` → the host's frame events
          render inside the card as a mono grid (terminal bases); default →
          the framed 'click to focus' card."
      compat:
        type: string
        summary: "`true` → the pane renders the document through gpui-kit even
          while `remote:` is set — foreign-base elements map to the `canvas:`
          analogue their catalog declares (structure/DnD on every base) while
          the host keeps running for fidelity."
    events:
      click:
        summary: Fired when the remote-preview card is clicked (e.g. to focus
          the host window).
    children: none

  Outline:
    summary: Widget tree of a document hosted by `forge.Preview`.
    component: gpui_forge_runtime::render::ForgeView
    props:
      of:
        type: string
        required: true
        summary: "The `forge.Preview` element id — `of: canvas`."
      placeholder:
        type: string
        summary: Shown while the preview has no document.
      selected:
        type: string
        bindable: true
        summary: Node index path (`0.2.1`) of the selected row.
    events:
      select: string
    children: none

  Inspector:
    summary: Property table for the selected node in a `forge.Preview`'s document.
    component: gpui_forge_runtime::render::ForgeView
    props:
      of:
        type: string
        required: true
      selected:
        type: string
        bindable: true
        summary: Node index path to inspect — the same path `forge.Outline` writes.
      placeholder:
        type: string
        summary: Shown when nothing is selected.
    children: none

  Files:
    summary: File tree. Two listing modes — `of:` renders a JSON
      `[{name, path, dir, children}]` listing from state, `root:` scans a
      directory itself (`filter:` globs file names, `depth:`/`hidden:` bound
      the scan, `nonce:` or the refresh button rescans). `search:` adds a
      filter box; `query:` exposes its text. `icons:`/`icon-map:` theme the
      rows. `folders:` picks in-place navigation over tree expansion;
      `highlights:` styles rows by file glob. The tree virtualizes — give it
      a bounded slot (`grow` plus `min-height 0` inside a fixed-height
      column); its own scrollbar then handles overflow. File rows write
      `selected` and fire `select` on click, `open` on double-click; folders
      expand (tree) or enter (navigate).
    component: gpui_forge_runtime::render::ForgeView
    props:
      of:
        type: string
        summary: State path holding the file listing — default `studio.files`.
          Takes precedence over `root:` when set.
      root:
        type: string
        summary: Directory to scan — literal or `{$binding}`; the element
          reads the filesystem itself (no host glue needed).
      filter:
        type: list<string>
        summary: Glob(s) limiting file names — `"*.forge.yaml"` or
          `[*.rs, *.toml]`; a comma-separated string works too. Dirs always pass.
      depth:
        type: number
        default: 6
        summary: Max directory depth for a `root:` scan.
      hidden:
        type: bool
        default: false
        summary: Include dotfiles in a `root:` scan.
      nonce:
        type: string
        summary: Cache-bust token — any changing value (`{$path}` to a number
          or timestamp the host bumps) forces a rescan.
      folders:
        type: enum
        values: [tree, navigate]
        default: tree
        summary: "`tree` expands folders in place; `navigate` enters a folder
          in the same panel (flat listing, `..` row climbs back, clamped
          under `root:`). `root:` mode only."
      highlights:
        type: map
        summary: "{file-glob: text-style} — e.g. {\"*.forge.yaml\": bold,
          \"*.json\": green}. A style is a shorthand string (font weights,
          `italic`, `underline`, named colors, `#hex`, `$theme.*`), a map
          `{weight, italic, underline, color}`, or a bound JSON object /
          `\"glob = style\"` lines. First matching glob wins; styles the
          label text, not the row background."
      search:
        type: bool
        default: false
        summary: Show a filter box above the tree — matches file names, keeps
          ancestor folders.
      query:
        type: string
        bindable: true
        summary: The search text — bind it to read or preseed the filter.
      icons:
        type: bool
        default: true
        summary: Show file-type icons on rows.
      icon-map:
        type: map
        summary: "{extension-or-key: icon-name} overrides for the built-in
          icon table; `dir`, `dir-open` and `file` rename the structural glyphs."
      placeholder:
        type: string
        summary: Shown while the listing is empty.
      selected:
        type: string
        bindable: true
        summary: Absolute path of the clicked file.
    events:
      select: string
      open: string
    children: none

  Palette:
    summary: Catalog-driven element palette — a dropdown selects the library
      (base or a registered ForgeLibrary) and a button grid inserts its
      elements via insert_component.
    component: forge::Palette
    children: none

  Showcase:
    summary: Live widget gallery — a dropdown selects the library (state
      `studio.showcase_lib`) and every element renders as a real widget
      under its catalog group in an accordion, so the active theme's effect
      is visible on each widget (#125).
    component: forge::Showcase
    children: none

  Vars:
    summary: Live state inspector — every state var in the named preview's
      document as an editable row; add new vars; bound `{$path}` elements
      react to edits.
    component: forge::Vars
    props:
      of:
        type: string
        default: canvas
        summary: "The `forge.Preview` element id whose document state is
          inspected — `of: canvas`."
    children: none
