# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the Forge runtime's own elements.
# These are provided by gpui-forge-runtime, not by a component library.
catalog: "0.1"
library: forge
name: Forge
version: 0.1.0
license: Apache-2.0
bases:
  gpui-kit: "*"

elements:
  Preview:
    summary: Hosts another Forge document inside this document.
    component: gpui_forge_runtime::render::ForgeView
    props:
      doc:
        type: string
        summary: "Document to preview — a doc-relative `.forge.yaml` path, or
          a named ref (`name: &name`) holding a head-less node body. Empty →
          the host sets the document."
      base:
        type: string
        summary: "Preview host base override (`gpui-kit`, `iced`, `ratatui`, …).
          Empty → the document's own `base:`. Each unique (doc, base) pane
          gets its own preview host."
      placeholder:
        type: string
        summary: Shown while the host application has not set a document.
      remote:
        type: string
        summary: "Non-empty → the document previews in an out-of-process host;
          the element renders a framed card with this label instead of a
          nested view. Set `id:` on the pane so its host can be addressed —
          each declared remote pane spawns its own `forge-preview-{base}`
          host (`base:`/empty → the document's base)."
      mode:
        type: string
        summary: "`embedded` → the host window floats over a transparent slot
          (Studio's `frame_rect` tracking); `stream` → the host's frame events
          render inside the card as a mono grid (terminal bases); default →
          the framed 'click to focus' card."
      compat:
        type: string
        summary: "`true` → the pane renders the document through gpui-kit even
          while `remote:` is set — foreign-base elements map to the `canvas:`
          analogue their catalog declares (structure/DnD on every base) while
          the host keeps running for fidelity."
    events:
      click:
        summary: Fired when the remote-preview card is clicked (e.g. to focus
          the host window).
    children: none

  Outline:
    summary: Widget tree of a document hosted by `forge.Preview`.
    component: gpui_forge_runtime::render::ForgeView
    props:
      of:
        type: string
        required: true
        summary: "The `forge.Preview` element id — `of: canvas`."
      placeholder:
        type: string
        summary: Shown while the preview has no document.
      selected:
        type: string
        bindable: true
        summary: Node index path (`0.2.1`) of the selected row.
    events:
      select: string
    children: none

  Inspector:
    summary: Property table for the selected node in a `forge.Preview`'s document.
      Binding `items`/`styles`/`header` turns it into a data provider — it
      publishes descriptors and renders nothing; lay the fields out yourself
      with `for:` + `forge.InspectorField`.
    component: gpui_forge_runtime::render::ForgeView
    props:
      of:
        type: string
        required: true
      selected:
        type: string
        bindable: true
        summary: Node index path to inspect — the same path `forge.Outline` writes.
      items:
        type: string
        bindable: true
        summary: "Bind target for the field descriptor list: a leading
          `kind:ref` refname entry then one `kind:prop` entry per catalog prop
          — `{kind,name,label,type,options,description,required,value}`."
      styles:
        type: string
        bindable: true
        summary: "Bind target for style entries — `[{kind:style,name,label,value}]`."
      header:
        type: string
        bindable: true
        summary: "Bind target for the header line — `Element - path #id`."
      placeholder:
        type: string
        summary: Shown when nothing is selected.
    children: none

  InspectorField:
    summary: The prop editor for one `forge.Inspector` item — `kind` picks the
      `document.edits.*` namespace (prop/ref/style) and `type` the widget
      (bool→Switch, enum→Select, number→NumberInput, color→ColorPicker,
      else Input). Fires `prop_changed`/`refname_changed`/`style_changed`.
      Wrap in `FormField` for a label.
    component: gpui_forge_runtime::render::ForgeView
    props:
      item:
        type: map
        summary: "The `{$item}` map from a `for:` over `items:`/`styles:` —
          `{kind,name,type,options}` are read from it."
      name:
        type: string
        summary: Prop/style name — overrides `item.name`.
      kind:
        type: enum
        values: [prop, ref, style]
        summary: Which `document.edits.*` namespace the field writes.
      type:
        type: enum
        values: [string, bool, enum, number, color, length, icon, list, map]
        summary: Control kind — overrides `item.type`.
      options:
        type: list<string>
        summary: "Enum choices for `type: enum` — overrides `item.options`."
    children: none

  Icons:
    summary: "Icon browser — a searchable grid of the app's icon catalog
      (`icons/<name>.svg` is `lucide`, the bundled set; `icons/<set>/<name>.svg`
      is a named set the host layers in). `set:` picks or binds the browsed
      set (default: the view's resolved iconset — `meta.iconset`, `[icons] set`
      in forge.toml, else lucide); `sets:` publishes the discovered sets;
      `search:` adds a filter box (`query:` exposes it). A click writes
      `selected` and fires `select` with the icon name. `bare:` renders the
      grid alone — the doc builds its own chrome from the bound
      `categories`/`themes`/`meta`/`status`/`attribution` outputs."
    component: gpui_forge_runtime::render::ForgeView
    props:
      set:
        type: string
        bindable: true
        summary: "Iconset name to browse — `lucide` or a set dir under
          `icons/`. Bound, it's a two-way picker for `studio.iconset`-style state."
      sets:
        type: string
        bindable: true
        summary: Bind target for the discovered set list — `["heroicons", "lucide"]`.
      search:
        type: bool
        summary: Show the filter box; its text goes to `query:` or an internal slot.
      query:
        type: string
        bindable: true
        summary: Search text — bound, external writes reseed the field.
      category:
        type: string
        bindable: true
        summary: "IconifyJSON category filter — a bound prop gets a picker
          over the set's categories (`[all]` resets); static pins it."
      theme:
        type: list<string>
        bindable: true
        summary: "IconifyJSON theme filter — `prefixes`/`suffixes` variations
          (`baseline-`, `-filled`). Bound shows one checkbox per theme and
          holds a `['s:key'/'p:key']` list (empty = no filter; unset defaults
          to the `''` no-suffix themes). A static string pins one theme by
          title."
      selected:
        type: string
        bindable: true
        summary: The clicked icon's name; the matching cell highlights.
      size:
        type: string
        bindable: true
        summary: "Icon size — XSmall/Small/Medium/Large (default Medium).
          Sizes glyphs, cell stride and row height."
      bare:
        type: bool
        summary: "Grid only — the doc lays out its own chrome (pickers,
          search, license panel) from the `categories`/`themes`/`meta`/
          `status`/`attribution` outputs. The grid stays internal: it owns
          measured-width virtualization and per-cell materialization."
      categories:
        type: string
        bindable: true
        summary: "Publishes `['[all]', …]` — the browsed set's category
          names for a doc-side picker (includes a computed Uncategorized)."
      themes:
        type: string
        bindable: true
        summary: "Publishes `[{key, title, checked}]` — one entry per
          theme/suffix option; a doc-side checkbox toggles `theme:` through
          a host hook by `key`."
      meta:
        type: string
        bindable: true
        summary: "Publishes `{set, title, license, spdx, line1, line2}` —
          set name, license + SPDX, and two preformatted info lines."
      status:
        type: string
        bindable: true
        summary: "Publishes `{downloading, label, percent, error}` — live
          set-download state for a doc-side progress bar / retry UI."
      attribution:
        type: string
        bindable: true
        summary: "Publishes bool — true when the set's SPDX license
          requires shipping its notice with the built app."
    events:
      select: string
    # Scoped children — the cell template. Rendered per icon under `$item`
    # = `{name, set, selected, downloaded}`; the runtime keeps the measured
    # grid frame (pinned width, selected/downloaded rings, hover, click→
    # `selected`/`select`). Absent → the built-in glyph+name cell.
    children: any

  Files:
    summary: File tree. Two listing modes — `of:` renders a JSON
      `[{name, path, dir, children}]` listing from state, `root:` scans a
      directory itself (`filter:` globs file names, `depth:`/`hidden:` bound
      the scan, `nonce:` or the refresh button rescans). `search:` adds a
      filter box; `query:` exposes its text. `icons:`/`icon-map:` theme the
      rows. `folders:` picks in-place navigation over tree expansion;
      `highlights:` styles rows by file glob. The tree virtualizes — give it
      a bounded slot (`grow` plus `min-height 0` inside a fixed-height
      column); its own scrollbar then handles overflow. File rows write
      `selected` and fire `select` on click, `open` on double-click; folders
      expand (tree) or enter (navigate).
    component: gpui_forge_runtime::render::ForgeView
    props:
      of:
        type: string
        summary: State path holding the file listing — default `studio.files`.
          Takes precedence over `root:` when set.
      root:
        type: string
        summary: Directory to scan — literal or `{$binding}`; the element
          reads the filesystem itself (no host glue needed).
      filter:
        type: list<string>
        summary: Glob(s) limiting file names — `"*.forge.yaml"` or
          `[*.rs, *.toml]`; a comma-separated string works too. Dirs always pass.
      depth:
        type: number
        default: 6
        summary: Max directory depth for a `root:` scan.
      hidden:
        type: bool
        default: false
        summary: Include dotfiles in a `root:` scan.
      nonce:
        type: string
        summary: Cache-bust token — any changing value (`{$path}` to a number
          or timestamp the host bumps) forces a rescan.
      folders:
        type: enum
        values: [tree, navigate]
        default: tree
        summary: "`tree` expands folders in place; `navigate` enters a folder
          in the same panel (flat listing, `..` row climbs back, clamped
          under `root:`). `root:` mode only."
      highlights:
        type: map
        summary: "{file-glob: text-style} — e.g. {\"*.forge.yaml\": bold,
          \"*.json\": green}. A style is a shorthand string (font weights,
          `italic`, `underline`, named colors, `#hex`, `$theme.*`), a map
          `{weight, italic, underline, color}`, or a bound JSON object /
          `\"glob = style\"` lines. First matching glob wins; styles the
          label text, not the row background."
      search:
        type: bool
        default: false
        summary: Show a filter box above the tree — matches file names, keeps
          ancestor folders.
      query:
        type: string
        bindable: true
        summary: The search text — bind it to read or preseed the filter.
      icons:
        type: bool
        default: true
        summary: Show file-type icons on rows.
      icon-map:
        type: map
        summary: "{extension-or-key: icon-name} overrides for the built-in
          icon table; `dir`, `dir-open` and `file` rename the structural glyphs."
      placeholder:
        type: string
        summary: Shown while the listing is empty.
      selected:
        type: string
        bindable: true
        summary: Absolute path of the clicked file.
    events:
      select: string
      open: string
    children: none

  Palette:
    summary: Catalog-driven element palette — a dropdown selects the library
      (base or a registered ForgeLibrary) and a button grid inserts its
      elements via insert_component.
    component: forge::Palette
    children: none

  Showcase:
    summary: Live widget gallery — a dropdown selects the library (state
      `studio.showcase_lib`) and every element renders as a real widget
      under its catalog group in an accordion, so the active theme's effect
      is visible on each widget (#125).
    component: forge::Showcase
    children: none

  Vars:
    summary: Live state inspector — every state var in the named preview's
      document as an editable row; add new vars; bound `{$path}` elements
      react to edits.
    component: forge::Vars
    props:
      of:
        type: string
        default: canvas
        summary: "The `forge.Preview` element id whose document state is
          inspected — `of: canvas`."
      count:
        type: string
        bindable: true
        summary: "Publishes the flattened variable count — how many rows
          the inspector is showing."
    children: none
