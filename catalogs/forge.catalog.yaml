# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the Forge runtime's own elements.
# These are provided by gpui-forge-runtime, not by a component library.
catalog: "0.1"
library: forge
name: Forge
version: 0.1.0
license: Apache-2.0
bases:
  gpui-kit: "*"

elements:
  Preview:
    summary: Hosts another Forge document inside this document.
    component: gpui_forge_runtime::render::ForgeView
    props:
      placeholder:
        type: string
        summary: Shown while the host application has not set a document.
      remote:
        type: string
        summary: "Non-empty → the document previews in an out-of-process host;
          the element renders a framed card with this label instead of a
          nested view."
      mode:
        type: string
        summary: "`embedded` → the host window floats over a transparent slot
          (Studio's `frame_rect` tracking); `remote` (default) → the framed
          'click to focus' card."
    events:
      click:
        summary: Fired when the remote-preview card is clicked (e.g. to focus
          the host window).
    children: none

  Outline:
    summary: Widget tree of a document hosted by `forge.Preview`.
    component: gpui_forge_runtime::render::ForgeView
    props:
      of:
        type: string
        required: true
        summary: "The `forge.Preview` element id — `of: canvas`."
      placeholder:
        type: string
        summary: Shown while the preview has no document.
      selected:
        type: string
        bindable: true
        summary: Node index path (`0.2.1`) of the selected row.
    events:
      select: string
    children: none

  Inspector:
    summary: Property table for the selected node in a `forge.Preview`'s document.
    component: gpui_forge_runtime::render::ForgeView
    props:
      of:
        type: string
        required: true
      selected:
        type: string
        bindable: true
        summary: Node index path to inspect — the same path `forge.Outline` writes.
      placeholder:
        type: string
        summary: Shown when nothing is selected.
    children: none

  Palette:
    summary: Catalog-driven element palette — a dropdown selects the library
      (base or a registered ForgeLibrary) and a button grid inserts its
      elements via insert_component.
    component: forge::Palette
    children: none

  Showcase:
    summary: Live widget gallery — a dropdown selects the library (state
      `studio.showcase_lib`) and every element renders as a real widget
      under its catalog group in an accordion, so the active theme's effect
      is visible on each widget (#125).
    component: forge::Showcase
    children: none

  Vars:
    summary: Live state inspector — every state var in the named preview's
      document as an editable row; add new vars; bound `{$path}` elements
      react to edits.
    component: forge::Vars
    props:
      of:
        type: string
        default: canvas
        summary: "The `forge.Preview` element id whose document state is
          inspected — `of: canvas`."
    children: none
