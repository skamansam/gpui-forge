# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the ratatui TUI base. Scaffold for #112 — elements are
# terminal widgets/layouts. `style:` adapts to ratatui constraints.
# Format: docs/spec/catalog-manifest.md
catalog: "0.1"
library: ratatui
name: Ratatui
version: 0.1.0
license: MIT
bases:
  ratatui: "*"

elements:
  VStack:
    icon: rows-3
    group: Layout
    summary: Vertical layout constraint — children stack top-down.
    component: ratatui::layout::Layout
    canvas: VStack
    children: any

  HStack:
    icon: columns-3
    group: Layout
    summary: Horizontal layout constraint — children flow left-right.
    component: ratatui::layout::Layout
    canvas: HStack
    children: any

  Spacer:
    icon: move-vertical
    group: Layout
    summary: Empty area of `size` cells — pushes siblings apart.
    component: ratatui::layout::Constraint
    canvas: Spacer
    children: none
    props:
      size:
        type: number
        summary: Fixed extent in cells.

  Text:
    icon: pilcrow
    group: Display
    summary: Paragraph of styled terminal text.
    component: ratatui::widgets::Paragraph
    canvas: Text
    content: text
    props:
      text:
        type: string
        required: true
      wrap:
        type: bool
        default: true

  Title:
    icon: heading
    group: Display
    summary: Bold text — a `Text` variant for headings.
    component: ratatui::widgets::Paragraph
    canvas: Text
    content: text
    props:
      text: string
      wrap:
        type: bool
        default: true

  Divider:
    icon: minus
    group: Display
    summary: One-row horizontal rule across its area.
    component: ratatui::widgets::Block
    canvas: Separator
    children: none

  Log:
    icon: scroll-text
    group: Display
    summary: Scrollable text view — `offset` sets the first drawn row.
    component: ratatui::widgets::Paragraph
    canvas: ScrollView
    content: text
    children: none
    props:
      text: string
      offset:
        type: number
        summary: First drawn row — bind it and the wheel or arrows scroll.
      wrap:
        type: bool
        default: true
        summary: Reflow lines instead of clipping them.
    events:
      change:

  Block:
    icon: square
    group: Display
    summary: Bordered block with optional title — the TUI frame primitive.
    component: ratatui::widgets::Block
    canvas: GroupBox
    props:
      title: string
      borders:
        type: bool
        default: true
    children: any

  Paper:
    icon: file
    group: Display
    summary: Rounded border block — a `Block` alias for panel grouping.
    component: ratatui::widgets::Block
    canvas: GroupBox
    props:
      title: string
      borders:
        type: bool
        default: true
    children: any

  Card:
    icon: id-card
    group: Display
    summary: Rounded border block — a `Block` alias for card grouping.
    component: ratatui::widgets::Block
    canvas: GroupBox
    props:
      title: string
      borders:
        type: bool
        default: true
    children: any

  List:
    icon: list
    group: Display
    summary: Scrollable list of text items.
    component: ratatui::widgets::List
    canvas: List
    props:
      items: string
      selected: number
      title: string
    events:
      select:

  Table:
    icon: table
    group: Display
    summary: Rows and columns of cells.
    component: ratatui::widgets::Table
    canvas: Table
    props:
      header: string
      rows: string
      title: string

  Gauge:
    icon: rectangle-horizontal
    group: Feedback
    summary: Filled gauge, 0–100.
    component: ratatui::widgets::Gauge
    canvas: Progress
    props:
      value: number
      label: string

  Progress:
    icon: rectangle-horizontal
    group: Feedback
    summary: Filled gauge, 0–100 — a `Gauge` alias for progress bars.
    component: ratatui::widgets::Gauge
    canvas: Progress
    props:
      value: number
      label: string

  LineGauge:
    icon: minus
    group: Feedback
    summary: One-row line gauge, 0–100 — a slimmer `Gauge`.
    component: ratatui::widgets::LineGauge
    canvas: Progress
    children: none
    props:
      value: number
      label: string
      set:
        type: enum
        values: [normal, thick, double]
        default: normal
        summary: Line glyph set for the filled and unfilled runs.

  Scrollbar:
    icon: scroll
    group: Feedback
    summary: Scrollbar track — `position` of `content_length` rows.
    component: ratatui::widgets::Scrollbar
    canvas: ScrollBar
    children: none
    props:
      orientation:
        type: enum
        values: [vertical, horizontal]
        default: vertical
      content_length:
        type: number
        summary: Total rows the thumb represents.
      position:
        type: number
        summary: Thumb row — bind it and the wheel or a track click moves it.
    events:
      change:

  Tabs:
    icon: layout-list
    group: Input
    summary: Tab strip selecting a pane index.
    component: ratatui::widgets::Tabs
    canvas: Tabs
    props:
      titles: string
      selected: number
    events:
      select:

  Input:
    icon: text-cursor-input
    group: Input
    summary: Single-line terminal input.
    component: ratatui::widgets::Paragraph
    canvas: Input
    props:
      label: string
      placeholder: string
      value: string
    events:
      change:
      submit:

  TextInput:
    icon: text-cursor-input
    group: Input
    summary: Single-line terminal input — an `Input` alias.
    component: ratatui::widgets::Paragraph
    canvas: Input
    props:
      label: string
      placeholder: string
      value: string
    events:
      change:
      submit:

  Button:
    icon: mouse-pointer-click
    group: Input
    summary: Focusable action — `on click:` fires on Enter, Space or a click.
    component: ratatui::widgets::Paragraph
    canvas: Button
    content: text
    props:
      text: string
    events:
      click:

  Select:
    icon: list
    group: Input
    summary: Arrow-key pick from `items` — `selected` binds the choice.
    component: ratatui::widgets::List
    canvas: Select
    props:
      items: string
      selected: number
      title: string
    events:
      select:

  Checkbox:
    icon: check-square
    group: Input
    summary: "`[x]`/`[ ]` toggle — `checked` binds the state."
    component: ratatui::widgets::Paragraph
    canvas: Checkbox
    props:
      checked: bool
      text: string
    events:
      change:

  Switch:
    icon: toggle-right
    group: Input
    summary: "`[x]`/`[ ]` toggle — a `Checkbox` alias for switch semantics."
    component: ratatui::widgets::Paragraph
    canvas: Switch
    props:
      checked: bool
      text: string
    events:
      change:
  BarChart:
    icon: circle-dot
    group: Components
    summary: Bar chart over a `data:` `[number]` series; `labels` names bars.
    component: ratatui::widgets::BarChart
    canvas: BarChart
    children: none
    props:
      data:
        type: list<number>
        required: true
        summary: Bar values.
      labels:
        type: string
        summary: Newline-separated bar labels; defaults to bar index.
      bar_width:
        type: number
        summary: Cells per bar.
      max:
        type: number
        summary: Scale ceiling; defaults to the largest value.

  Calendar:
    icon: circle-dot
    group: Components
    summary: Month calendar — `date` picks the month; today is highlighted.
    component: ratatui::widgets::calendar::Monthly
    canvas: Calendar
    children: none
    props:
      date:
        type: string
        summary: "`YYYY-MM` or `YYYY-MM-DD`; defaults to today (UTC)."

  Chart:
    icon: circle-dot
    group: Components
    summary: Line chart over a `data:` `[number]` series (index on x).
    component: ratatui::widgets::Chart
    canvas: LineChart
    children: none
    props:
      data:
        type: list<number>
        required: true
        summary: Series values — point x is the value's index.
      name:
        type: string
        summary: Series label shown in the legend.
      x_min: number
      x_max: number
      y_min: number
      y_max: number

  Sparkline:
    icon: circle-dot
    group: Components
    summary: Inline sparkline over a `data:` `[number]` series.
    component: ratatui::widgets::Sparkline
    canvas: LineChart
    children: none
    props:
      data:
        type: list<number>
        required: true
        summary: Series values.
      max:
        type: number
        summary: Scale ceiling; defaults to the largest value.

  Canvas:
    icon: circle-dot
    group: Components
    summary: Drawing surface — `map` renders the world map layer.
    component: ratatui::widgets::canvas::Canvas
    canvas: Box
    children: none
    props:
      map:
        type: bool
        default: true
        summary: Draw the high-resolution world map.
      x_min: number
      x_max: number
      y_min: number
      y_max: number

  Logo:
    icon: circle-dot
    group: Components
    summary: The ratatui logo — `size` `tiny`|`small`.
    component: ratatui::widgets::RatatuiLogo
    canvas: Image
    children: none
    props:
      size:
        type: enum
        values: [tiny, small]
        default: small


  Clear:
    icon: eraser
    group: Components
    summary: Clears its area (ratatui `Clear` reset widget).
    component: ratatui::widgets::Clear
    canvas: Clear
    children: none
