# yaml-language-server: $schema=../schema/catalog-0.1.json
# Catalog manifest for the ratatui TUI base. Scaffold for #112 — elements are
# terminal widgets/layouts. `style:` adapts to ratatui constraints.
# Format: docs/spec/catalog-manifest.md
catalog: "0.1"
library: ratatui
name: Ratatui
version: 0.1.0
license: MIT
bases:
  ratatui: "*"

elements:
  VStack:
    icon: rows-3
    group: Layout
    summary: Vertical layout constraint — children stack top-down.
    component: ratatui::layout::Layout
    canvas: VStack
    children: any

  HStack:
    icon: columns-3
    group: Layout
    summary: Horizontal layout constraint — children flow left-right.
    component: ratatui::layout::Layout
    canvas: HStack
    children: any

  Spacer:
    icon: move-vertical
    group: Layout
    summary: Empty area of `size` cells — pushes siblings apart.
    component: ratatui::layout::Constraint
    canvas: Spacer
    children: none
    props:
      size:
        type: number
        summary: Fixed extent in cells.

  Text:
    icon: type
    group: Display
    summary: Paragraph of styled terminal text.
    component: ratatui::widgets::Paragraph
    canvas: Text
    content: text
    props:
      text:
        type: string
        required: true
      wrap:
        type: bool
        default: true

  Title:
    icon: heading
    group: Display
    summary: Bold text — a `Text` variant for headings.
    component: ratatui::widgets::Paragraph
    canvas: Text
    content: text
    props:
      text: string
      wrap:
        type: bool
        default: true

  Divider:
    icon: minus
    group: Display
    summary: One-row horizontal rule across its area.
    component: ratatui::widgets::Block
    canvas: Separator
    children: none

  Log:
    icon: scroll-text
    group: Display
    summary: Scrollable text view — `offset` sets the first drawn row.
    component: ratatui::widgets::Paragraph
    canvas: ScrollView
    content: text
    children: none
    props:
      text: string
      offset:
        type: number
        summary: First drawn row — bind it and the wheel or arrows scroll.
      wrap:
        type: bool
        default: true
        summary: Reflow lines instead of clipping them.
    events:
      change:

  Block:
    icon: square
    group: Display
    summary: Bordered block with optional title — the TUI frame primitive.
    component: ratatui::widgets::Block
    canvas: GroupBox
    props:
      title: string
      borders:
        type: bool
        default: true
    children: any

  Paper:
    icon: file
    group: Display
    summary: Rounded border block — a `Block` alias for panel grouping.
    component: ratatui::widgets::Block
    canvas: GroupBox
    props:
      title: string
      borders:
        type: bool
        default: true
    children: any

  Card:
    icon: id-card
    group: Display
    summary: Rounded border block — a `Block` alias for card grouping.
    component: ratatui::widgets::Block
    canvas: GroupBox
    props:
      title: string
      borders:
        type: bool
        default: true
    children: any

  List:
    icon: list
    group: Display
    summary: Scrollable list of text items.
    component: ratatui::widgets::List
    canvas: List
    props:
      items: string
      selected: number
      title: string
    events:
      select:

  Table:
    icon: table
    group: Display
    summary: Rows and columns of cells.
    component: ratatui::widgets::Table
    canvas: Table
    props:
      header: string
      rows: string
      title: string

  Gauge:
    icon: gauge
    group: Feedback
    summary: Filled gauge, 0–100.
    component: ratatui::widgets::Gauge
    canvas: Progress
    props:
      value: number
      label: string

  Progress:
    icon: loader-pinwheel
    group: Feedback
    summary: Filled gauge, 0–100 — a `Gauge` alias for progress bars.
    component: ratatui::widgets::Gauge
    canvas: Progress
    props:
      value: number
      label: string

  LineGauge:
    icon: minus
    group: Feedback
    summary: One-row line gauge, 0–100 — a slimmer `Gauge`.
    component: ratatui::widgets::LineGauge
    canvas: Progress
    children: none
    props:
      value: number
      label: string
      set:
        type: enum
        values: [normal, thick, double]
        default: normal
        summary: Line glyph set for the filled and unfilled runs.

  Scrollbar:
    icon: scroll
    group: Feedback
    summary: Scrollbar track — `position` of `content_length` rows.
    component: ratatui::widgets::Scrollbar
    canvas: ScrollBar
    children: none
    props:
      orientation:
        type: enum
        values: [vertical, horizontal]
        default: vertical
      content_length:
        type: number
        summary: Total rows the thumb represents.
      position:
        type: number
        summary: Thumb row — bind it and the wheel or a track click moves it.
    events:
      change:

  Tabs:
    icon: layout-panel-top
    group: Input
    summary: Tab strip selecting a pane index.
    component: ratatui::widgets::Tabs
    canvas: Tabs
    props:
      titles: string
      selected: number
    events:
      select:

  Input:
    icon: text-cursor-input
    group: Input
    summary: Single-line terminal input.
    component: ratatui::widgets::Paragraph
    canvas: Input
    props:
      label: string
      placeholder: string
      value: string
    events:
      change:
      submit:

  TextInput:
    icon: text-cursor-input
    group: Input
    summary: Single-line terminal input — an `Input` alias.
    component: ratatui::widgets::Paragraph
    canvas: Input
    props:
      label: string
      placeholder: string
      value: string
    events:
      change:
      submit:

  Button:
    icon: mouse-pointer-click
    group: Input
    summary: Focusable action — `on click:` fires on Enter, Space or a click.
    component: ratatui::widgets::Paragraph
    canvas: Button
    content: text
    props:
      text: string
    events:
      click:

  Select:
    icon: square-chevron-down
    group: Input
    summary: Arrow-key pick from `items` — `selected` binds the choice.
    component: ratatui::widgets::List
    canvas: Select
    props:
      items: string
      selected: number
      title: string
    events:
      select:

  Menu:
    icon: menu
    group: Input
    summary: Menu list with `> ` marker — a `Select` alias for command lists.
    component: ratatui::widgets::List
    canvas: Select
    props:
      items: string
      selected: number
      title: string
    events:
      select:

  Checkbox:
    icon: square-check
    group: Input
    summary: "`[x]`/`[ ]` toggle — `checked` binds the state."
    component: ratatui::widgets::Paragraph
    canvas: Checkbox
    props:
      checked: bool
      text: string
    events:
      change:

  Switch:
    icon: toggle-left
    group: Input
    summary: "`[x]`/`[ ]` toggle — a `Checkbox` alias for switch semantics."
    component: ratatui::widgets::Paragraph
    canvas: Switch
    props:
      checked: bool
      text: string
    events:
      change:
  BarChart:
    icon: chart-bar
    group: Components
    summary: Bar chart over a `data:` `[number]` series; `labels` names bars.
    component: ratatui::widgets::BarChart
    canvas: BarChart
    children: none
    props:
      data:
        type: list<number>
        required: true
        summary: Bar values.
      labels:
        type: string
        summary: Newline-separated bar labels; defaults to bar index.
      bar_width:
        type: number
        summary: Cells per bar.
      max:
        type: number
        summary: Scale ceiling; defaults to the largest value.

  Calendar:
    icon: calendar-days
    group: Components
    summary: Month calendar — `date` picks the month; today is highlighted.
    component: ratatui::widgets::calendar::Monthly
    canvas: Calendar
    children: none
    props:
      date:
        type: string
        summary: "`YYYY-MM` or `YYYY-MM-DD`; defaults to today (UTC)."

  Chart:
    icon: chart-line
    group: Components
    summary: Line chart over a `data:` `[number]` series (index on x).
    component: ratatui::widgets::Chart
    canvas: LineChart
    children: none
    props:
      data:
        type: list<number>
        required: true
        summary: Series values — point x is the value's index.
      name:
        type: string
        summary: Series label shown in the legend.
      x_min: number
      x_max: number
      y_min: number
      y_max: number

  Sparkline:
    icon: trending-up
    group: Components
    summary: Inline sparkline over a `data:` `[number]` series.
    component: ratatui::widgets::Sparkline
    canvas: LineChart
    children: none
    props:
      data:
        type: list<number>
        required: true
        summary: Series values.
      max:
        type: number
        summary: Scale ceiling; defaults to the largest value.

  Canvas:
    icon: paintbrush
    group: Components
    summary: Drawing surface — `map` renders the world map layer.
    component: ratatui::widgets::canvas::Canvas
    canvas: Box
    children: none
    props:
      map:
        type: bool
        default: true
        summary: Draw the high-resolution world map.
      x_min: number
      x_max: number
      y_min: number
      y_max: number

  Logo:
    icon: image
    group: Components
    summary: The ratatui logo — `size` `tiny`|`small`.
    component: ratatui::widgets::RatatuiLogo
    canvas: Image
    children: none
    props:
      size:
        type: enum
        values: [tiny, small]
        default: small

  Mascot:
    icon: rat
    group: Components
    summary: The ratatui mascot — a 32x16 half-block illustration.
    component: ratatui::widgets::RatatuiMascot
    canvas: Image
    children: none

  Fill:
    icon: paint-bucket
    group: Display
    summary: Paints its area with one repeated glyph — backgrounds and runs.
    component: ratatui::widgets::Fill
    canvas: Box
    children: none
    props:
      symbol:
        type: string
        summary: Glyph to repeat; defaults to a space fill.


  Clear:
    icon: eraser
    group: Components
    summary: Clears its area (ratatui `Clear` reset widget).
    component: ratatui::widgets::Clear
    canvas: Clear
    children: none

  Tree:
    icon: list-tree
    group: Display
    summary: Collapsible indented tree — `items` (2-space indent) or `TreeItem` children.
    component: tui_tree_widget::Tree
    canvas: Tree
    children: any
    props:
      items:
        type: string
        summary: Indented lines — two spaces or a tab per depth level.
      selected:
        type: string
        summary: Bound identifier path `a/b/c` — arrows, wheel and clicks move it.
      expanded:
        type: bool
        default: true
        summary: Start with every node open.
      title: string
    events:
      select:

  TreeItem:
    icon: list-tree
    group: Display
    summary: One `Tree` row — `id`/`text` plus nested `TreeItem` children.
    component: tui_tree_widget::TreeItem
    canvas: TreeItem
    children: any
    props:
      text: string
      id:
        type: string
        summary: Selection identifier — defaults to `text`.

  Spinner:
    icon: loader-pinwheel
    group: Feedback
    summary: Animated busy glyph — `step` is the frame (bind it and tick).
    component: throbber_widgets_tui::Throbber
    canvas: Spinner
    children: none
    props:
      kind:
        type: enum
        values: [ascii, box-drawing, arrow, double-arrow, vertical-block, horizontal-block, quadrant-block, quadrant-block-crack, white-square, white-circle, black-circle, clock, braille-one, braille-double, braille-six, braille-six-double, braille-eight, braille-eight-double, ogham-a, ogham-b, ogham-c, parenthesis, canadian]
        default: braille-six
      label: string
      step:
        type: number
        summary: Frame step — 0 or absent picks a random frame each draw.
      symbol:
        type: enum
        values: [spin, full, empty]
        default: spin
        summary: "`spin` animates through symbols; `full`/`empty` pin one state."

  Markdown:
    icon: letter-m
    group: Display
    summary: Markdown text rendered to styled lines — `offset` scrolls.
    component: ratatui_markdown::MarkdownRenderer
    canvas: TextView
    content: text
    children: none
    props:
      text: string
      offset:
        type: number
        summary: First drawn row — bind it and the wheel or arrows scroll.
      width:
        type: number
        summary: Render width for wrapping — defaults to the area width.
      title: string
    events:
      change:

  AnsiText:
    icon: terminal
    group: Display
    summary: Text with ANSI escape codes rendered as styled spans.
    component: ansi_to_tui::IntoText
    canvas: Text
    content: text
    children: none
    props:
      text: string

  Terminal:
    icon: square-terminal
    group: Display
    summary: Bordered ANSI screen — escape bytes render styled cells.
    component: ansi_to_tui::IntoText
    canvas: ScrollView
    content: text
    children: none
    props:
      text: string
      title: string
      offset:
        type: number
        summary: First drawn scrollback row — bind it and the wheel scrolls.
    events:
      change:

  ScrollView:
    icon: scroll
    group: Layout
    summary: Virtual `width`x`height` canvas — children clip to the viewport.
    component: tui_scrollview::ScrollView
    canvas: ScrollView
    children: any
    props:
      width:
        type: number
        summary: Virtual content width in cells.
      height:
        type: number
        summary: Virtual content height in cells.
      offset:
        type: number
        summary: Vertical scroll row — bind it and the wheel or arrows scroll.
      scrollbars:
        type: enum
        values: [auto, always, never, vertical, horizontal]
        default: auto
      title: string
    events:
      change:

  CodeEditor:
    icon: square-code
    group: Input
    summary: Tree-sitter code editor — `language` picks the grammar.
    component: ratatui_code_editor::Editor
    canvas: Editor
    content: text
    children: none
    props:
      text: string
      language:
        type: enum
        values: [text, rust, javascript, typescript, python, go, java, c_sharp, c, cpp, html, css, yaml, json, toml, shell, markdown, markdown-inline]
        default: text
      original:
        type: string
        summary: Pre-edit content — set it to show a diff against `text`.
      folding:
        type: bool
        default: true
      offset:
        type: number
        summary: First visible row — bind it and the wheel scrolls.
      title: string
    events:
      change:

  Toast:
    icon: bell
    group: Feedback
    summary: Bordered toast card — `type` tints the border and icon.
    component: ratatui_toaster::Toast
    canvas: Notification
    content: text
    children: none
    props:
      text: string
      type:
        type: enum
        values: [info, success, warning, error]
        default: info

  Popup:
    icon: square-stack
    group: Layout
    summary: Children floated in a centered, bordered surface over the area.
    component: tui_popup::Popup
    canvas: Popover
    children: any
    props:
      width:
        type: number
        summary: Body width in cells — defaults to area minus 4.
      height:
        type: number
        summary: Body height in cells — defaults to area minus 4.
      title: string

  WidgetList:
    icon: list
    group: Data
    summary: Scrolling list whose children are items of mixed height.
    component: tui_widget_list::ListView
    canvas: List
    children: any
    props:
      selected:
        type: number
        summary: Selected item index — bind it for keys, wheel and clicks.
      direction:
        type: enum
        values: [vertical, horizontal]
        default: vertical
      title: string
    events:
      select:

  Nodes:
    icon: workflow
    group: Data
    summary: Node graph — `GraphNode` children auto-place, `edges` links ports.
    component: tui_nodes::NodeGraph
    canvas: Box
    children: any
    props:
      edges:
        type: string
        summary: 'Port links as "from.port>to.port" pairs, comma-separated.'
      lines:
        type: enum
        values: [plain, rounded, double, thick]
        default: plain
        summary: Edge line style.
      title: string

  GraphNode:
    icon: square
    group: Data
    summary: One box inside a `Nodes` graph — `width`/`height` in cells.
    component: tui_nodes::NodeLayout
    canvas: Box
    content: text
    children: none
    props:
      text: string
      width:
        type: number
        default: 12
      height:
        type: number
        default: 3

  Shimmer:
    icon: sparkles
    group: Feedback
    summary: A highlight sweeps the text — `phase` (0..1) pins a frame.
    component: tui_shimmer::shimmer_spans_with_style_at_phase
    canvas: Shimmer
    content: text
    children: none
    props:
      text: string
      phase:
        type: number
        summary: Cycle position 0..1 — bind it and tick to animate.

  Dialog:
    icon: message-square-warning
    group: Feedback
    summary: Centered confirm box — `open` shows it, `choice` binds the answer.
    component: tui_confirm_dialog::ConfirmDialog
    canvas: AlertDialog
    content: text
    children: none
    props:
      title: string
      text: string
      open:
        type: bool
        summary: Draws the dialog when true — bind it to show or dismiss.
      choice:
        type: string
        summary: '"yes"/"no" — bound, written when a button commits.'
      yes-label:
        type: string
        summary: '"(Y)es" markup — the parenthesized char is the hotkey.'
      no-label:
        type: string
        summary: Same markup; the literal `none` drops the button.
    events:
      choose:

  Fx:
    icon: wand
    group: Effects
    summary: Post-processes children cells — `progress` scrubs the effect.
    component: tachyonfx::Effect
    canvas: Box
    children: any
    props:
      kind:
        type: enum
        values: [dissolve, coalesce, dissolve-to, coalesce-from, sweep-in, sweep-out, slide-in, slide-out, explode, expand, expand-v, stretch, paint, fade-to, hsl-shift]
        default: dissolve
      duration:
        type: number
        default: 800
        summary: Effect length in milliseconds.
      progress:
        type: number
        summary: 0..1 through the effect — bind it and tick to animate.

  QrCode:
    icon: qr-code
    group: Display
    summary: QR code drawn as unicode half-blocks from `data`.
    component: qrcode::QrCode
    canvas: Box
    children: none
    props:
      data:
        type: string
        summary: Encoded content — falls back to the text content.

  Image:
    icon: image
    group: Display
    summary: Picture decoded to a halfblock raster — `src` on `base_dir`.
    component: image::open
    canvas: Image
    children: none
    props:
      src:
        type: string
        summary: Image file path — PNG, JPEG and the `image` crate set.
      path: string

  Slider:
    icon: sliders-horizontal
    group: Input
    summary: Value track — a bound `value` takes keys, wheel and clicks.
    component: tui_slider::Slider
    canvas: Slider
    children: none
    props:
      value:
        type: number
        summary: Current value — bind it for keys and pointer writes.
      min:
        type: number
        default: 0
      max:
        type: number
        default: 100
      step:
        type: number
        default: 1
      label: string
      show-value:
        type: bool
        default: true
      orientation:
        type: enum
        values: [horizontal, vertical]
        default: horizontal
    events:
      change:

  PieChart:
    icon: chart-pie
    group: Data
    summary: Pie or donut over a `data` series — `labels` names slices.
    component: tui_piechart::PieChart
    canvas: PieChart
    children: none
    props:
      data:
        type: list<number>
        summary: Slice values.
      labels:
        type: string
        summary: Newline-separated slice labels.
      hole:
        type: number
        summary: Donut hole 0..0.9 — 0 is a full pie.
      legend:
        type: bool
        default: true
      legend-position:
        type: enum
        values: [right, left, top, bottom]
        default: right
      title: string

  BigText:
    icon: case-upper
    group: Display
    summary: 8x8 pixel-font text — `size` trades resolution for room.
    component: tui_big_text::BigText
    canvas: Title
    content: text
    children: none
    props:
      text: string
      size:
        type: enum
        values: [full, half, half-width, quadrant, sextant, third, quarter, octant]
        default: full
      align:
        type: enum
        values: [left, center, right]
        default: left

  Globe:
    icon: globe
    group: Display
    summary: Rotating wireframe earth — camera props aim it.
    component: tui_globe::Globe
    canvas: Box
    children: none
    props:
      yaw:
        type: number
        summary: Camera yaw degrees — bind it and arrows rotate the globe.
      pitch:
        type: number
      zoom:
        type: number
        default: 1
    events:
      change:
