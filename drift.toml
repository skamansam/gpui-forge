# Upstream-drift policy for `cargo xtask components` — maps the *Rust crate
# name* used in catalog `component:` paths to where that crate's source and
# version come from.
#
# Fields per `[crates.<lib-name>]`:
#   package   crates.io package (default: the lib name with `_` → `-`)
#   vendored  source tree under the repo (for crates not on crates.io)
#   local     workspace crate. Component paths check against its own src
#   skip      don't check this crate at all (the reason, for the report)
#   pin       intentional non-latest version. Reported, not a failure
#   surface   restrict the "not cataloged" report to a module subtree.
#             Example: `iced::widget`. Default: every reachable public item.
#   ignore    export names to never list as "not cataloged" (non-widget types).
#   exclude   dep packages whose re-exported surface is hidden from the
#             "not cataloged" report (engine facades like `pub use gpui::*`).

# The published package is `guise-ui`. The library name is `guise`.
[crates.guise]
package = "guise-ui"
exclude = ["gpui"]

# Facades that re-export their gpui engine — hide the engine surface from
# the "not cataloged" report. Their own widget exports still report.
[crates.adabraka_ui]
exclude = ["adabraka-gpui"]

[crates.bezel]
exclude = ["bezel-gpui"]

[crates.ely_core]
exclude = ["gpui-pre"]

[crates.gpui_kit]
exclude = ["gpui-pre"]

[crates.gpui_base]
exclude = ["gpui-pre"]

[crates.gpui_video_player]
exclude = ["gpui", "gstreamer", "glib"]

[crates.bezel_motion]
exclude = ["bezel-gpui"]

# Vendored upstreams — not on crates.io.
[crates.base_gpui]
vendored = "vendor/base-gpui"

[crates.gpui_apple_hig]
vendored = "vendor/gpui-apple-hig"
exclude = ["gpui-kit"]

[crates.gpui_flow]
vendored = "vendor/gpui-flow"

# Forge's own crates — component paths into them are checked against the
# workspace source directly (no crates.io lookup, no version check).
[crates.gpui_forge_runtime]
local = "crates/gpui-forge-runtime"
exclude = ["gpui", "gpui-pre", "bezel-gpui", "adabraka-gpui", "gpui-kit", "gpui-base"]

[crates.forge]
skip = "forge intrinsics — schema elements, not a Rust crate"

[crates.my_lib]
skip = "template catalog — synthetic example"

# iced and ratatui surface their widgets from a module, not the crate root —
# the root union still works. Scoping keeps the "not cataloged" list clean.
[crates.iced]
surface = "iced::widget"

[crates.ratatui]
surface = "ratatui::widgets"
