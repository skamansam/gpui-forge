# Base manifest — see docs/design/multi-base.md
# Scaffold for #94. crate/version pins land with the adapter port — Bezel is
# crabtalk's fork-track, not a crates.io release.
base: "0.1"
id: bezel
name: Bezel
description: Bezel components on the bezel-gpui (crabtalk) fork of Zed's GPUI — WASM via bezel-gpui-web.

gpui:
  crate: bezel-gpui
  version: "0.3.21"
library:
  crate: bezel
  version: "0.2.24"
toolchain: stable
platforms: [linux, macos, windows]
wasm: true
theme: bezel             # environment-based theme bridge lands with the adapter
catalog: bezel
license: MIT

libraries:               # bezel ecosystem catalogs (#94); render shims land with the adapter crates
  bezel-chart: {version: "0.2.24", crate: bezel-chart, license: MIT}
  bezel-editor: {version: "0.2.24", crate: bezel-editor, license: MIT}
  bezel-canvas: {version: "0.2.24", crate: bezel-canvas, license: MIT}
  bezel-markdown: {version: "0.2.24", crate: bezel-markdown, license: MIT}
  bezel-terminal: {version: "0.2.24", crate: bezel-terminal, license: MIT}
  bezel-icons: {version: "0.2.24", crate: bezel-icons, license: MIT}
  bezel-motion: {version: "0.2.24", crate: bezel-motion, license: MIT}
