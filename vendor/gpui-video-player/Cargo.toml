[package]
edition = "2024"
name = "gpui-video-player"
version = "0.1.3"
authors = ["nemurubaka <cijiugechu@gmail.com>"]
build = "build.rs"
exclude = ["assets"]
autolib = false
autobins = false
autoexamples = false
autotests = false
