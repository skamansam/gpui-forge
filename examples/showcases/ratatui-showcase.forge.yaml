$schema: https://gpui-forge.rudeboy.dev/schema/0.1/ratatui.json
forge: "0.1"
state:
  q: string
  tab: number

base: ratatui
meta:
  title: ratatui showcase

root:
  VStack:
  style: {gap: 1}
  children:
      - Text: "ratatui showcase — every ratatui widget"
      - Tabs:
        titles: "Widgets\nData\nForm"
        selected: $tab
      - HStack:
        style: {gap: 1}
        children:
          - Block:
            title: "cpu"
            children:
              - Gauge:
                value: 72
                label: "72%"
          - Block:
            title: "mem"
            children:
              - Gauge:
                value: 41
                label: "41%"
          - Block:
            title: "net"
            children:
              - Text:
                text: "a Text run inside a bordered Block"
                wrap: true
      - HStack:
        style: {gap: 1}
        children:
          - Block:
            title: "a List"
            children:
              - List:
                items: "first\nsecond\nthird\nfourth\nfifth"
                title: "items"
          - Block:
            title: "an Input"
            children:
              - VStack:
                style: {gap: 1}
                children:
                  - Input:
                    placeholder: "type here…"
                    value: $q
                  - Text: "echo: {$q}"
      - Table:
        title: "a Table"
        header: "name | status | load"
        rows: "web-1 | up | 0.62\nweb-2 | up | 0.41\ndb-1 | degraded | 0.91"
      - HStack:
        style: {gap: 1}
        children:
          - Block:
            title: "controls"
            children:
              - VStack:
                style: {gap: 1}
                children:
                  - Button:
                    text: "deploy"
                  - Checkbox:
                    text: "enabled"
                    checked: true
                  - Switch:
                    text: "dark mode"
                  - Select:
                    items: "small\nmedium\nlarge"
                    selected: 1
          - Block:
            title: "form + feedback"
            children:
              - VStack:
                style: {gap: 1}
                children:
                  - TextInput:
                    label: "host"
                    placeholder: "name"
                  - Progress:
                    value: 60
                    label: "60%"
                  - LineGauge:
                    value: 40
                    label: "40%"
      - HStack:
        style: {gap: 1}
        children:
          - Card:
            title: "a Card"
            children:
              - Log:
                text: "line one\nline two\nline three\nline four"
                offset: 1
          - Paper:
            title: "a Paper"
            children:
              - VStack:
                style: {gap: 1}
                children:
                  - Title:
                    text: "a Title"
                  - Divider:
                  - Text: "Title, Divider and a Spacer below"
                  - Spacer:
                    size: 1
                  - Scrollbar:
                    content_length: 50
                    position: 10
