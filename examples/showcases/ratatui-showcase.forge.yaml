$schema: https://gpui-forge.rudeboy.dev/schema/0.1/ratatui.json
forge: "0.1"
state:
  q: string
  tab: number
  log_off: number
  sb_pos: number

base: ratatui
meta:
  title: ratatui showcase

root:
  VStack:
  style: {gap: 1}
  children:
      - Text:
        text: "ratatui showcase — every ratatui widget"
        style: {height: 1}
      - Tabs:
        titles: "Widgets\nData\nForm"
        selected: $tab
        style: {height: 5}
      - HStack:
        style: {gap: 1, height: 7}
        children:
          - Block:
            title: "cpu"
            children:
              - Gauge:
                value: 72
                label: "72%"
          - Block:
            title: "mem"
            children:
              - Gauge:
                value: 41
                label: "41%"
          - Block:
            title: "net"
            children:
              - Text:
                text: "a Text run inside a bordered Block"
                wrap: true
      - HStack:
        style: {gap: 1, height: 9}
        children:
          - Block:
            title: "a List"
            children:
              - List:
                items: "first\nsecond\nthird\nfourth\nfifth"
                title: "items"
          - Block:
            title: "an Input"
            children:
              - VStack:
                style: {gap: 1}
                children:
                  - Input:
                    placeholder: "type here…"
                    value: $q
                  - Text: "echo: {$q}"
      - Table:
        style: {height: 7}
        title: "a Table"
        header: "name | status | load"
        rows: "web-1 | up | 0.62\nweb-2 | up | 0.41\ndb-1 | degraded | 0.91"
      - HStack:
        style: {gap: 1, height: 9}
        children:
          - Block:
            title: "controls"
            children:
              - VStack:
                style: {gap: 1}
                children:
                  - Button:
                    text: "deploy"
                  - Checkbox:
                    text: "enabled"
                    checked: true
                  - Switch:
                    text: "dark mode"
                  - Select:
                    items: "small\nmedium\nlarge"
                    selected: 1
          - Block:
            title: "form + feedback"
            children:
              - VStack:
                style: {gap: 1}
                children:
                  - TextInput:
                    label: "host"
                    placeholder: "name"
                  - Progress:
                    value: 60
                    label: "60%"
                  - LineGauge:
                    value: 40
                    label: "40%"
      - HStack:
        style: {gap: 1, height: 8}
        children:
          - Card:
            title: "a Card — wheel scrolls"
            children:
              - Log:
                text: "line one\nline two\nline three\nline four\nline five\nline six\nline seven\nline eight\nline nine\nline ten"
                offset: $log_off
          - Paper:
            title: "a Paper"
            children:
              - VStack:
                style: {gap: 1}
                children:
                  - Title:
                    text: "a Title"
                  - Divider:
                  - Text: "Title, Divider and a Spacer below"
                  - Spacer:
                    size: 1
                  - Text: "wheel or track-click: {$sb_pos}"
                  - Scrollbar:
                    content_length: 50
                    position: $sb_pos
      - HStack:
        style: {gap: 1, height: 10}
        children:
          - Block:
            title: "Sparkline"
            children:
              - Sparkline:
                data: [3, 7, 2, 9, 5, 8, 1, 6, 4]
          - Block:
            title: "BarChart"
            children:
              - BarChart:
                data: [4, 8, 3, 7, 5]
                labels: "a\nb\nc\nd\ne"
          - Block:
            title: "Chart"
            children:
              - Chart:
                data: [2, 5, 3, 8, 6, 9, 4]
                name: "load"
      - HStack:
        style: {gap: 1, height: 12}
        children:
          - Calendar:
            date: "2025-06"
          - Block:
            title: "Canvas map"
            children:
              - Canvas:
                map: true
          - Block:
            title: "Logo + Clear"
            children:
              - VStack:
                children:
                  - Logo:
                    size: tiny
                  - Clear:
