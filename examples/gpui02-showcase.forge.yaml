forge: "0.1"
state:
  sel: string

base: gpui02
root:
  VStack:
  style: {padding: 16px, gap: 12px}
  children:
      - Title: "gpui02 showcase"
      - Paper:
        children:
          - Text: "paper container"
      - Button:
        label: "a button"
      - TextInput:
        placeholder: "text input…"
      - Checkbox:
        label: "a checkbox"
      - Switch:
        label: "a switch"
