# gpui-whiteboard — infinite canvas with shapes, arrows, freehand and text.
$schema: https://gpui-forge.rudeboy.dev/schema/0.1/gpui-kit.json
forge: "0.1"
base: gpui-kit
use:
  wb: gpui-whiteboard

root:
  WindowBorder:
  shadow: 0
  children:
    - TitleBar:
      children:
        - Text: "Whiteboard Demo"
        - ThemeSwitcher:
    - VStack:
      style:
        grow: 1
        padding: 24px
        gap: 12px
      children:
        - Text: gpui-whiteboard
          style:
            size: xl
            weight: semibold
        - wb.Board:
          style:
            height: 560px
