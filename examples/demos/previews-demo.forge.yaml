# Declared preview panes — each `forge.Preview` with `remote:` + `#id` gets
# its own out-of-process preview host. `base:` picks the host binary,
# `doc:` the document it renders (doc-relative path, named ref, or the
# parent document when absent). Show/hide is ordinary control flow — the
# Select below drives `match:`/`case:`; pane hosts spawn on declaration and
# die when the pane leaves the document.
$schema: https://gpui-forge.rudeboy.dev/schema/0.1/gpui-kit.json
forge: "0.1"
base: gpui-kit
use:
  forge: forge

state:
  sel: gpui-kit

root:
  VStack:
  style:
    padding: 24px
    gap: 12px
  children:
    - Text: declared preview panes
      style:
        size: xl
        weight: semibold
    - Text: one document, a host per pane — pick the base below
      style:
        size: sm
        color: $theme.muted_foreground
    - Select:
      options:
        - gpui-kit
        - gpui02
        - bezel
      value: bind $sel
    - match: $sel
      case gpui-kit:
        - forge.Preview#pane-kit:
          remote: gpui-kit
          base: gpui-kit
          doc: ./ely-demo.forge.yaml
          style:
            height: 480px
      case gpui02:
        - forge.Preview#pane-02:
          remote: gpui02
          base: gpui02
          doc: ../showcases/gpui02-showcase.forge.yaml
          style:
            height: 480px
      case bezel:
        - forge.Preview#pane-bezel:
          remote: bezel
          base: bezel
          doc: ./base-demo.forge.yaml
          style:
            height: 480px
