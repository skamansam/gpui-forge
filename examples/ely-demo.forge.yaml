forge: "0.1"
base: gpui-kit
use:
  ely: ely-core

root:
  VStack:
  style:
    padding: 24px
    gap: 12px
  children:
    - Text: Ely Components
      style:
        size: xl
        weight: semibold
    - ely.Button: Primary Ely Button
      variant: Primary
      size: Md
    - ely.Button: Danger Outline
      variant: Danger
      size: Sm
    - ely.Badge: Ely Badge
    - ely.Divider:
    - Text: Below the divider
    - ely.IconButton:
      icon: check
      tooltip: Done
