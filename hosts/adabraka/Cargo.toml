# The adabraka base lives OUTSIDE the main workspace — adabraka-ui's
# tree-sitter 0.25 hard-dep conflicts with gpui-kit's 0.26 via `links`, and
# `links` allows one copy per dependency graph. A nested workspace root gives
# this crate its own Cargo.lock: its graph contains no gpui-kit (#95).
[workspace]

[package]
name = "forge-preview-adabraka"
description = "Out-of-process Forge document preview host for the adabraka base."
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
forge-spec = { path = "../../crates/forge-spec" }
gpui-forge-runtime = { path = "../../crates/gpui-forge-runtime", default-features = false }
adabraka-gpui = "0.5"
adabraka-ui = "=0.3.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same fix as the root workspace — xattr 0.2.3 reads libc::ENOATTR which glibc
# lacks; the vendored 0.2.4 maps it to ENODATA on Linux. This workspace has its
# own lockfile, so the patch must live here too.
[patch.crates-io]
xattr = { path = "../../vendor/xattr" }
