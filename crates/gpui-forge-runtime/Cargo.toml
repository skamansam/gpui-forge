[package]
name = "gpui-forge-runtime"
description = "Loads Forge documents and renders them with the selected base component system."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["base-gpui-kit"]
# Exactly one base must be enabled: each base links its own UI toolkit build.
base-gpui-kit = ["dep:gpui-kit"]
base-bezel = []
base-adabraka = []
base-gpui02 = ["dep:gpui", "dep:guise-ui"]
base-ratatui = []
base-iced = []

[dependencies]
forge-spec.workspace = true
gpui-kit = { workspace = true, optional = true }
# gpui02 base (#96): crates.io gpui 0.2.2 + guise — a second, unrelated GPUI
# graph; only one `base-*` may be enabled per build.
gpui = { version = "=0.2.2", optional = true }
guise-ui = { version = "1.10", optional = true }
serde_json = "1"


# `cargo run -p gpui-forge-runtime --example render -- <doc.forge.yaml>`
[[example]]
name = "render"
path = "examples/render.rs"
required-features = ["base-gpui-kit"]

# `cargo run -p gpui-forge-runtime --no-default-features --features base-gpui02
#  --example render_gpui02 -- <doc.forge.yaml>`
[[example]]
name = "render_gpui02"
path = "examples/render_gpui02.rs"
required-features = ["base-gpui02"]

[lints]
workspace = true
