[package]
name = "gpui-forge-runtime"
description = "Loads Forge documents and renders them with the selected base component system."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["base-gpui-kit"]
# Exactly one base must be enabled: each base links its own UI toolkit build.
base-gpui-kit = ["dep:gpui-kit", "dep:gpui-base", "dep:forge-term"]
base-bezel = ["dep:bezel"]
base-adabraka = []
base-gpui02 = ["dep:gpui", "dep:guise-ui"]
base-ratatui = ["dep:ratatui"]
base-iced = ["dep:iced"]

[dependencies]
forge-spec.workspace = true
gpui-kit = { workspace = true, optional = true }
# Editor squiggles (#128): DiagnosticSet lives in gpui-base, which gpui-kit's
# gpui-component builds on — pinned to the same release line.
gpui-base = { version = "=0.8.1", optional = true }
# Terminal emulation for `mode: stream` preview panes (#120) — alacritty's
# vte parser folds host ANSI bytes into a styled cell grid the card paints.
forge-term = { path = "../forge-term", optional = true }
# gpui02 base (#96): crates.io gpui 0.2.2 + guise — a second, unrelated GPUI
# graph; only one `base-*` may be enabled per build.
gpui = { version = "=0.2.2", optional = true }
guise-ui = { version = "1.10", optional = true }
# bezel base (#94): SwiftUI-flavored components on the bezel-gpui fork
# (0.3.21+zed.f16f96) — re-exported as `bezel::gpui`.
bezel = { version = "0.2.24", optional = true, features = ["platform"] }
# ratatui base (#112): terminal UI — the twin draws into `ratatui::Frame`.
ratatui = { version = "0.29", optional = true, default-features = false }
# iced base (#113): Elm-architecture toolkit — view()/update()/Element.
iced = { version = "0.13", optional = true }
serde_json = "1"


# `cargo run -p gpui-forge-runtime --example render -- <doc.forge.yaml>`
[[example]]
name = "render"
path = "examples/render.rs"
required-features = ["base-gpui-kit"]

# `cargo run -p gpui-forge-runtime --no-default-features --features base-gpui02
#  --example render_gpui02 -- <doc.forge.yaml>`
[[example]]
name = "render_gpui02"
path = "examples/render_gpui02.rs"
required-features = ["base-gpui02"]

# The integration test exercises `ForgeView` inside a live App — only
# meaningful under the kit base.
[[test]]
name = "render"
path = "tests/render.rs"
required-features = ["base-gpui-kit"]

[lints]
workspace = true
