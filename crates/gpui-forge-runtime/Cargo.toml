[package]
name = "gpui-forge-runtime"
description = "Loads Forge documents and renders them with the selected base component system."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["base-gpui-kit"]
# Exactly one base must be enabled: each base links its own UI toolkit build.
base-gpui-kit = ["dep:gpui-kit", "dep:gpui-base", "dep:forge-term"]
base-bezel = ["dep:bezel"]
base-adabraka = []
base-guise = ["dep:gpui", "dep:guise-ui"]
base-ratatui = [
    "dep:ratatui",
    "dep:time",
    "dep:ansi-to-tui",
    "dep:ratatui-code-editor",
    "dep:ratatui-markdown",
    "dep:throbber-widgets-tui",
    "dep:tui-scrollview",
    "dep:tui-tree-widget",
    "dep:ratatui-toaster",
    "dep:tui-popup",
    "dep:tui-widget-list",
    "dep:tui-nodes",
    "dep:tui-shimmer",
    "dep:tui_confirm_dialog",
    "dep:tachyonfx",
    "dep:qrcode",
    "dep:image",
    "dep:tui-slider",
    "dep:tui-piechart",
    "dep:tui-big-text",
    "dep:tui-globe",
]
# In-process ratatui rendering beside another base (#156): Studio's canvas
# card drives `render::ratatui::ForgeView` directly — same doc, same module,
# no preview host. Not a base: `render::ForgeView` stays the active base's.
ratatui-embed = [
    "dep:ratatui",
    "dep:time",
    "dep:ansi-to-tui",
    "dep:forge-term",
    "dep:ratatui-code-editor",
    "dep:ratatui-markdown",
    "dep:throbber-widgets-tui",
    "dep:tui-scrollview",
    "dep:tui-tree-widget",
    "dep:ratatui-toaster",
    "dep:tui-popup",
    "dep:tui-widget-list",
    "dep:tui-nodes",
    "dep:tui-shimmer",
    "dep:tui_confirm_dialog",
    "dep:tachyonfx",
    "dep:qrcode",
    "dep:image",
    "dep:tui-slider",
    "dep:tui-piechart",
    "dep:tui-big-text",
    "dep:tui-globe",
]
base-iced = ["dep:iced"]

[dependencies]
forge-spec.workspace = true
gpui-kit = { workspace = true, optional = true }
# Editor squiggles (#128): DiagnosticSet lives in gpui-base, which gpui-kit's
# gpui-kit builds on — pinned to the same release line.
gpui-base = { version = "=0.8.1", optional = true }
# guise base (#96): crates.io gpui 0.2.2 + guise — a second, unrelated GPUI
# graph. Only one `base-*` may be enabled per build.
gpui = { version = "=0.2.2", optional = true }
guise-ui = { version = "1.10", optional = true }
# bezel base (#94): SwiftUI-flavored components on the bezel-gpui fork
# (0.3.21+zed.f16f96) — re-exported as `bezel::gpui`.
bezel = { version = "0.2.24", optional = true, features = ["platform"] }
# ratatui base (#112): terminal UI — the twin draws into `ratatui::Frame`.
# widget-calendar pulls `time` for `Monthly`'s `Date` — pure Rust, wasm-safe.
ratatui = { version = "0.30", optional = true, default-features = false, features = ["std", "widget-calendar"] }
time = { version = "0.3", optional = true }
# Extension widgets (#156) — the awesome-ratatui set, all pinned to the
# ratatui 0.30 line. Each fills a gap in the core set. ANSI screens come
# from ansi-to-tui (ratatui-core Text). The rest: a tree-sitter code
# editor, markdown rendering, spinner frames, virtual scroll and trees.
# The two wasm-unsafe crates sit in the native-only target block below.
ansi-to-tui = { version = "8", optional = true }
throbber-widgets-tui = { version = "0.11", optional = true }
tui-scrollview = { version = "0.6", optional = true }
tui-tree-widget = { version = "0.24", optional = true }
# Extension widgets, round two — more of the awesome-ratatui set. Toasts
# need an engine that stacks and expires messages. Popups need a widget
# that draws a bordered surface over the running doc. Mixed row heights
# need a list the core widget set does not offer. Node graphs, shimmer
# text and confirm dialogs have no core analogue. `qrcode` renders QR
# codes without its optional `image` backend. `image` decodes pictures
# for the halfblock Image widget. `tachyonfx` post-processes cell grids.
ratatui-toaster = { version = "0.1", optional = true }
tui-popup = { version = "0.7", optional = true }
tui-widget-list = { version = "0.15", optional = true }
tui-nodes = { version = "0.10", optional = true }
tui-shimmer = { version = "0.1", optional = true }
tui_confirm_dialog = { version = "0.4", optional = true, default-features = false }
tachyonfx = { version = "0.25", optional = true }
qrcode = { version = "0.15", optional = true, default-features = false }
image = { version = "0.25", optional = true }
# iced base (#113): Elm-architecture toolkit — view()/update()/Element.
iced = { version = "0.13", optional = true }
serde_json = "1"
dirs = "6"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Terminal emulation for `mode: stream` preview panes (#120) — alacritty's
# vte parser folds host ANSI bytes into a styled cell grid the card paints.
# Native-only: alacritty_terminal pulls `polling`, which has no wasm32 impl.
# the web canvas renders ratatui through its own path instead.
forge-term = { path = "../forge-term", optional = true }
# Iconify fetches are blocking — native-only. `ureq`→`rustls`→`ring`→
# `getrandom 0.2` can't compile for `wasm32-unknown-unknown`.
ureq = "3"
# Native-only extension widgets (#156): the editor compiles 16 tree-sitter
# grammars (C sources, no wasm32), and ratatui-markdown enables ratatui's
# default `crossterm` backend, which has no wasm32 build. `default-features`
# drops the editor's own optional crossterm driver — Forge dispatches keys.
ratatui-code-editor = { version = "0.0.6", optional = true, default-features = false }
ratatui-markdown = { version = "0.3", optional = true }
# Native-only widgets, round two — each pulls `crossterm` as a required
# dep, which has no wasm32 build.
tui-slider = { version = "0.4", optional = true }
tui-piechart = { version = "1", optional = true }
tui-big-text = { version = "0.8", optional = true }
tui-globe = { version = "1", optional = true }


# `cargo run -p gpui-forge-runtime --example render -- <doc.forge.yaml>`
[[example]]
name = "render"
path = "examples/render.rs"
required-features = ["base-gpui-kit"]

# `cargo run -p gpui-forge-runtime --no-default-features --features base-guise
#  --example render_guise -- <doc.forge.yaml>`
[[example]]
name = "render_guise"
path = "examples/render_guise.rs"
required-features = ["base-guise"]

# `cargo run -p gpui-forge-runtime --example term_demo [-- <doc.forge.yaml>]`
# Resizable window hosting `TermView` on a live ratatui stream — the stream
# card's pipeline without Studio, for render/resize debugging (#156).
[[example]]
name = "term_demo"
path = "examples/term_demo.rs"
required-features = ["base-gpui-kit"]

# The integration test exercises `ForgeView` inside a live App — only
# meaningful under the kit base.
[[test]]
name = "render"
path = "tests/render.rs"
required-features = ["base-gpui-kit"]

[lints]
workspace = true

[dev-dependencies]
usvg = "=0.46.0"
