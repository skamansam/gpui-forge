[package]
name = "forge-web-canvas"
description = "Renders Forge documents with gpui-kit in the browser (WASM) for the docs site and forge-web."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
test = false
crate-type = ["cdylib", "rlib"]

[features]
default = ["base-gpui-kit"]
base-gpui-kit = ["dep:gpui-kit", "gpui-forge-runtime/base-gpui-kit"]
base-iced = ["dep:iced", "gpui-forge-runtime/base-iced"]

[dependencies]
gpui-kit = { workspace = true, optional = true }
gpui-forge-runtime = { workspace = true, default-features = false }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
forge-spec.workspace = true
iced = { version = "0.13", optional = true }
serde_json = "1"

[lints]
workspace = true
