[package]
name = "forge-web-canvas"
description = "Renders Forge documents with gpui-kit in the browser (WASM) for the docs site and forge-web."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
test = false
crate-type = ["cdylib", "rlib"]

[features]
default = ["base-gpui-kit"]
base-gpui-kit = ["dep:gpui-kit", "gpui-forge-runtime/base-gpui-kit"]
base-iced = ["dep:iced", "gpui-forge-runtime/base-iced"]
base-ratatui = ["dep:ratatui", "gpui-forge-runtime/base-ratatui"]
base-bezel = ["dep:bezel", "dep:gpui-web", "gpui-forge-runtime/base-bezel"]

[dependencies]
gpui-kit = { workspace = true, optional = true }
gpui-forge-runtime = { workspace = true, default-features = false }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
forge-spec.workspace = true
iced = { version = "0.13", optional = true }
# ratatui base (#137): pure-Rust terminal twin — stable-clean on wasm32.
# default-features=false drops the crossterm backend, which can't build on wasm32.
ratatui = { version = "0.29", optional = true, default-features = false }
bezel = { version = "0.2.24", optional = true, features = ["platform"] }
gpui-web = { package = "bezel-gpui-web", version = "0.3.21", optional = true }
serde_json = "1"

# iced's wasm build pulls `instant` via parking_lot/wasm-timer without its
# wasm-bindgen feature, leaving `now()` an undefined extern at link time.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
instant = { version = "0.1", features = ["wasm-bindgen"] }

[lints]
workspace = true
