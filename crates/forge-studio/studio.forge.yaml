# The Forge Studio shell, described in Forge YAML and rendered by gpui-forge-runtime.
$schema: https://gpui-forge.rudeboy.dev/schema/0.1/gpui-kit.json
forge: "0.1"
state:
  studio.theme: string
  studio.dark: bool
  studio.light_themes: list
  studio.dark_themes: list
  studio.all_themes: list
  studio.widget_set: string
  studio.diagnostics: string
  studio.file: string
  studio.host: string
  studio.project: string
  studio.spec: string
  studio.tab: number
  studio.theme_json: multiline
  studio.markers: list
  editor.source: multiline
  document.selected: string
  base: string
  bases: list
  name: string
  preview.mode: enum(remote | embedded)
  preview.frame: string
  preview.state: string
  status.message: string
  vars_add.path: string
  vars_add.value: string

base: gpui-kit
use:
  forge: forge
meta:
  title: Forge Studio


# the app menu
appMenu: &appMenu
  icon: hamburger
  size: Small
  variant: Ghost
  children:
    - MenuItem: New
      icon: file-plus
      on click: new_document()
    - MenuItem: New Project…
      icon: package-open
      on click: open_dialog("new-project")
    - MenuItem: Open…
      icon: folder-open
      on click: open_document()
    - MenuItem: Open Project…
      icon: package-open
      on click: open_project()
    - MenuItem: Preview in Host…
      icon: app-window
      on click: preview_in_host()
    - MenuItem: Format
      icon: sparkles
      on click: format_document()
    - MenuSeparator:
    - MenuItem: Undo
      icon: undo-2
      on click: undo()
    - MenuItem: Redo
      icon: redo-2
      on click: redo()
    - MenuSeparator:
    - MenuItem: Save
      icon: save
      on click: save_document()
    - MenuSeparator:
    - MenuItem: Preferences...
      icon: settings
      on click: open_dialog("preferences")
    - MenuSeparator:
    - MenuItem: Test error
      icon: alert-circle
      on click: test_error()

# the title bar
titleBar: &titleBar
  children:
    - HStack:
      children:
        - DropdownMenu#file-menu:
          <<: *appMenu
        - Image#logo:
          src: ../../gpui_forge_icon_small.svg
          size: 18px
        - Label: Forge Studio
          style:
            weight: semibold
        - Tag: self-hosted
          outline: true

Dialog#preferences:
  style:
    width: 400px
    height: 300px
    padding: 16px
    gap: 16px
    radius: 8px
    background: $theme.background
    border: 1px
    border-style: solid
    border-color: $theme.border
  children:
    - Text: "Preferences"
      style:
        size: lg
        weight: semibold
    - Settings:
      children:
        - SettingPage: Theme
          children:
            - SettingsGroup: Theme
              children:
                - SettingItem: Select theme
                  children:
                    - Select#prefs_theme:
                      options: $studio.all_themes
                      value: bind $studio.theme
                      placeholder: pick a theme
                      on change: apply_theme_name($studio.theme)

# File → New Project… — scaffolds forge.toml + app.forge.yaml like `forge new`
Dialog#new-project:
  style:
    width: 420px
    padding: 16px
    gap: 12px
    radius: 8px
    background: $theme.background
    border: 1px
    border-style: solid
    border-color: $theme.border
  children:
    - Text: New Forge project
      style: {size: lg, weight: semibold}
    - Input:
      value: bind $name
      placeholder: project name
    - Select:
      options: $bases
      value: bind $base
      placeholder: base component system
    - HStack:
      style: {justify: end, gap: 8px}
      children:
        - Button: Create
          variant: Primary
          on click: create_project()



root:
  VStack#studio:
  style:
    width: full
    height: full
  children:
    - TitleBar:
      <<: *titleBar
    - HStack#body:
      style:
        grow: true
        min-height: 0
      children:
        # palette: a tool grid — click an icon to insert the element
        - VStack#palette:
          style:
            width: 230px
            height: full
            padding: 8px
            gap: 8px
            overflow: scroll
          children:
            - forge.Palette:
        - Separator:
          tooltip: Separator
          orientation: Vertical
        # workspace: source on the left, live preview on the right
        - HStack#workspace:
          style:
            grow: true
            min-width: 0
            gap: 8px
            padding: 8px
          children:
            - Tabs#panes:
              variant: Pill
              style:
                grow: true
                min-height: 0
                basis: 100%
                border: 1px
              selected: bind $studio.tab
              children:
                - Tab: Welcome
                  children:
                    - VStack:
                      style:
                        grow: true
                        padding: 48px
                        gap: 24px
                        align: center
                        overflow: scroll
                      children:
                        - VStack:
                          style: {align: center, gap: 12px}
                          children:
                            - Image#welcome-logo:
                              src: ../../gpui_forge_icon_medallion.svg
                              size: 150px
                            - Label: Forge Studio
                              style: {size: xl, weight: bold}
                            - Text: a visual builder for Forge documents
                              style: {color: $theme.muted_foreground}
                        - Text: "Forge Studio edits .forge.yaml documents live — outline a document in Structure, tune it in the Inspector, and watch the preview rebuild. To get started, choose a starter below."
                          style: {size: sm, color: $theme.muted_foreground, width: 520px}
                        - HStack:
                          style: {gap: 16px, justify: center, align: stretch}
                          children:
                            - GroupBox: Welcome
                              variant: Outline
                              style: {width: 170px}
                              children:
                                - Image#img-welcome:
                                  src: ../../gpui_forge_icon_medallion.svg
                                  size: 56px
                                - Text: A guided tour of Forge documents and the studio shell.
                                  style: {size: sm, color: $theme.muted_foreground}
                                - HStack:
                                  style: {justify: end, grow: true}
                                  children:
                                    - Button: Open
                                      size: Small
                                      variant: Primary
                                      on click: start_from('welcome')
                            - GroupBox: Gallery
                              variant: Outline
                              style: {width: 170px}
                              children:
                                - Image#img-gallery:
                                  src: ../../gpui_forge_icon_medallion.svg
                                  size: 56px
                                - Select#widget_set:
                                  options: [gpui-kit, forge]
                                  value: bind $studio.widget_set
                                  placeholder: widget set
                                  on change: widget_set_changed($studio.widget_set)
                                - Text: Every element the adapter renders, per widget set.
                                  style: {size: sm, color: $theme.muted_foreground}
                                - HStack:
                                  style: {justify: end, grow: true}
                                  children:
                                    - Button: Open
                                      size: Small
                                      variant: Primary
                                      on click: start_from('gallery')
                            - GroupBox: Blank
                              variant: Outline
                              style: {width: 170px}
                              children:
                                - Image#img-blank:
                                  src: ../../gpui_forge_icon_medallion.svg
                                  size: 56px
                                - Text: An empty document — a clean canvas for something new.
                                  style: {size: sm, color: $theme.muted_foreground}
                                - HStack:
                                  style: {justify: end, grow: true}
                                  children:
                                    - Button: Open
                                      size: Small
                                      variant: Primary
                                      on click: start_from('blank')
                - Tab: Source
                  children:
                    - VStack:
                      style: {grow: true, gap: 8px}
                      children:
                        - Editor#source:
                          language: yaml
                          highlighting:
                            languages: [yaml]
                            default: yaml
                            show-selection: true
                          value: bind $editor.source
                          diagnostics: $studio.markers
                          on change: source_changed()
                          style:
                            grow: true
                            border: 1px
                        - GroupBox: Problems
                          variant: Outline
                          children:
                            - Text: "{$studio.diagnostics}"
                              style:
                                size: sm
                - Tab: Preview
                  children:
                    - VStack:
                      style: {grow: true}
                      children:
                        - forge.Preview#canvas:
                          remote: "{$studio.host}"
                          mode: "{$preview.mode}"
                          on click: raise_host()
                          style:
                            grow: true
                            border: 1px
                        # #120 Phase 2 — the TUI's streamed frame grid
                        # (`preview.frame` from a ratatui host's TestBackend).
                        - Text: "{$preview.frame}"
                          style:
                            size: xs
                            color: $theme.muted_foreground
                - Tab: Vars
                  children:
                    - VStack:
                      style: {grow: true, padding: 12px, gap: 8px, overflow: scroll}
                      children:
                        - Text: State variables
                          style: {size: lg, weight: semibold}
                        - Text: Every bound `{$path}` var in the document — edit scalars, watch the app react.
                          style: {size: sm, color: $theme.muted_foreground}
                        - forge.Vars:
                          of: canvas
                - Tab: Themes
                  children:
                    - HStack:
                      style: {grow: true, gap: 16px, padding: 12px}
                      children:
                        - VStack:
                          style: {grow: true, gap: 12px}
                          children:
                            - HStack:
                              style: {justify: end}
                              children:
                                - Button:
                                  icon: rotate-ccw
                                  variant: Ghost
                                  size: Small
                                  tooltip: Reset to the default theme
                                  on click: reset_theme()
                            - Label: Theme
                              style: {weight: semibold}
                            - Select#editor_theme:
                              options: $studio.all_themes
                              value: bind $studio.theme
                              placeholder: pick a theme
                              on change: apply_theme_name($studio.theme)
                            - Editor#theme_json:
                              language: json
                              value: bind $studio.theme_json
                            - HStack:
                              style: {justify: end}
                              children:
                                - Button: Apply
                                  variant: Primary
                                  on click: apply_theme_json()
                        - VStack:
                          style: {width: 360px, overflow: scroll, gap: 12px}
                          children:
                            - Text: Showcase
                              style: {weight: semibold}
                            - forge.Showcase:
        - VStack#inspector:
          style:
            width: 280px
            padding: 8px
            gap: 8px
            overflow: scroll
          children:
            - GroupBox: Structure
              variant: Outline
              style:
                min-height: 120px
              children:
                - forge.Outline#structure:
                  of: canvas
                  selected: bind $document.selected
                  on select: select_node()
                  placeholder: no document
                  style:
                    grow: true
                    min-height: 200px
            - GroupBox: Inspector
              variant: Outline
              children:
                - HStack:
                  style: {justify: end}
                  children:
                    - Button:
                      icon: crosshair
                      variant: Ghost
                      size: Small
                      tooltip: Pick element in preview
                      on click: pick()
                    - Button:
                      icon: trash-2
                      variant: Ghost
                      size: Small
                      tooltip: Delete selected element
                      on click: remove_component()
                - forge.Inspector#props:
                  of: canvas
                  selected: bind $document.selected
                  placeholder: nothing selected
            - GroupBox: Diagnostics
              variant: Outline
              children:
                - Text: "{$studio.diagnostics}"
                  style:
                    size: sm
            - GroupBox: View state
              variant: Outline
              children:
                - Text: "{$preview.state}"
                  style:
                    size: xs
                    color: $theme.muted_foreground
    - Separator:
    # ── status bar ───────────────────────────────────────────────────────
    - HStack#statusbar:
      style:
        align: center
        gap: 8px
        padding: [4px, 12px]
      children:
        - Text: "{$status.message}"
          style:
            size: sm
        - Box:
          style:
            grow: true
        - Label: "{$studio.project}"
          secondary: true
        - Label: "{$studio.host}"
          secondary: true
        - Label: "{$studio.file}"
        - Tag: "forge {$studio.spec}"
          outline: true
        - Tag: gpui-kit 0.8
          outline: true
