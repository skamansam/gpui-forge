# The Forge Studio shell, described in Forge YAML and rendered by gpui-forge-runtime.
$schema: https://gpui-forge.rudeboy.dev/schema/0.1/gpui-kit.json
forge: "0.1"
base: gpui-kit
use:
  forge: forge
meta:
  title: Forge Studio

state:
  studio.theme: string
  studio.dark: bool
  studio.light_themes: list
  studio.dark_themes: list
  studio.all_themes: list
  studio.widget_set: string
  studio.widget_sets: list
  studio.diagnostics: string
  studio.file: string
  studio.host: string
  studio.project: string
  studio.spec: string
  studio.tab: number
  studio.theme_json: multiline
  studio.theme_preview: string
  studio.markers: list
  editor.source: multiline
  document.selected: string
  base: string
  bases: list
  name: string
  preview.mode: enum(remote | embedded)
  # ANSI stream chunk — {seq, cols, rows, data}; the card's emulator consumes it
  preview.frame: object
  preview.frame_rgba: string
  preview.state: string
  status.message: string
  vars_add.path: string
  vars_add.value: string

# ============================================================================
# THE APP MENU
# ============================================================================
appMenu: &appMenu
  icon: hamburger
  size: Small
  variant: Ghost
  children:
    - MenuItem: New
      icon: file-plus
      on click: new_document()
    - MenuItem: New Project…
      icon: package-open
      on click: open_dialog("new-project")
    - MenuItem: Open…
      icon: folder-open
      on click: open_document()
    - MenuItem: Open Project…
      icon: package-open
      on click: open_project()
    - MenuItem: Preview in Host…
      icon: app-window
      on click: preview_in_host()
    - MenuItem: Format
      icon: sparkles
      on click: format_document()
    - MenuSeparator:
    - MenuItem: Undo
      icon: undo-2
      on click: undo()
    - MenuItem: Redo
      icon: redo-2
      on click: redo()
    - MenuSeparator:
    - MenuItem: Save
      icon: save
      on click: save_document()
    - MenuSeparator:
    - MenuItem: Preferences...
      icon: settings
      on click: open_dialog("preferences")
    - MenuSeparator:
    - MenuItem: Test error
      icon: alert-circle
      on click: test_error()

# ============================================================================
# THE TITLE BAR
# ============================================================================
titleBar: &titleBar
  children:
    - HStack:
      children:
        - DropdownMenu#file-menu:
          <<: *appMenu
        - Image#logo:
          src: ../../gpui_forge_icon_small.svg
          size: 18px
        - Label: Forge Studio
          style:
            weight: semibold
        - Tag: self-hosted
          outline: true


# ============================================================================
# THE STATUS BAR
# ============================================================================
statusBar: &statusBar
  style:
    align: center
    gap: 8px
    padding: [4px, 12px]
  children:
    - Text: "{$status.message}"
      style:
        size: sm
    - Box:
      style:
        grow: true
    - Label: "{$studio.project}"
      secondary: true
    - Label: "{$studio.host}"
      secondary: true
    - Label: "{$studio.file}"
    - Tag: "forge {$studio.spec}"
      outline: true
    - Tag: gpui-kit 0.8
      outline: true

# ============================================================================
# THE MAIN LAYOUT
# ============================================================================
mainLayout: &mainLayout
  style:
    width: full
    height: full
    padding: 16px
    gap: 16px
    background: $theme.background

# ============================================================================
# THE WELCOME TAB
# ============================================================================
welcomeTab: &welcomeTab
  children:
    - VStack:
      style:
        grow: true
        padding: 48px
        gap: 24px
        align: center
        overflow: scroll
      children:
        - VStack:
          style: {align: center, gap: 12px}
          children:
            - Image#welcome-logo:
              src: ../../gpui_forge_icon_medallion.svg
              size: 150px
            - Label: Forge Studio
              style: {size: xl, weight: bold}
            - Text: a visual builder for Forge documents
              style: {color: $theme.muted_foreground}
        - Text: "Forge Studio edits .forge.yaml documents live — outline a document in Structure, tune it in the Inspector, and watch the preview rebuild. To get started, choose a starter below."
          style: {size: sm, color: $theme.muted_foreground, width: 520px}
        - HStack:
          style: {gap: 16px, justify: center, align: stretch}
          children:
            - GroupBox: Welcome
              variant: Outline
              style: {width: 170px}
              children:
                - Image#img-welcome:
                  src: ../../gpui_forge_icon_medallion.svg
                  size: 56px
                - Text: A guided tour of Forge documents and the studio shell.
                  style: {size: sm, color: $theme.muted_foreground}
                - HStack:
                  style: {justify: end, grow: true}
                  children:
                    - Button: Open
                      size: Small
                      variant: Primary
                      on click: start_from('welcome')
            - GroupBox: Gallery
              variant: Outline
              style: {width: 170px}
              children:
                - Image#img-gallery:
                  src: ../../gpui_forge_icon_medallion.svg
                  size: 56px
                - Select#widget_set:
                  options: $studio.widget_sets
                  value: bind $studio.widget_set
                  placeholder: widget set
                  on change: widget_set_changed($studio.widget_set)
                - Text: A showcase for every supported widget set.
                  style: {size: sm, color: $theme.muted_foreground}
                - HStack:
                  style: {justify: end, grow: true}
                  children:
                    - Button: Open
                      size: Small
                      variant: Primary
                      on click: start_from('gallery')
            - GroupBox: Blank
              variant: Outline
              style: {width: 170px}
              children:
                - Image#img-blank:
                  src: ../../gpui_forge_icon_medallion.svg
                  size: 56px
                - Text: An empty document — a clean canvas for something new.
                  style: {size: sm, color: $theme.muted_foreground}
                - HStack:
                  style: {justify: end, grow: true}
                  children:
                    - Button: Open
                      size: Small
                      variant: Primary
                      on click: start_from('blank')


# ============================================================================
# THE SOURCE TAB
# ============================================================================
sourceTab: &sourceTab
  children:
    - VStack:
      style: {grow: true, min-height: 0, gap: 8px}
      children:
        - Editor#source:
          language: yaml
          highlighting:
            languages: [yaml]
            default: yaml
            show-selection: true
          value: bind $editor.source
          diagnostics: $studio.markers
          on change: source_changed()
          style:
            grow: true
            min-height: 0
            border: 1px
        - GroupBox: Problems
          variant: Outline
          children:
            - Text: "{$studio.diagnostics}"
              style:
                size: sm


# ============================================================================
# THEME PREVIEW SELECTOR
# ============================================================================
previewSelector: &previewSelector
  children:
    - HStack:
      style: {gap: 8px, align: center}
      children:
        - Select:
          options: $studio.preview_bases
          value: bind $studio.theme_preview
          placeholder: preview
          on change: persist_preview_base()
          style: {grow: true}
        - Button:
          icon: arrow-right
          variant: Ghost
          size: Small
          tooltip: preview this theme on the next base
          on click: cycle_preview_base()
    # Same-base sets render in place — a plain `forge.Preview` nests a
    # second ForgeView in the canvas, no host. Foreign bases spawn their
    # own `forge-preview-{base}` host: `mode: embedded` floats the host's
    # window over the card, `mode: stream` paints the host's frame grid
    # inside the card (ratatui sizes it from `frame_rect`), and no `mode`
    # is the `placeholder` card — a foreign window can't embed.
    # The `if` keeps hosts from spawning before the Theme tab is shown
    # (tab index 4 — the pane's window floats over a live slot only).
    - if: $studio.tab
      is: 4
      children:
        - match: $studio.theme_preview
          case gpui-kit:
            - forge.Preview#preview-gpui-kit:
              doc: ../../examples/showcases/gpui-kit-showcase.forge.yaml
              style: {height: 480px}
          case ely:
            - forge.Preview#preview-ely:
              doc: ../../examples/demos/ely-demo.forge.yaml
              style: {height: 480px}
          case hig:
            - forge.Preview#preview-hig:
              doc: ../../examples/demos/hig-demo.forge.yaml
              style: {height: 480px}
          case gc:
            - forge.Preview#preview-gc:
              doc: ../../examples/showcases/gc-showcase.forge.yaml
              style: {height: 480px}
          case gflow:
            - forge.Preview#preview-gflow:
              doc: ../../examples/demos/gflow-demo.forge.yaml
              style: {height: 480px}
          case math:
            - forge.Preview#preview-math:
              doc: ../../examples/demos/math-demo.forge.yaml
              style: {height: 480px}
          case pdf:
            - forge.Preview#preview-pdf:
              doc: ../../examples/demos/pdf-demo.forge.yaml
              style: {height: 480px}
          case gpui-base:
            - forge.Preview#preview-gpui-base:
              doc: ../../examples/demos/base-demo.forge.yaml
              style: {height: 480px}
          case gpui02:
            # Foreign bases open their own window — a different gpui
            # generation can't composite into this canvas.
            - forge.Preview#preview-gpui02:
              remote: gpui02
              base: gpui02
              doc: ../../examples/showcases/gpui02-showcase.forge.yaml
              placeholder: "rendered in a separate window — the gpui02 host can't embed"
              style: {height: 480px}
            - Text: "theme: approximate — guise semantic overrides only"
              style: {size: xs, color: $theme.warning}
          case bezel:
            - forge.Preview#preview-bezel:
              remote: bezel
              base: bezel
              doc: ../../examples/showcases/bezel-showcase.forge.yaml
              placeholder: "rendered in a separate window — the bezel host can't embed"
              style: {height: 480px}
            - HStack:
              style: {gap: 8px, align: center}
              children:
                - Text: "theme: dark/light only"
                  style: {size: xs, color: $theme.warning}
                - Select:
                  options: [follow studio, dark, light]
                  value: bind $preview.panes.preview_bezel.mode
                  placeholder: follow studio
          case adabraka:
            - forge.Preview#preview-adabraka:
              remote: adabraka
              base: adabraka
              doc: ../../examples/showcases/adabraka-showcase.forge.yaml
              placeholder: "rendered in a separate window — the adabraka host can't embed"
              style: {height: 480px}
            - HStack:
              style: {gap: 8px, align: center}
              children:
                - Text: "theme: dark/light only"
                  style: {size: xs, color: $theme.warning}
                - Select:
                  options: [follow studio, dark, light]
                  value: bind $preview.panes.preview_adabraka.mode
                  placeholder: follow studio
          case iced:
            - forge.Preview#preview-iced:
              remote: iced
              base: iced
              doc: ../../examples/showcases/iced-showcase.forge.yaml
              placeholder: "rendered in a separate window — the iced host can't embed"
              style: {height: 480px}
            - Text: "theme: approximate — iced Theme::custom palette only"
              style: {size: xs, color: $theme.warning}
          case ratatui:
            - forge.Preview#preview-ratatui:
              remote: ratatui
              base: ratatui
              doc: ../../examples/demos/ratatui-dashboard.forge.yaml
              mode: stream
              style: {height: 480px}
            - Text: "theme: unmapped — the card shows the raw terminal stream"
              style: {size: xs, color: $theme.muted_foreground}
          else:
            - Text: "No preview active"
              style:
                size: sm
                color: $theme.muted_foreground


# ============================================================================
# THE THEMES TAB
# ============================================================================
themesTab: &themesTab
  children:
    - Resizable:
      layout: Horizontal
      style: {grow: true, min-height: 0, padding: 12px}
      children:
        - ResizablePanel:
          min-size: 240
          children:
            - VStack:
              style: {grow: true, height: full, min-width: 0, gap: 12px, justify: start}
              children:
                - HStack:
                  style: {justify: between}
                  children:
                    - Label: Theme
                      style: {weight: semibold}
                    - Button:
                      icon: rotate-ccw
                      variant: Ghost
                      size: Small
                      tooltip: Reset to the default theme
                      on click: reset_theme()
                - Select#editor_theme:
                  options: $studio.all_themes
                  value: bind $studio.theme
                  placeholder: pick a theme
                  on change: apply_theme_name($studio.theme)
                - Editor#theme_json:
                  language: json
                  value: bind $studio.theme_json
                  style:
                    grow: true
                    min-height: 0
                    border: 1px
                - HStack:
                  style: {justify: start}
                  children:
                    - Button: Apply
                      variant: Primary
                      on click: apply_theme_json()
        - ResizablePanel:
          size: 360
          min-size: 240
          children:
            - VStack:
              style: {width: full, height: full, min-height: 0, overflow: scroll, gap: 12px, padding: [0, 0, 0, 16px]}
              children:
                - Text: Showcase
                  style: {weight: semibold}
                - VStack:
                  <<: *previewSelector
                # - forge.Showcase:



# ============================================================================
# THE VARS TAB
# ============================================================================
varsTab: &varsTab
  children:
    - VStack:
      style: {grow: true, padding: 12px, gap: 8px, overflow: scroll}
      children:
        - Text: State variables
          style: {size: lg, weight: semibold}
        - Text: Every bound `{$path}` var in the document — edit scalars, watch the app react.
          style: {size: sm, color: $theme.muted_foreground}
        - forge.Vars:
          of: canvas




# ============================================================================
# THE PREVIEW TAB
# ============================================================================
previewTab: &previewTab
  children:
    - VStack:
      style: {grow: true, min-height: 0}
      children:
        # `compat` (#145) — the canvas always renders the document through
        # gpui-kit widgets, mapping foreign-base elements to their catalog
        # `canvas:` analogue, so structure editing/DnD works on every base.
        # The remote host still runs for pixel fidelity — its window floats
        # separately (`remote` mode) or embeds over this slot (`embedded`).
        - forge.Preview#canvas:
          remote: "{$studio.host}"
          mode: "{$preview.mode}"
          compat: true
          on click: raise_host()
          style:
            grow: true
            border: 1px
        # #120 Phase 3 — the TUI's ANSI stream lands in `preview.frame`
        # ({seq, cols, rows, data}); the card's terminal emulator paints it.
        - Text: "frame {$preview.frame.seq}"
          style:
            size: xs
            color: $theme.muted_foreground


# ============================================================================
# THE INSPECTOR PANEL
# ============================================================================
inspector: &inspector
  style:
    width: 280px
    padding: 8px
    gap: 8px
    overflow: scroll
  children:
    - GroupBox: Structure
      variant: Outline
      style:
        min-height: 120px
      children:
        - forge.Outline#structure:
          of: canvas
          selected: bind $document.selected
          on select: select_node()
          placeholder: no document
          style:
            grow: true
            min-height: 200px
    - GroupBox: Inspector
      variant: Outline
      children:
        - HStack:
          style: {justify: end}
          children:
            - Button:
              icon: crosshair
              variant: Ghost
              size: Small
              tooltip: Pick element in preview
              on click: pick()
            - Button:
              icon: trash-2
              variant: Ghost
              size: Small
              tooltip: Delete selected element
              on click: remove_component()
        - forge.Inspector#props:
          of: canvas
          selected: bind $document.selected
          placeholder: nothing selected
    - GroupBox: Diagnostics
      variant: Outline
      children:
        - Text: "{$studio.diagnostics}"
          style:
            size: sm
    - GroupBox: View state
      variant: Outline
      children:
        - Text: "{$preview.state}"
          style:
            size: xs
            color: $theme.muted_foreground

# ============================================================================
# THE MAIN BODY
# ============================================================================
body: &body
  style:
    grow: true
    min-height: 0
  children:
    - VStack#palette:
      style:
        width: 230px
        height: full
        padding: 8px
        gap: 8px
        overflow: scroll
      children:
        - forge.Palette:
    - Separator:
      tooltip: Separator
      orientation: Vertical
    - HStack#workspace:
      style:
        grow: true
        min-width: 0
        gap: 8px
        padding: 8px
      children:
        - Tabs#panes:
          variant: Pill
          style:
            grow: true
            min-height: 0
            basis: 100%
            border: 1px
          selected: bind $studio.tab
          children:
            - Tab: Start
              <<: *welcomeTab
            - Tab: Document
              <<: *sourceTab
            - Tab: Canvas
              <<: *previewTab
            - Tab: State
              <<: *varsTab
            - Tab: Theme
              <<: *themesTab

    - VStack#inspector:
      <<: *inspector


# ============================================================================
# THE PREFERENCES DIALOG
# ============================================================================
# NOTE: dialogs only need IDs so they can be opened with `open_dialog("ID")`
Dialog#preferences:
  style:
    width: 400px
    height: 300px
    padding: 16px
    gap: 16px
    radius: 8px
    background: $theme.background
    border: 1px
    border-style: solid
    border-color: $theme.border
  children:
    - Text: "Preferences"
      style:
        size: lg
        weight: semibold
    - Settings:
      children:
        - SettingPage: Theme
          children:
            - SettingsGroup: Theme
              children:
                - SettingItem: Select theme
                  children:
                    - Select#prefs_theme:
                      options: $studio.all_themes
                      value: bind $studio.theme
                      placeholder: pick a theme
                      on change: apply_theme_name($studio.theme)

# ============================================================================
# THE NEW PROJECT DIALOG
# ============================================================================
# File → New Project… — opens a fresh document in the editor; a folder is
# only asked for on save (#133).
Dialog#new-project:
  style:
    width: 420px
    padding: 16px
    gap: 12px
    radius: 8px
    background: $theme.background
    border: 1px
    border-style: solid
    border-color: $theme.border
  children:
    - Text: New Forge project
      style: {size: lg, weight: semibold}
    - Input:
      value: bind $name
      placeholder: project name
    - Select:
      options: $bases
      value: bind $base
      placeholder: base component system
    - HStack:
      style: {justify: end, gap: 8px}
      children:
        - Button: Create
          variant: Primary
          on click: create_project()



# ============================================================================
# The ROOT Element - where it all begins
# ============================================================================
root:
  VStack#studio:
  style:
    width: full
    height: full
  children:
    - TitleBar:
      <<: *titleBar
    - HStack#body:
      <<: *body
    - Separator:
    - HStack#statusbar: 
      <<: *statusBar





# ============================================================================
# CONDITIONAL EXAMPLES
# ============================================================================
# `match:` switches on one binding with `case <value>:` arms and an `else:`
# fallback. For two-way or chained tests, `if:` renders `children:` when the
# condition holds (or equals `is:`/differs from `not:`) — `else → if` chains
# give the elsif shape.
preview: &preview
  style:
    width: full
    height: full
  children:
    - match: $studio.preview
      case gpui:
        - Text: "GPUI Preview"
          style:
            size: lg
            weight: semibold
      case web:
        - Text: "Web Preview"
          style:
            size: lg
            weight: semibold
      else:
        - Text: "No preview active"
          style:
            size: sm
            color: $theme.muted_foreground

ifChain: &ifChain
  children:
    - if: $studio.preview
      is: gpui
      children:
        - Text: "GPUI Preview"
      else:
        - if: $studio.preview
          is: web
          children:
            - Text: "Web Preview"
          else:
            - Text: "No preview active"


# ============================================================================
# FOR LOOP EXAMPLE
# ============================================================================
# `for:` repeats `children:` per item; `each:` names the scoped var (bound as
# `$item`), `index:` optionally names the index, `else:` renders when the
# list is empty.
forLoop: &forLoop
  style:
    width: full
    height: full
  children:
    - for: $studio.renderer_names
      each: item
      children:
        - Text: "{$item}"
          style:
            size: sm
            color: $theme.muted_foreground
      else:
        - Text: "No renderers"


# ============================================================================
# TEMPLATE EXAMPLES
# ============================================================================
# `for:` over object lists exposes fields via `$tab.name`; a single (non-list)
# value iterates once. `with:`/`as:` scopes one value explicitly, and
# `if:`/`for:`/`with:` double as modifiers on any element.
template: &template
  style:
    width: full
    height: full
  children:
    - for: $studio.tabs
      each: tab
      index: i
      children:
        - Text: "{$i}: {$tab.name}"
          style:
            size: sm
            color: $tab.color
    - with: $studio.selected_tab
      as: tab
      children:
        - Text: "Selected: {$tab.name}"
    # modifiers — the element repeats per tab / renders only when signed in
    - Tab: "{$tab.name}"
      for: $studio.tabs
      each: tab
    - Text: "Signed in"
      if: $user.signed_in
