# The Forge Studio shell, described in Forge YAML and rendered by gpui-forge-runtime.
$schema: https://gpui-forge.rudeboy.dev/schema/1.0/gpui-kit.json
forge: "1.0"
base: gpui-kit
use:
  forge: forge
meta:
  title: Forge Studio
  # Hot-reload: Studio watches this file and swaps the parsed doc on
  # change (parse failures keep the last-good doc + show diagnostics).
  watch: "true"  # hot-reloads this shell

state:
  studio.theme: string
  studio.dark: bool
  studio.light_themes: list
  studio.dark_themes: list
  studio.all_themes: list
  studio.widget_set: string
  studio.widget_sets: list
  studio.diagnostics: string
  studio.toml_source: string
  studio.problem_variant: string
  studio.file: string
  studio.host: string
  studio.project: string
  studio.apps: list
  studio.multiapp: boolean
  studio.project_items: list
  studio.project_mode: number
  studio.files_view: number
  studio.files_mode: string
  studio.project_grep: string
  studio.proj_name: string
  studio.proj_version: string
  studio.proj_id: string
  studio.proj_title: string
  studio.proj_icon: string
  studio.proj_binary: string
  studio.proj_base: string
  studio.proj_document: string
  studio.proj_watch: boolean
  studio.proj_documents: multiline
  studio.proj_docs: multiline
  studio.proj_apps: multiline
  studio.proj_assets_dir: string
  studio.proj_themes_dir: string
  studio.proj_iconset: string
  studio.spec: string
  studio.tab: number
  studio.assets_dir: string
  studio.asset_files: list
  studio.assets_zoom: number
  studio.doc_dir: string
  studio.doc_file: string
  studio.doc_source: string
  studio.doc_label: string
  studio.doc_text: multiline
  studio.theme_json: multiline
  studio.theme_preview: string
  studio.markers: list
  editor.source: multiline
  studio.recent_files: list
  document.selected: string
  base: string
  bases: list
  name: string
  preview.mode: enum(remote | embedded)
  # ANSI stream chunk — {seq, cols, rows, data}. The card's emulator consumes it
  preview.frame: object
  preview.frame_rgba: string
  preview.state: string
  status.message: string
  vars_add.path: string
  vars_add.value: string
  studio.vars_count: number
  inspector.items: list
  inspector.styles: list
  inspector.header: string
  studio.iconset: string
  studio.iconsets: list
  studio.icon: string
  studio.icons_query: string
  studio.icon_category: string
  studio.icon_theme: list
  studio.icon_themes: list
  studio.icon_categories: list
  studio.icon_meta: object
  studio.icon_status: object
  studio.icon_attribution: bool

# ============================================================================
# THE APP MENU
# ============================================================================
appMenu: &appMenu
  label: File
  icon: file
  size: Small
  variant: Ghost
  children:
    - MenuItem: New
      icon: file-plus
      on click: new_document()
    - MenuItem: New Project…
      icon: package-plus
      on click: open_dialog("new-project")
    - MenuItem: Open…
      icon: folder-open
      on click: open_document()
    - MenuItem: Open Project…
      icon: package-open
      on click: open_project()
    - MenuItem: Preview in Host…
      icon: app-window
      on click: preview_in_host()
    - MenuItem: Format
      icon: sparkles
      on click: format_document()
    - MenuSeparator:
    - MenuItem: Save
      icon: save
      on click: save_document()
    - MenuSeparator:
    - MenuItem: Preferences...
      icon: settings
      on click: open_dialog("preferences")
    - MenuSeparator:
    - MenuItem: Test error
      icon: bug
      on click: test_error()

editMenu: &editMenu
  icon: pencil
  label: Edit
  size: Small
  variant: Ghost
  children:
    - MenuItem: Undo
      icon: undo-2
      on click: undo()
    - MenuItem: Redo
      icon: redo-2
      on click: redo()
    - MenuSeparator:
    - MenuItem: Save
      icon: save
      on click: save_document()
    - MenuSeparator:
    - MenuItem: Preferences...
      icon: settings
      on click: open_dialog("preferences")
    - MenuSeparator:
    - MenuItem: Test error
      icon: bug
      on click: test_error()

projectMenu: &projectMenu
  icon: package
  label: Project
  size: Small
  variant: Ghost
  children:
    - MenuItem: Preview in Host…
      icon: app-window
      on click: preview_in_host()
    - MenuItem: Format
      icon: sparkles
      on click: format_document()
    - MenuSeparator:
    - MenuItem: Undo
      icon: undo-2
      on click: undo()
    - MenuItem: Redo
      icon: redo-2
      on click: redo()
    - MenuSeparator:
    - MenuItem: Save
      icon: save
      on click: save_document()
    - MenuSeparator:
    - MenuItem: Preferences...
      icon: settings
      on click: open_dialog("preferences")
    - MenuSeparator:
    - MenuItem: Test error
      icon: bug
      on click: test_error()

# ============================================================================
# THE TITLE BAR
# ============================================================================
titleBar: &titleBar
  children:
    - HStack:
      style: 
        gap: 12px
      children:
        - Image#logo:
          src: ../../gpui_forge_icon_small.svg
          size: 18px
          style:
            align: center
        - Label: Forge Studio
          style:
            weight: semibold
            gap: 12px
        - Tag: self-hosted
          outline: true
        - DropdownMenu#file-menu:
          <<: *appMenu
        - DropdownMenu#edit-menu:
          <<: *editMenu
        - DropdownMenu#project-menu:
          <<: *projectMenu


# ============================================================================
# THE STATUS BAR
# ============================================================================
statusBar: &statusBar
  style:
    align: center
    gap: 8px
    padding: [4px, 12px]
  children:
    - Text: "{$status.message}"
      style:
        size: sm
    - Box:
      style:
        grow: true
    - Label: "{$studio.project}"
      style: {color: $theme.muted_foreground}
    - Label: "{$studio.host}"
      style: {color: $theme.muted_foreground}
    - Label: "{$studio.file}"
    - Tag: "forge {$studio.spec}"
      outline: true
    - Tag: gpui-kit 0.8
      outline: true

# ============================================================================
# THE MAIN LAYOUT
# ============================================================================
mainLayout: &mainLayout
  style:
    width: full
    height: full
    padding: 16px
    gap: 16px
    background: $theme.background

# ============================================================================
# THE WELCOME TAB
# ============================================================================
welcomeTab: &welcomeTab
  children:
    - VStack:
      style:
        grow: true
        padding: 48px
        gap: 24px
        align: center
        overflow: scroll
      children:
        - VStack:
          style: {align: center, gap: 12px}
          children:
            - Image#welcome-logo:
              src: ../../gpui_forge_icon_medallion.svg
              size: 150px
            - Label: Forge Studio
              style: {size: xl, weight: bold}
            - Text: a visual builder for Forge documents
              style: {color: $theme.muted_foreground}
        - Text: "Forge Studio edits .forge.yaml documents live — outline a document in Structure, tune it in the Inspector, and watch the preview rebuild. To get started, choose a starter below."
          style: {size: sm, color: $theme.muted_foreground, width: 520px}
        - HStack:
          style: {gap: 16px, justify: center, align: stretch}
          children:
            - GroupBox: Welcome
              variant: Outline
              style: {width: 170px}
              children:
                - Image#img-welcome:
                  src: ../../gpui_forge_icon_medallion.svg
                  size: 56px
                - Text: A guided tour of Forge documents and the studio shell.
                  style: {size: sm, color: $theme.muted_foreground}
                - HStack:
                  style: {justify: end, grow: true}
                  children:
                    - Button: Open
                      size: Small
                      variant: Primary
                      on click: start_from('welcome')
            - GroupBox: Gallery
              variant: Outline
              style: {width: 170px}
              children:
                - Image#img-gallery:
                  src: ../../gpui_forge_icon_medallion.svg
                  size: 56px
                - Select#widget_set:
                  options: $studio.widget_sets
                  value: bind $studio.widget_set
                  placeholder: widget set
                  on change: widget_set_changed($studio.widget_set)
                - Text: A showcase for every supported widget set.
                  style: {size: sm, color: $theme.muted_foreground}
                - HStack:
                  style: {justify: end, grow: true}
                  children:
                    - Button: Open
                      size: Small
                      variant: Primary
                      on click: start_from('gallery')
            - GroupBox: Blank
              variant: Outline
              style: {width: 170px}
              children:
                - Image#img-blank:
                  src: ../../gpui_forge_icon_medallion.svg
                  size: 56px
                - Text: An empty document — a clean canvas for something new.
                  style: {size: sm, color: $theme.muted_foreground}
                - HStack:
                  style: {justify: end, grow: true}
                  children:
                    - Button: Open
                      size: Small
                      variant: Primary
                      on click: start_from('blank')


# ============================================================================
# THE ASSETS TAB
# ============================================================================
# Browses the project's media: `[assets] dir` from the manifest when set, else
# `<root>/assets`, else the project root. `studio.assets_zoom` picks the view —
# 0 List (file tree, folders navigate in place), 1 Thumbs (flat rows with
# previews), 2 Grid (media cards). `studio.asset_files` is the flattened
# listing `refresh_assets` seeds on every project/document load.
assetsTab: &assetsTab
  children:
    - VStack:
      style: {grow: true, min-height: 0, min-width: 0, padding: 12px, gap: 10px}
      children:
        - HStack:
          style: {gap: 8px, align: center}
          children:
            - Text: Assets
              style: {size: sm, weight: semibold}
            - Text: "{$studio.assets_dir}"
              style: {size: xs, color: $theme.muted_foreground}
            - Tabs#assetsZoom:
              variant: Segmented
              selected: bind $studio.assets_zoom
              style: {grow: true}
              children:
                - Tab: List
                - Tab: Thumbs
                - Tab: Grid
        - if: $studio.assets_zoom
          is: 0
          children:
            - forge.Files#assetList:
              root: "{$studio.assets_dir}"
              filter: ["*.png", "*.jpg", "*.jpeg", "*.gif", "*.webp", "*.svg", "*.ico", "*.bmp", "*.avif", "*.mp4", "*.webm", "*.mov", "*.mkv", "*.ttf", "*.otf", "*.woff", "*.woff2"]
              nonce: $studio.files_nonce
              search: true
              folders: navigate
              placeholder: no assets found
              style: {grow: true, min-height: 0}
          else:
            - if: $studio.assets_zoom
              is: 1
              children:
                - Scrollable:
                  style: {grow: true, min-height: 0, gap: 2px}
                  children:
                    - for: $studio.asset_files
                      each: f
                      children:
                        - HStack:
                          style: {gap: 8px, align: center, padding: 4px}
                          children:
                            - Image:
                              src: "{$f.path}"
                              size: 28px
                              object-fit: Cover
                              if: $f.img
                            - Icon: file
                              if: $f.img
                              not: true
                            - Text: "{$f.rel}"
                              style: {grow: true, size: sm}
                            - Text: "{$f.size}B"
                              style: {size: xs, color: $theme.muted_foreground}
                      else:
                        - Text: "no assets — open a project or save this document near an assets/ folder"
                          style: {size: sm, color: $theme.muted_foreground}
              else:
                - Scrollable:
                  style: {grow: true, min-height: 0}
                  children:
                    - Grid:
                      columns: 5
                      style: {gap: 8px}
                      children:
                        - for: $studio.asset_files
                          each: f
                          children:
                            - VStack:
                              style: {gap: 4px, align: center, padding: 8px, border: 1px, radius: 6px}
                              children:
                                - Image:
                                  src: "{$f.path}"
                                  size: 72px
                                  object-fit: Cover
                                  if: $f.img
                                - Icon: file
                                  if: $f.img
                                  not: true
                                - Text: "{$f.name}"
                                  style: {size: xs}
                          else:
                            - Text: "no assets — open a project or save this document near an assets/ folder"
                              style: {size: sm, color: $theme.muted_foreground}


# ============================================================================
# THE ICONS TAB
# ============================================================================
# `forge.Icons` browses the app icon catalog — `lucide` (bundled) plus any
# `icons/<set>/` the asset source layers in. `set`/`selected`/`query` bind
# out so the doc can restyle the grid. Click a cell to write `studio.icon`.

# The chrome is doc-owned: `forge.Icons` runs `bare` (grid only) and
# publishes `categories`/`themes`/`meta`/`status`/`attribution` for the
# pickers, license panel and download state below. Filters write the same
# bound state the widget reads. `on select` still copies the icon.
iconsTab: &iconsTab
  children:
    - VStack:
      style: {grow: true, min-height: 0, gap: 8px, padding: 8px}
      children:
        - HStack:
          style: {gap: 8px, align: center, wrap: true}
          children:
            - Text: Iconset
              style: {size: xs, color: $theme.muted_foreground}
            - Select#icons_set:
              options: $studio.iconsets
              value: bind $studio.iconset
              style: {width: 160px}
            - Text: Category
              if: $studio.icon_categories
              style: {size: xs, color: $theme.muted_foreground}
            - Select#icons_cat: 
              if: $studio.icon_categories
              options: $studio.icon_categories
              value: bind $studio.icon_category
              style: {width: 160px}
            - Text: Size
              style: {size: xs, color: $theme.muted_foreground}
            - Select#icons_size:
              options: [XSmall, Small, Medium, Large]
              value: bind $studio.icon_size
              style: {width: 120px}
            - Text: Suffix
              if: $studio.icon_themes
              style: {size: xs, color: $theme.muted_foreground}
            - Checkbox: "{$th.title}"
              for: $studio.icon_themes
              each: th
              checked: $th.checked
              on change: toggle_icon_theme($th.key)
        - HStack:
          style: {gap: 8px, align: center}
          children:
            - Text: Search
              style: {size: xs, color: $theme.muted_foreground}
            - Input#icons_search:
              value: bind $studio.icons_query
              placeholder: filter icons…
              style: {grow: true}
        - Text: "{$studio.icon_meta.line1}"
          if: $studio.icon_meta.line1
          style: {size: xs, color: $theme.muted_foreground}
        - Text: "{$studio.icon_meta.line2}"
          if: $studio.icon_meta.line2
          style: {size: xs, color: $theme.muted_foreground}
        - VStack:
          if: $studio.icon_status.downloading
          style: {gap: 4px}
          children:
            - Text: "{$studio.icon_status.label}"
              style: {size: sm, color: $theme.muted_foreground}
            - Progress:
              value: $studio.icon_status.percent
        - VStack:
          if: $studio.icon_status.error
          style: {gap: 4px}
          children:
            - Alert:
              message: "{$studio.icon_status.error}"
              title: Icon set download failed
              variant: Error
              banner: true
            - Button: Retry
              variant: Secondary
              on click: retry_iconset($studio.iconset)
        - Alert:
          if: $studio.icon_attribution
          message: "This icon set is licensed under terms that require shipping its license text and copyright notices with the built app."
          title: Attribution required
          variant: Error
          banner: true
        - forge.Icons#icons:
          style: {grow: true, min-height: 0}
          bare: true
          sets: bind $studio.iconsets
          set: bind $studio.iconset
          selected: bind $studio.icon
          query: bind $studio.icons_query
          category: bind $studio.icon_category
          theme: bind $studio.icon_theme
          size: bind $studio.icon_size
          categories: bind $studio.icon_categories
          themes: bind $studio.icon_themes
          meta: bind $studio.icon_meta
          status: bind $studio.icon_status
          attribution: bind $studio.icon_attribution
          on select: icon_copy
          # Scoped children — the cell template. The runtime keeps the
          # measured grid frame (pinned width, rings, hover, click→`selected`).
          # these children render inside each box with `$item` =
          # {name, set, selected, downloaded}.
          children:
            - Icon: $item.name
              set: $item.set
              size: $studio.icon_size
            - Text: "{$item.name}"
              if: $item.downloaded
              style: {size: xs, color: $theme.success}
              else:
                - Text: "{$item.name}"
                  style: {size: xs, color: $theme.muted_foreground}


# ============================================================================
# THE SOURCE TAB
# ============================================================================
sourceTab: &sourceTab
  children:
    - VStack:
      style: {grow: true, min-height: 0, gap: 8px}
      children:
        - Editor#source:
          language: yaml
          highlighting:
            languages: [yaml]
            default: yaml
            show-selection: true
          value: bind $editor.source
          diagnostics: $studio.markers
          on change: source_changed()
          style:
            grow: true
            min-height: 0
            border: 1px
        - Alert:
          message: "{$studio.diagnostics}"
          variant: $studio.problem_variant
          banner: true


# ============================================================================
# THEME PREVIEW SELECTOR
# ============================================================================
previewSelector: &previewSelector
  children:
    - HStack:
      style: {gap: 8px, align: center}
      children:
        - Select:
          options: $studio.preview_bases
          value: bind $studio.theme_preview
          placeholder: preview
          on change: persist_preview_base()
          style: {grow: true}
        - Button:
          icon: arrow-right
          variant: Ghost
          size: Small
          tooltip: preview this theme on the next base
          on click: cycle_preview_base()
    # Same-base sets render in place — a plain `forge.Preview` nests a
    # second ForgeView in the canvas, no host. Foreign bases spawn their
    # own `forge-preview-{base}` host: `mode: embedded` floats the host's
    # window over the card, `mode: stream` paints the host's frame grid
    # inside the card (ratatui sizes it from `frame_rect`). No `mode`
    # is the `placeholder` card. A foreign window can't embed.
    # The `if` keeps hosts from spawning before the Theme tab is shown
    # (tab index 4. The pane's window floats over a live slot only).
    - if: $studio.tab
      is: 4
      children:
        - match: $studio.theme_preview
          case gpui-kit:
            - forge.Preview#preview-gpui-kit:
              doc: ../../examples/showcases/gpui-kit-showcase.forge.yaml
              style: {height: 480px}
          case ely:
            - forge.Preview#preview-ely:
              doc: ../../examples/demos/ely-demo.forge.yaml
              style: {height: 480px}
          case hig:
            - forge.Preview#preview-hig:
              doc: ../../examples/demos/hig-demo.forge.yaml
              style: {height: 480px}
          case gflow:
            - forge.Preview#preview-gflow:
              doc: ../../examples/demos/gflow-demo.forge.yaml
              style: {height: 480px}
          case math:
            - forge.Preview#preview-math:
              doc: ../../examples/demos/math-demo.forge.yaml
              style: {height: 480px}
          case pdf:
            - forge.Preview#preview-pdf:
              doc: ../../examples/demos/pdf-demo.forge.yaml
              style: {height: 480px}
          case gpui-base:
            - forge.Preview#preview-gpui-base:
              doc: ../../examples/showcases/base-gpui-showcase.forge.yaml
              style: {height: 480px}
            - Text: "theme: unmapped — base.* paints fixed default chrome"
              style: {size: xs, color: $theme.muted_foreground}
          case guise:
            # Foreign bases open their own window — a different gpui
            # generation can't composite into this canvas.
            - forge.Preview#preview-guise:
              remote: guise
              base: guise
              doc: ../../examples/showcases/guise-showcase.forge.yaml
              placeholder: "rendered in a separate window — the guise host can't embed"
              style: {height: 480px}
            - Text: "theme: approximate — guise semantic overrides only"
              style: {size: xs, color: $theme.warning}
          case bezel:
            - forge.Preview#preview-bezel:
              remote: bezel
              base: bezel
              doc: ../../examples/showcases/bezel-showcase.forge.yaml
              placeholder: "rendered in a separate window — the bezel host can't embed"
              style: {height: 480px}
            - HStack:
              style: {gap: 8px, align: center}
              children:
                - Text: "theme: dark/light only"
                  style: {size: xs, color: $theme.warning}
                - Select:
                  options: [follow studio, dark, light]
                  value: bind $preview.panes.preview_bezel.mode
                  placeholder: follow studio
          case adabraka:
            - forge.Preview#preview-adabraka:
              remote: adabraka
              base: adabraka
              doc: ../../examples/showcases/adabraka-showcase.forge.yaml
              placeholder: "rendered in a separate window — the adabraka host can't embed"
              style: {height: 480px}
            - HStack:
              style: {gap: 8px, align: center}
              children:
                - Text: "theme: dark/light only"
                  style: {size: xs, color: $theme.warning}
                - Select:
                  options: [follow studio, dark, light]
                  value: bind $preview.panes.preview_adabraka.mode
                  placeholder: follow studio
          case iced:
            - forge.Preview#preview-iced:
              remote: iced
              base: iced
              doc: ../../examples/showcases/iced-showcase.forge.yaml
              placeholder: "rendered in a separate window — the iced host can't embed"
              style: {height: 480px}
            - Text: "theme: approximate — iced Theme::custom palette only"
              style: {size: xs, color: $theme.warning}
          case ratatui:
            - forge.Preview#preview-ratatui:
              remote: ratatui
              base: ratatui
              doc: ../../examples/demos/ratatui-dashboard.forge.yaml
              mode: stream
              style: {height: 480px}
            - Text: "theme: unmapped — the card shows the raw terminal stream"
              style: {size: xs, color: $theme.muted_foreground}
          else:
            - Text: "No preview active"
              style:
                size: sm
                color: $theme.muted_foreground


# ============================================================================
# THE THEMES TAB
# ============================================================================
themesTab: &themesTab
  children:
    - Resizable:
      layout: Horizontal
      style: {grow: true, min-height: 0, padding: 12px}
      children:
        - ResizablePanel:
          min-size: 240
          children:
            - VStack:
              style: {grow: true, height: full, min-width: 0, gap: 12px, justify: start}
              children:
                - HStack:
                  style: {justify: between}
                  children:
                    - Label: Theme
                      style: {weight: semibold}
                    - Button:
                      icon: rotate-ccw
                      variant: Ghost
                      size: Small
                      tooltip: Reset to the default theme
                      on click: reset_theme()
                - Select#editor_theme:
                  options: $studio.all_themes
                  value: bind $studio.theme
                  placeholder: pick a theme
                  on change: apply_theme_name($studio.theme)
                - Editor#theme_json:
                  language: json
                  value: bind $studio.theme_json
                  style:
                    grow: true
                    min-height: 0
                    border: 1px
                - HStack:
                  style: {justify: start}
                  children:
                    - Button: Apply
                      variant: Primary
                      on click: apply_theme_json()
        - ResizablePanel:
          size: 360
          min-size: 240
          children:
            - VStack:
              style: {width: full, height: full, min-height: 0, overflow: scroll, gap: 12px, padding: [0, 0, 0, 16px]}
              children:
                - Text: Showcase
                  style: {weight: semibold}
                - VStack:
                  <<: *previewSelector
                # - forge.Showcase:



# ============================================================================
# THE VARS TAB
# ============================================================================
varsTab: &varsTab
  children:
    - VStack:
      style: {grow: true, padding: 12px, gap: 8px, overflow: scroll}
      children:
        - Text: State variables
          style: {size: lg, weight: semibold}
        - Text: These are the declared variables in the UI. Scalars (strings, booleans, single-value values) are reactive and will update the UI when changed. Arrays and objects are not reactive and need to be set when updated.
          style: {size: sm, color: $theme.muted_foreground}
        - Text: "There are {$studio.vars_count} variables in this forge file."
          style: {size: sm, color: $theme.muted_foreground}
        - forge.Vars:
          of: canvas
          count: bind $studio.vars_count




# ============================================================================
# THE INSPECTOR PANEL
# ============================================================================
inspector: &inspector
  style:
    width: 280px
    shrink: false
    height: full
    min-height: 0
    overflow: scroll
    padding: 8px
    gap: 8px
  children:
    - GroupBox: Structure
      variant: Outline
      style:
        min-height: 120px
      children:
        - forge.Outline#structure:
          of: canvas
          selected: bind $document.selected
          on select: select_node()
          placeholder: no document
          style:
            grow: true
            min-height: 200px
    # The action buttons sit beside the "Inspector" name, not inside the box —
    # the GroupBox look is replicated: muted title row over an outlined surface.
    - VStack:
      style: {gap: 12px, grow: true, min-height: 0}
      children:
        - HStack:
          style: {align: center}
          children:
            - Text: Inspector
              style: {grow: true, color: $theme.muted_foreground, line-height: 125%}
            - Button:
              icon: crosshair
              variant: Ghost
              size: Small
              tooltip: Pick element in preview
              on click: pick()
            - Button:
              icon: trash-2
              variant: Ghost
              size: Small
              tooltip: Delete selected element
              on click: remove_component()
        - VStack:
          style: {grow: true, min-height: 0, border: 1px, border-color: $theme.border, radius: 6px, padding: 12px, gap: 8px}
          children:
            # Data mode — Inspector publishes items/styles/header. The field
            # layout is ours (FormField label + forge.InspectorField control).
            - forge.Inspector#props:
              of: canvas
              selected: bind $document.selected
              items: bind $inspector.items
              styles: bind $inspector.styles
              header: bind $inspector.header
              placeholder: nothing selected
            - Text: "{$inspector.header}"
              style: {size: sm, weight: medium}
            - Tabs:
              style: {grow: true, min-height: 0}
              children:
                - Tab: Properties
                  children:
                    - VStack:
                      style: {grow: true, min-height: 0, overflow: scroll, gap: 10px, padding: [8px, 0]}
                      children:
                        - FormField: "{$item.label}"
                          for: $inspector.items
                          each: item
                          else:
                            - Text: "no catalog props"
                              style: {size: xs, color: $theme.muted_foreground}
                          children:
                            - forge.InspectorField:
                              item: $item
                - Tab: Style
                  children:
                    - VStack:
                      style: {grow: true, min-height: 0, overflow: scroll, gap: 10px, padding: [8px, 0]}
                      children:
                        - FormField: "{$item.label}"
                          for: $inspector.styles
                          each: item
                          else:
                            - Text: "no style entries"
                              style: {size: xs, color: $theme.muted_foreground}
                          children:
                            - forge.InspectorField:
                              item: $item
    - Alert:
      message: "{$studio.diagnostics}"
      variant: $studio.problem_variant
      banner: true
    - GroupBox: View state
      variant: Outline
      children:
        - Text: "{$preview.state}"
          style:
            size: xs
            color: $theme.muted_foreground


# ============================================================================
# THE PREVIEW TAB
# ============================================================================
previewTab: &previewTab
  children:
    - HStack:
      style: {grow: true, min-height: 0, gap: 8px}
      children:
        # #148 — the palette lives beside the canvas it's used on, docked in a
        # column here rather than as the app-wide sidebar.
        - VStack#palette:
          style:
            width: 200px
            shrink: false
            height: full
            padding: 8px
            gap: 8px
            overflow: scroll
          children:
            - forge.Palette:
        - VStack:
          style: {grow: true, min-width: 0, min-height: 0}
          children:
            # `compat` (#145) — the canvas always renders the document through
            # gpui-kit widgets, mapping foreign-base elements to their catalog
            # `canvas:` analogue, so structure editing/DnD works on every base.
            # The remote host still runs for pixel fidelity — its window floats
            # separately (`remote` mode) or embeds over this slot (`embedded`).
            # Exception: ratatui docs draw in-process on this same card (#156)
            # — the runtime's own renderer, no host, direct hit-testing.
            - forge.Preview#canvas:
              remote: "{$studio.host}"
              mode: "{$preview.mode}"
              compat: true
              on click: raise_host()
              style:
                grow: true
                border: 1px
            # #120 Phase 3 — the TUI's ANSI stream lands in `preview.frame`
            # ({seq, cols, rows, data}). The card's terminal emulator paints it.
            - Text: "frame {$preview.frame.seq}"
              style:
                size: xs
                color: $theme.muted_foreground
        # Structure/Inspector only make sense against the canvas, so they live
        # inside this tab — docked at its right edge like the palette's left.
        - VStack#inspector:
          <<: *inspector


# ============================================================================
# DOCS TAB — markdown editor + live preview for a forge doc's associated
# pages. The project tree's doc icon runs `doc_open`, which fills
# `doc_file`/`doc_source`/`doc_text`. Save writes back and creates +
# associates the page when the buffer is new.
# ============================================================================
docsTab: &docsTab
  children:
    - VStack:
      style: {grow: true, min-height: 0, gap: 8px}
      children:
        - HStack:
          style: {gap: 8px, align: center}
          children:
            - Icon: book-open
            - Text: "{$studio.doc_label}"
              style: {size: sm, color: $theme.muted_foreground, grow: true}
            - Button:
              label: Save
              icon: save
              variant: Primary
              size: Small
              on click: doc_save()
        - Resizable:
          layout: Horizontal
          style: {grow: true, min-height: 0}
          children:
            - ResizablePanel:
              min-size: 200
              children:
                - Editor#doc_editor:
                  language: markdown
                  highlighting:
                    languages: [markdown]
                    default: markdown
                    show-selection: true
                  value: bind $studio.doc_text
                  placeholder: write markdown…
                  style: {grow: true, min-height: 0, border: 1px}
            - ResizablePanel:
              min-size: 200
              children:
                - TextView#doc_preview:
                  text: "{$studio.doc_text}"
                  format: markdown
                  style: {grow: true, min-height: 0, border: 1px}


# ============================================================================
# THE MAIN BODY
# ============================================================================
body: &body
  style:
    grow: true
    min-height: 0
  children:
    - Resizable:
      layout: Horizontal
      style: {grow: true, min-height: 0}
      children:
        # #148 — project sidebar: the folder of the open document, scanned by
        # main.rs into `studio.files`. Clicking a file opens it.
        - ResizablePanel:
          size: 250
          min-size: 160
          children:
            - VStack#project:
              style:
                grow: true
                height: full
                min-height: 0
                padding: 8px
                gap: 8px
              children:
                - Tabs#files_view:
                  variant: Segmented
                  selected: bind $studio.files_view
                  # project shows declared membership, files browses the
                  # whole folder.
                  on change: files_scope()
                  if: $studio.project
                  children:
                    - Tab: project
                    - Tab: files
                - Input#project_grep:
                  value: bind $studio.project_grep
                  placeholder: search file contents…
                  on change: grep_project($studio.project_grep)
                - forge.Files#files:
                  # `of:` — the host emits the listing. A project root gets
                  # the application hierarchy, anything else a plain scan,
                  # and a content query swaps in `file:line` match rows.
                  of: studio.project_items
                  nonce: $studio.files_nonce
                  search: $studio.files_search
                  icons: $studio.files_icons
                  highlights: $studio.files_highlights
                  selected: bind $studio.file_selected
                  # Single click selects/highlights. Double-click (`open`) loads.
                  on open: open_path($studio.file_selected)
                  # The row's trailing book icon — opens the forge file's
                  # associated markdown page in the Docs tab.
                  on doc: doc_open($studio.file_selected)
                  placeholder: no files here
                  style: {grow: true, min-height: 0, min-width: 0}
        - ResizablePanel:
          children:
            - HStack#workspace:
              style:
                grow: true
                min-width: 0
                gap: 8px
                padding: 8px
              children:
                - Tabs#panes:
                  variant: Tab
                  style:
                    grow: true
                    min-height: 0
                    basis: 100%
                    border: 1px
                  selected: bind $studio.tab
                  children:
                    - Tab: Start
                      <<: *welcomeTab
                    - Tab: Document
                      <<: *sourceTab
                    - Tab: Canvas
                      <<: *previewTab
                    - Tab: State
                      <<: *varsTab
                    - Tab: Theme
                      <<: *themesTab
                    - Tab: Assets
                      <<: *assetsTab
                    - Tab: Icons
                      <<: *iconsTab
                    - Tab: Docs
                      <<: *docsTab
                    # Only when a forge.toml project is open — edits the
                    # manifest itself. The Editor sub-tab is a form over
                    # the manifest keys. Source edits the TOML directly.
                    # Apply writes the active mode and re-loads the project
                    # (document/icons/assets/themes re-derive).
                    - Tab: Project
                      if: $studio.project
                      children:
                        - VStack:
                          style: {grow: true, min-height: 0, padding: 12px, gap: 8px}
                          children:
                            - Text: "{$studio.project}/forge.toml"
                              style: {size: sm, color: $theme.muted_foreground}
                            - Tabs#project_mode:
                              variant: Segmented
                              selected: bind $studio.project_mode
                              style: {grow: true, min-height: 0}
                              children:
                                - Tab: Editor
                                  children:
                                    - Settings:
                                      style: {grow: true, min-height: 0}
                                      children:
                                        - SettingPage: Application
                                          children:
                                            - SettingsGroup: Package
                                              children:
                                                - SettingItem: Name
                                                  children:
                                                    - Input:
                                                      value: bind $studio.proj_name
                                                      placeholder: package name
                                                - SettingItem: Version
                                                  children:
                                                    - Input:
                                                      value: bind $studio.proj_version
                                                      placeholder: 0.1.0
                                                - SettingItem: Identifier
                                                  children:
                                                    - Input:
                                                      value: bind $studio.proj_id
                                                      placeholder: dev.example.app
                                                - SettingItem: Title
                                                  children:
                                                    - Input:
                                                      value: bind $studio.proj_title
                                                      placeholder: window title
                                                - SettingItem: Icon
                                                  children:
                                                    - Input:
                                                      value: bind $studio.proj_icon
                                                      placeholder: icon file in assets
                                                - SettingItem: Binary
                                                  children:
                                                    - Input:
                                                      value: bind $studio.proj_binary
                                                      placeholder: existing workspace binary
                                            - SettingsGroup: Build
                                              children:
                                                - SettingItem: Base
                                                  children:
                                                    - Select:
                                                      options: $bases
                                                      value: bind $studio.proj_base
                                                      placeholder: gpui-kit
                                                - SettingItem: Entry document
                                                  children:
                                                    - Input:
                                                      value: bind $studio.proj_document
                                                      placeholder: main.forge.yaml
                                                - SettingItem: Watch for changes
                                                  children:
                                                    - Switch:
                                                      checked: bind $studio.proj_watch
                                                - SettingItem: Member documents
                                                  children:
                                                    - VStack:
                                                      style: {gap: 4px}
                                                      children:
                                                        - Text: one document path per line
                                                          style: {size: xs, color: $theme.muted_foreground}
                                                        - Editor#proj_documents:
                                                          value: bind $studio.proj_documents
                                                          style: {height: 96px, border: 1px}
                                                - SettingItem: Documentation pages
                                                  children:
                                                    - VStack:
                                                      style: {gap: 4px}
                                                      children:
                                                        - Text: one markdown page per line
                                                          style: {size: xs, color: $theme.muted_foreground}
                                                        - Editor#proj_docs:
                                                          value: bind $studio.proj_docs
                                                          style: {height: 96px, border: 1px}
                                            - SettingsGroup: Applications
                                              children:
                                                - SettingItem: Additional apps
                                                  children:
                                                    - VStack:
                                                      style: {gap: 4px}
                                                      children:
                                                        - Text: "one app per line: name = document.forge.yaml"
                                                          style: {size: xs, color: $theme.muted_foreground}
                                                        - Editor#proj_apps:
                                                          value: bind $studio.proj_apps
                                                          style: {height: 96px, border: 1px}
                                        - SettingPage: Assets
                                          children:
                                            - SettingsGroup: Directories
                                              children:
                                                - SettingItem: Assets dir
                                                  children:
                                                    - Input:
                                                      value: bind $studio.proj_assets_dir
                                                      placeholder: assets
                                                - SettingItem: Themes dir
                                                  children:
                                                    - Input:
                                                      value: bind $studio.proj_themes_dir
                                                      placeholder: themes
                                                - SettingItem: Icon set
                                                  children:
                                                    - Input:
                                                      value: bind $studio.proj_iconset
                                                      placeholder: lucide
                                - Tab: Source
                                  children:
                                    - Editor#project_toml:
                                      language: toml
                                      value: bind $studio.toml_source
                                      style: {grow: true, min-height: 0, border: 1px}
                            - HStack:
                              style: {justify: end}
                              children:
                                - Button: Apply
                                  variant: Primary
                                  on click: save_project()


# ============================================================================
# THE PREFERENCES DIALOG
# ============================================================================
# NOTE: dialogs only need IDs so they can be opened with `open_dialog("ID")`
Dialog#preferences:
  title: Forge Studio Preferences
  resizable: true
  style:
    width: 1000px
    height: 800px
    padding: 16px
    gap: 16px
    radius: 8px
    background: $theme.background
    border: 1px
    border-style: solid
    border-color: $theme.border
  children:
    - VStack:
      style:
        grow: true
        min-height: 0
      children:
      - Settings:
        style:
          grow: true
          min-height: 0
        children:
          - SettingPage: Theme
            children:
              - SettingsGroup: Theme
                children:
                  - SettingItem: Select theme
                    children:
                      - Select#prefs_theme:
                        options: $studio.all_themes
                        value: bind $studio.theme
                        placeholder: pick a theme
                        on change: apply_theme_name($studio.theme)
          - SettingPage: Files
            children:
              - SettingsGroup: Project tree
                children:
                  - SettingItem: Search bar
                    children:
                      - Switch:
                        checked: bind $studio.files_search
                        on change: persist_prefs()
                  - SettingItem: File icons
                    children:
                      - Switch:
                        checked: bind $studio.files_icons
                        on change: persist_prefs()
                  - SettingItem: Hidden files
                    children:
                      - Switch:
                        checked: bind $studio.files_hidden
                        on change: files_pref_changed()
                  - SettingItem: Highlights
                    children:
                      - VStack:
                        style: {gap: 8px, width: full}
                        children:
                          - for: $studio.hl_list
                            each: h
                            key: h.id
                            children:
                              - VStack:
                                style: {gap: 4px}
                                children:
                                  - HStack:
                                    style: {gap: 8px, align: center}
                                    children:
                                      - ColorPicker:
                                        value: bind $h.color
                                        colors: $studio.hl_palette
                                        on change: hl_changed()
                                      - Input:
                                        value: bind $h.glob
                                        invalid: $h.error
                                        placeholder: "*.forge.yaml"
                                        style: {grow: true}
                                        on change: hl_validate($h.id)
                                        on submit: hl_commit($h.id)
                                      - Checkbox:
                                        label: bold
                                        checked: bind $h.bold
                                        on change: hl_changed()
                                      - Button:
                                        variant: Ghost
                                        icon: x
                                        compact: true
                                        on click: hl_remove($h.id)
                                  - Text: "{$h.error}"
                                    if: $h.error
                                    style: {size: xs, color: $theme.danger}
                          - HStack:
                            style: {justify: between, width: full}
                            children:
                              - Button: "+ add highlight"
                                variant: Ghost
                                on click: hl_add()
                              - Button: reset to defaults
                                variant: Ghost
                                on click: hl_reset()
          - SettingPage: Window
            children:
              - SettingsGroup: Decorations
                children:
                  - SettingItem: OS window decorations
                    children:
                      - Switch:
                        checked: bind $studio.native_decorations
                        on change: persist_prefs()
                  - Text: On, the window manager draws the frame and title bar. Off, Forge draws them. Applies at once on Linux. macOS applies it on restart.
                    style: {size: xs, color: $theme.muted_foreground}
          - SettingPage: Icons
            children:
              - SettingsGroup: Iconify cache
                children:
                  - SettingItem: Cache directory
                    children:
                      - Input:
                        value: bind $studio.icon_cache
                        placeholder: "~/.cache/gpui-forge/iconify"
                        on change: apply_icon_cache()
                  - Text: Iconify sets, name catalogs and vendored SVGs are stored here. Empty means the platform default cache dir.
                    style: {size: xs, color: $theme.muted_foreground}
      - HStack:
        style: {justify: end, gap: 8px}
        children:
          - Button: Save
            variant: Ghost
            on click: persist_prefs()
          - Button: Close
            variant: Primary
            on click: close_prefs()

# ============================================================================
# THE NEW PROJECT DIALOG
# ============================================================================
# File → New Project… — opens a fresh document in the editor. A folder is
# only asked for on save (#133).
Dialog#new-project:
  style:
    width: 420px
    padding: 16px
    gap: 12px
    radius: 8px
    background: $theme.background
    border: 1px
    border-style: solid
    border-color: $theme.border
  children:
    - Text: New Forge project
      style: {size: lg, weight: semibold}
    - Input:
      value: bind $name
      placeholder: project name
    - Select:
      options: $bases
      value: bind $base
      placeholder: base component system
    - HStack:
      style: {justify: end, gap: 8px}
      children:
        - Button: Create
          variant: Primary
          on click: create_project()

# ============================================================================
# THE RENAME DIALOG
# ============================================================================
# #148 — the project tree's "Rename…" context action. `files_rename(path)`
# stashes the target in `studio.rename_target` and opens this with the
# input pre-seeded to the current name.
Dialog#rename:
  style:
    width: 380px
    padding: 16px
    gap: 12px
    radius: 8px
    background: $theme.background
    border: 1px
    border-style: solid
    border-color: $theme.border
  children:
    - Text: Rename
      style: {size: lg, weight: semibold}
    - Input:
      value: bind $name
      placeholder: new name
    - HStack:
      style: {justify: end, gap: 8px}
      children:
        - Button: Cancel
          variant: Ghost
          on click: close_dialog()
        - Button: Rename
          variant: Primary
          on click: rename_file()



# ============================================================================
# The ROOT Element - where it all begins
# ============================================================================
root:
  VStack#studio:
  style:
    width: full
    height: full
  children:
    - TitleBar:
      <<: *titleBar
    - HStack#body:
      <<: *body
    - Separator:
    - HStack#statusbar: 
      <<: *statusBar





# ============================================================================
# CONDITIONAL EXAMPLES
# ============================================================================
# `match:` switches on one binding with `case <value>:` arms and an `else:`
# fallback. For two-way or chained tests, `if:` renders `children:` when the
# condition holds (or equals `is:`/differs from `not:`) — `else → if` chains
# give the elsif shape.
preview: &preview
  style:
    width: full
    height: full
  children:
    - match: $studio.preview
      case gpui:
        - Text: "GPUI Preview"
          style:
            size: lg
            weight: semibold
      case web:
        - Text: "Web Preview"
          style:
            size: lg
            weight: semibold
      else:
        - Text: "No preview active"
          style:
            size: sm
            color: $theme.muted_foreground

ifChain: &ifChain
  children:
    - if: $studio.preview
      is: gpui
      children:
        - Text: "GPUI Preview"
      else:
        - if: $studio.preview
          is: web
          children:
            - Text: "Web Preview"
          else:
            - Text: "No preview active"


# ============================================================================
# FOR LOOP EXAMPLE
# ============================================================================
# `for:` repeats `children:` per item. `each:` names the scoped var (bound as
# `$item`), `index:` optionally names the index, `else:` renders when the
# list is empty.
forLoop: &forLoop
  style:
    width: full
    height: full
  children:
    - for: $studio.renderer_names
      each: item
      children:
        - Text: "{$item}"
          style:
            size: sm
            color: $theme.muted_foreground
      else:
        - Text: "No renderers"


# ============================================================================
# TEMPLATE EXAMPLES
# ============================================================================
# `for:` over object lists exposes fields via `$tab.name`. A single (non-list)
# value iterates once. `with:`/`as:` scopes one value explicitly, and
# `if:`/`for:`/`with:` double as modifiers on any element.
template: &template
  style:
    width: full
    height: full
  children:
    - for: $studio.tabs
      each: tab
      index: i
      children:
        - Text: "{$i}: {$tab.name}"
          style:
            size: sm
            color: $tab.color
    - with: $studio.selected_tab
      as: tab
      children:
        - Text: "Selected: {$tab.name}"
    # modifiers — the element repeats per tab / renders only when signed in
    - Tab: "{$tab.name}"
      for: $studio.tabs
      each: tab
    - Text: "Signed in"
      if: $user.signed_in
