[package]
name = "forge-studio"
description = "The Forge Studio: native visual editor for Forge documents."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

# Studio's own UI is always built on gpui-kit. Canvases for other bases are
# rendered out of process by a per-base preview host (#97).
[dependencies]
forge-lib-ely = { path = "../forge-lib-ely" }
forge-hooks = { path = "../forge-hooks" }
forge-hooks-macros = { path = "../forge-hooks-macros" }
gpui-forge-runtime = { workspace = true, features = ["base-gpui-kit"] }
gpui-kit = { workspace = true, features = ["tree-sitter-yaml"] }
serde_json = "1"
forge-lib-gpui-component = { version = "0.1.0", path = "../forge-lib-gpui-component" }
forge-lib-video = { path = "../forge-lib-video" }
forge-lib-zorite = { path = "../forge-lib-zorite" }

[lints]
workspace = true
