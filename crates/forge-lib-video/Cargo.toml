[package]
name = "forge-lib-video"
description = "gpui-video-player adapter for GPUI Forge (video.* namespaced elements)."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

# Two variants (#77): `base-gpui-kit` links the crate's `gpui-pre` feature
# (gpui_pre =0.3.9 — the gpui-kit base's pin); `base-gpui02` links its `gpui`
# (crates.io 0.2) feature for the Vanilla GPUI 0.2 base. Requires GStreamer
# 1.14+ and its plugins at build and run time.
[features]
default = ["base-gpui-kit"]
base-gpui-kit = [
    "dep:gpui-video-player",
    "gpui-video-player/gpui-pre",
    "gpui-forge-runtime/base-gpui-kit",
]
base-gpui02 = [
    "dep:gpui-video-player",
    "gpui-video-player/gpui",
    "gpui-forge-runtime/base-gpui02",
]

[dependencies]
gpui-video-player = { version = "0.1.3", optional = true, default-features = false }
gpui-forge-runtime = { path = "../gpui-forge-runtime", default-features = false }
serde_json = "1"
url = "2"

[lints]
workspace = true
