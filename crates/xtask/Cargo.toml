[package]
name = "xtask"
description = "Project automation — `cargo xtask <verb>` runs the workspace's build/test/host workflows."
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# `xtask components` — catalogs parse through forge-spec; `syn` indexes the
# upstream crate sources the drift check downloads from crates.io.
forge-spec = { path = "../forge-spec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
syn = { version = "3", features = ["full"] }

[lints]
workspace = true
