[package]
name = "forge-preview"
description = "Out-of-process Forge document preview host — one binary per base."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

# One base per binary — `cargo build -p forge-preview` produces `forge-preview`
# (gpui-kit); `--no-default-features --features base-gpui02` produces
# `forge-preview-gpui02`.
[[bin]]
name = "forge-preview"
path = "src/main_gpui_kit.rs"
required-features = ["base-gpui-kit"]

[[bin]]
name = "forge-preview-gpui02"
path = "src/main_gpui02.rs"
required-features = ["base-gpui02"]

[[bin]]
name = "forge-preview-bezel"
path = "src/main_bezel.rs"
required-features = ["base-bezel"]

[[bin]]
name = "forge-preview-ratatui"
path = "src/main_ratatui.rs"
required-features = ["base-ratatui"]

[[bin]]
name = "forge-preview-iced"
path = "src/main_iced.rs"
required-features = ["base-iced"]

[features]
default = ["base-gpui-kit"]
base-gpui-kit = [
    "dep:gpui-kit",
    "gpui-forge-runtime/base-gpui-kit",
    "dep:forge-lib-ely",
    "dep:forge-lib-gpui-component",
    "dep:forge-lib-video",
    "dep:forge-lib-zorite",
    "dep:forge-lib-hig",
    "dep:forge-lib-base",
    "dep:forge-lib-flow",
]
base-gpui02 = [
    "dep:gpui",
    "dep:guise-ui",
    "gpui-forge-runtime/base-gpui02",
    "dep:forge-lib-gpui02",
    "forge-lib-gpui02/ferrum",
    "forge-lib-gpui02/rhythm",
    "forge-lib-gpui02/symbols",
]
base-bezel = ["dep:bezel", "gpui-forge-runtime/base-bezel"]
base-ratatui = ["dep:ratatui", "dep:crossterm", "gpui-forge-runtime/base-ratatui"]
base-iced = ["dep:iced", "gpui-forge-runtime/base-iced"]

[dependencies]
gpui-forge-runtime = { path = "../gpui-forge-runtime", default-features = false }
forge-lib-gpui02 = { path = "../forge-lib-gpui02", optional = true, default-features = false }
# The gpui-kit host registers the same adapter set Studio does — same-base
# docs preview out of process with `alias.Name` elements intact.
forge-lib-ely = { path = "../forge-lib-ely", optional = true }
forge-lib-gpui-component = { path = "../forge-lib-gpui-component", optional = true }
forge-lib-video = { path = "../forge-lib-video", optional = true }
forge-lib-zorite = { path = "../forge-lib-zorite", optional = true }
forge-lib-hig = { path = "../forge-lib-hig", optional = true }
forge-lib-base = { path = "../forge-lib-base", optional = true }
forge-lib-flow = { path = "../forge-lib-flow", optional = true }
gpui-kit = { version = "=0.8.1", optional = true }
gpui = { version = "=0.2.2", optional = true }
guise-ui = { version = "1.10", optional = true }
bezel = { version = "0.2.24", optional = true, features = ["platform"] }
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", optional = true }
iced = { version = "0.13", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11rb = "0.14.0"
raw-window-handle = "0.6.2"

[lints]
workspace = true
