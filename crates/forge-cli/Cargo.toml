[package]
name = "forge-cli"
description = "The Forge toolchain: check, build and package Forge documents."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
gpui-forge-runtime = { workspace = true, features = ["base-gpui-kit"] }
forge-lib-gpui-component = { version = "0.9.1", path = "../forge-lib-gpui-component" }

[lints]
workspace = true
