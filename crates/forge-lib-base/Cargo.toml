[package]
name = "forge-lib-base"
description = "Base GPUI adapter for GPUI Forge (base.* namespaced elements on the gpui-kit base)."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# Vendored port (#85): upstream base-gpui pins a Zed git rev of `gpui` —
# retargeted to the gpui-kit base's gpui-pre =0.3.10. MIT.
base-gpui = { path = "../../vendor/base-gpui" }
gpui-forge-runtime = { path = "../gpui-forge-runtime" }
serde_json = "1"

[dev-dependencies]
# Live interaction tests drive a real window through gpui's test platform —
# same pin + harness as vendor/base-gpui's tests.
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }

[lints]
workspace = true
