[package]
name = "forge-term"
description = "alacritty_terminal-backed terminal emulation for Forge: ANSI bytes in, styled cell grid out, gpui canvas paint."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["gpui"]
gpui = ["dep:gpui"]

[dependencies]
alacritty_terminal = "0.26"
gpui = { version = "=0.3.10", package = "gpui-pre", optional = true }

[lints]
workspace = true
