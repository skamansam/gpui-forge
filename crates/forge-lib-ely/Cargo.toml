[package]
name = "forge-lib-ely"
description = "Ely GPUI Components adapter for GPUI Forge (ely.* namespaced elements)."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
ely-core = "0.2"
# Ely's terminal chapter (published 0.1.1 pins gpui =0.3.10 — same as gpui-kit
# 0.8.1). `Terminal`/`Launch`/`bind_keys` are wasm-absent. `AnsiText`/
# `LogViewer`/shell pickers build everywhere (vte only).
ely-terminal = "0.1.1"
gpui-forge-runtime = { path = "../gpui-forge-runtime" }
jiff = "0.2"
serde_json = "1"
anyhow = "1"
web-time = "1"

[lints]
workspace = true
